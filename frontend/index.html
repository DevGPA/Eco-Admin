<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Alta de Clientes · GPA</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="topbar" id="topbar" hidden>
  <div class="gpa-logo">
    <svg class="gpa-badge" viewBox="0 0 36 36" fill="none" role="img" aria-label="GPA">
      <circle cx="18" cy="18" r="17" fill="#1C2535" stroke="rgba(58,173,173,.4)" stroke-width="1"/>
      <path d="M4 22 Q9 17 14 22 Q19 27 24 22 Q29 17 34 22" stroke="#3AADAD" stroke-width="1.5" fill="none" opacity=".6"/>
      <text x="18" y="19" text-anchor="middle" font-family="Nunito,Arial" font-weight="900" font-size="11" fill="white">GPA</text>
    </svg>
    <div class="gpa-wordmark">
      <div class="gpa-w1">GPA Admin</div>
      <div class="gpa-w2">Alta de Clientes</div>
    </div>
  </div>
  <div class="subnav" id="subnav"></div>
  <div class="row" id="sesion-box"></div>
</header>

<main id="app">
  <div class="wrap" style="padding-top:60px; text-align:center">
    <p class="dim">Cargando…</p>
  </div>
</main>

<footer class="foot" id="foot" hidden>
  Formatos <span class="mono">PNO-VE01-F3</span> (Alta de Cliente Distribuidor) y
  <span class="mono">CYC-FT-001 Rev.03</span> (Solicitud de Crédito).
  Régimen fiscal según el catálogo <span class="mono">c_RegimenFiscal</span> del SAT.
</footer>

<!-- config.js lo genera Amplify en cada despliegue (ver amplify.yml).
     Para probar en local: copie config.example.js a config.js y llene los datos. -->
<script src="config.js"></script>
<script src="gpa-api.js"></script>
<script src="app.js"></script>
</body>
</html>
