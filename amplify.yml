# amplify.yml — AWS Amplify Hosting (SOLO el monitor / dashboard web)
# ─────────────────────────────────────────────────────────────────
# IMPORTANTE: Amplify hostea el FRONTEND (el monitor). El BACKEND del motor
# (Lambda, DynamoDB, S3, SQS, Cognito, Textract) NO va en Amplify: se despliega
# con AWS SAM (template.yaml). Ver docs/DESPLIEGUE.md.
#
# Este build arma un sitio estático en dist/ con:
#   index.html       ← el monitor (monitor-v24-gpa.html) + el SDK gpa-api.js
#   gpa-api.js        ← SDK (Cognito + API Gateway)
#   simulador.html   ← simulador de evaluación
#   api-reference.html
#
# El monitor arranca en "modo demo offline". Para conectarlo al motor real,
# edita GPA_CONFIG (apiUrl, poolId, clientId) con los Outputs del stack SAM.
# ─────────────────────────────────────────────────────────────────
version: 1
frontend:
  phases:
    build:
      commands:
        - mkdir -p dist
        - cp docs/monitor/monitor-v24-gpa.html dist/index.html
        - cp frontend/gpa-api.js dist/gpa-api.js
        - cp docs/monitor/simulador-v22.html dist/simulador.html
        - cp docs/specs/api-reference.html dist/api-reference.html
        # Cargar el SDK en el monitor con cache-busting: el ?v=<hash> cambia cuando
        # cambia gpa-api.js, forzando al navegador a bajar la version nueva (sin esto,
        # un gpa-api.js viejo cacheado deja el Kanban vacio porque le falta cargarKanban).
        - VER=$(sha256sum frontend/gpa-api.js | cut -c1-8); sed -i "s#</body>#  <script src=\"gpa-api.js?v=$VER\"></script>\n</body>#" dist/index.html
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []

# Control de caché: el index.html (monitor) NO debe cachearse en el navegador,
# o los cambios no llegan aunque Amplify ya publicó (el usuario se queda con el
# HTML viejo). 'no-cache' obliga a revalidar contra el servidor en cada carga
# (rápido: 304 si no cambió). El gpa-api.js sí se cachea porque va con ?v=<hash>
# que cambia cuando cambia el archivo.
customHeaders:
  - pattern: '**/*.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
