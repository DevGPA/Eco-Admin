# amplify.yml — AWS Amplify Hosting (monorepo)
# ─────────────────────────────────────────────────────────────────
# El frontend que se hospeda es la PWA de GPA Operaciones, que vive en la
# subcarpeta Operaciones-GPA/. Por eso se usa el formato "applications" con
# appRoot — Amplify entra a esa carpeta y las rutas de abajo son relativas a ella.
#
# El build no usa npm: el único paso genera frontend/config.js a partir de las
# variables de entorno definidas en la consola de Amplify (App settings →
# Environment variables):
#   API_URL   = https://xxxx.execute-api.us-east-1.amazonaws.com/prod  (Output ApiUrl del stack SAM)
#   POOL_ID   = us-east-1_XXXXXXXXX                                      (Output UserPoolId)
#   CLIENT_ID = XXXXXXXXXXXXXXXXXXXXXXXXXX                               (Output UserPoolClientId)
#   APP_ENV   = prod | dev
#   (AWS_REGION lo provee Amplify automáticamente)
#
# El BACKEND (Lambda, API Gateway, DynamoDB, S3, Cognito, SNS) NO va en Amplify:
# se despliega con AWS SAM (Operaciones-GPA/template.yaml).
# ─────────────────────────────────────────────────────────────────
version: 1
applications:
  - appRoot: Operaciones-GPA
    frontend:
      phases:
        build:
          commands:
            - 'echo "window.GPA_CONFIG={apiUrl:\"$API_URL\",region:\"${AWS_REGION:-us-east-1}\",poolId:\"$POOL_ID\",clientId:\"$CLIENT_ID\",env:\"${APP_ENV:-prod}\"};" > frontend/config.js'
            - 'echo "config.js generado:" && cat frontend/config.js'
      artifacts:
        baseDirectory: frontend
        files:
          - '**/*'
      cache:
        paths: []
