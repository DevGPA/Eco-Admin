# amplify.yml — Build spec de AWS Amplify Hosting (GPA Alta de Clientes)
# ─────────────────────────────────────────────────────────────────
# El frontend es estático: no hay build de npm. El único paso genera config.js
# con las variables de entorno que se definen en la consola de Amplify
# (App settings → Environment variables):
#
#   API_URL     = https://xxxx.execute-api.us-east-1.amazonaws.com/dev   (Output ApiUrl)
#   POOL_ID     = us-east-1_XXXXXXXXX                                    (Output UserPoolId)
#   CLIENT_ID   = XXXXXXXXXXXXXXXXXXXXXXXXXX                             (Output UserPoolClientId)
#   PORTAL_URL  = https://altaclientes.gpa.com.mx   (la dirección definitiva del portal;
#                 déjela vacía mientras IT no haya apuntado el DNS)
#   APP_ENV     = dev | prod
#   (AWS_REGION lo pone Amplify por su cuenta)
#
# MONOREPO: este proyecto vive en la rama `alta-clientes` del repo Eco-Admin y
# ocupa la raíz de esa rama, así que el app root se deja VACÍO.
# ─────────────────────────────────────────────────────────────────
version: 1
frontend:
  phases:
    build:
      commands:
        - 'echo "window.GPA_CONFIG={apiUrl:\"$API_URL\",region:\"${AWS_REGION:-us-east-1}\",poolId:\"$POOL_ID\",clientId:\"$CLIENT_ID\",portalUrl:\"$PORTAL_URL\",env:\"${APP_ENV:-dev}\"};" > frontend/config.js'
        - 'echo "config.js generado:" && cat frontend/config.js'
  artifacts:
    baseDirectory: frontend
    files:
      - '**/*'
  cache:
    paths: []
