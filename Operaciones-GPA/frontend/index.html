const MX_TZ="America/Mexico_City";const MX_MS=21600000; // UTC-6 fijo (México, sin horario de verano)
const fdate=s=>{try{return new Date(s).toLocaleDateString("es-MX",{timeZone:MX_TZ})}catch{return s}};

function useSig(ref){
  const drawing=useRef(false);
  const start=e=>{drawing.current=true;const c=ref.current;const ctx=c.getContext("2d");const r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo((e.touches?.[0]||e).clientX-r.left,(e.touches?.[0]||e).clientY-r.top);};
  const move=e=>{if(!drawing.current)return;const c=ref.current;const ctx=c.getContext("2d");const r=c.getBoundingClientRect();ctx.lineTo((e.touches?.[0]||e).clientX-r.left,(e.touches?.[0]||e).clientY-r.top);ctx.strokeStyle=C.blue;ctx.lineWidth=2;ctx.stroke();};
  const end=()=>{drawing.current=false;};
  const clear=cb=>{ref.current?.getContext("2d").clearRect(0,0,400,150);cb&&cb(null);};
  return{start,move,end,clear};
}
// "FastLoad": redimensiona (máx IMG_MAX px por lado) y codifica en WebP —mucho más
// ligero que JPEG a igual calidad— con respaldo a JPEG si el navegador no puede
// exportar WebP. Así las fotos suben más rápido y pesan menos. No-imágenes: original.
const IMG_MAX=1152, IMG_Q=0.55;
let _webpOK; const soportaWebp=()=>{if(_webpOK===undefined){try{const c=document.createElement("canvas");c.width=c.height=1;_webpOK=c.toDataURL("image/webp").indexOf("data:image/webp")===0;}catch{_webpOK=false;}}return _webpOK;};
const readFile=(e,cb)=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    const src=ev.target.result;
    if(!/^image\//.test(f.type||"")){cb(src);return;}
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>=h&&w>IMG_MAX){h=Math.round(h*IMG_MAX/w);w=IMG_MAX;}
      else if(h>w&&h>IMG_MAX){w=Math.round(w*IMG_MAX/h);h=IMG_MAX;}
      try{const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);abrirRecorte(c.toDataURL(soportaWebp()?"image/webp":"image/jpeg",IMG_Q),cb);}
      catch{cb(src);}
    };
    img.onerror=()=>cb(src);
    img.src=src;
  };
  r.readAsDataURL(f);
};

// ── Recorte de foto: tras capturar, el usuario deja solo lo necesario. ─────────
// Overlay imperativo (sin librerías): imagen ajustada + recuadro arrastrable con
// 4 esquinas (eventos pointer = táctil y ratón). «Recortar» corta del dataURL ya
// comprimido; «Foto completa» usa la original; «Cancelar» descarta la captura.
// Se engancha en readFile, así que aplica a TODAS las fotos de la app.
function abrirRecorte(dataURL,cb){
  const img=new Image();
  img.onerror=()=>cb(dataURL);
  img.onload=()=>{
    const W0=img.width,H0=img.height;
    const availW=Math.min(window.innerWidth-24,600),availH=Math.max(window.innerHeight-180,120);
    const esc=Math.min(availW/W0,availH/H0,1);
    const W=Math.max(1,Math.round(W0*esc)),H=Math.max(1,Math.round(H0*esc));
    const ov=document.createElement("div");
    ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;padding:12px";
    ov.innerHTML='<div style="color:#fff;font-size:13px;font-weight:600;margin-bottom:8px">Arrastra el recuadro para dejar solo lo necesario</div>'
      +'<div id="rc-wrap" style="position:relative;overflow:hidden;border-radius:8px;width:'+W+'px;height:'+H+'px">'
      +'<img src="'+dataURL+'" style="width:100%;height:100%;display:block;-webkit-user-drag:none" draggable="false"/>'
      +'<div id="rc-rect" style="position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move"></div>'
      +'</div>'
      +'<div style="display:flex;gap:8px;margin-top:12px;width:100%;max-width:'+Math.max(W,300)+'px">'
      +'<button id="rc-x" style="flex:1;padding:11px 6px;border-radius:9px;border:1px solid #777;background:transparent;color:#ddd;font-size:13px">Cancelar</button>'
      +'<button id="rc-full" style="flex:1;padding:11px 6px;border-radius:9px;border:1px solid #aaa;background:#fff;color:#333;font-size:13px">Foto completa</button>'
      +'<button id="rc-ok" style="flex:1.2;padding:11px 6px;border-radius:9px;border:none;background:#185FA5;color:#fff;font-weight:700;font-size:13px">✓ Recortar</button>'
      +'</div>';
    document.body.appendChild(ov);
    const rect=ov.querySelector("#rc-rect"),wrap=ov.querySelector("#rc-wrap");
    ["nw","ne","sw","se"].forEach(hn=>{const h=document.createElement("div");h.dataset.h=hn;
      h.style.cssText="position:absolute;width:32px;height:32px;"+(hn[0]==="n"?"top:-16px;":"bottom:-16px;")+(hn[1]==="w"?"left:-16px;":"right:-16px;")+"touch-action:none";
      const dot=document.createElement("div");dot.style.cssText="position:absolute;inset:9px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5)";
      h.appendChild(dot);rect.appendChild(h);});
    let r={x:Math.round(W*0.07),y:Math.round(H*0.07),w:Math.round(W*0.86),h:Math.round(H*0.86)};
    const MIN=48;
    const pinta=()=>{rect.style.left=r.x+"px";rect.style.top=r.y+"px";rect.style.width=r.w+"px";rect.style.height=r.h+"px";};
    pinta();
    let drag=null;
    const pos=ev=>{const b=wrap.getBoundingClientRect();return{x:ev.clientX-b.left,y:ev.clientY-b.top};};
    ov.addEventListener("pointerdown",ev=>{
      const t=ev.target;
      const hn=(t.dataset&&t.dataset.h)||(t.parentElement&&t.parentElement.dataset&&t.parentElement.dataset.h);
      if(hn){drag={m:"r",hn,p0:pos(ev),r0:{...r}};ev.preventDefault();}
      else if(t===rect){drag={m:"m",p0:pos(ev),r0:{...r}};ev.preventDefault();}
    });
    ov.addEventListener("pointermove",ev=>{
      if(!drag)return;ev.preventDefault();
      const p=pos(ev),dx=p.x-drag.p0.x,dy=p.y-drag.p0.y,o=drag.r0;
      if(drag.m==="m"){r.x=Math.min(Math.max(0,o.x+dx),W-o.w);r.y=Math.min(Math.max(0,o.y+dy),H-o.h);}
      else{let x1=o.x,y1=o.y,x2=o.x+o.w,y2=o.y+o.h;
        if(drag.hn[1]==="w")x1=Math.min(Math.max(0,o.x+dx),x2-MIN);else x2=Math.max(Math.min(W,o.x+o.w+dx),x1+MIN);
        if(drag.hn[0]==="n")y1=Math.min(Math.max(0,o.y+dy),y2-MIN);else y2=Math.max(Math.min(H,o.y+o.h+dy),y1+MIN);
        r={x:x1,y:y1,w:x2-x1,h:y2-y1};}
      pinta();
    });
    const fin=()=>{drag=null;};
    ov.addEventListener("pointerup",fin);ov.addEventListener("pointercancel",fin);
    const cierra=()=>{try{document.body.removeChild(ov);}catch(e){}};
    ov.querySelector("#rc-x").onclick=()=>cierra();
    ov.querySelector("#rc-full").onclick=()=>{cierra();cb(dataURL);};
    ov.querySelector("#rc-ok").onclick=()=>{
      try{
        const sx=Math.round(r.x/esc),sy=Math.round(r.y/esc),sw=Math.max(1,Math.round(r.w/esc)),sh=Math.max(1,Math.round(r.h/esc));
        const c=document.createElement("canvas");c.width=sw;c.height=sh;
        c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,sw,sh);
        cierra();cb(c.toDataURL(soportaWebp()?"image/webp":"image/jpeg",0.8));
      }catch(e){cierra();cb(dataURL);}
    };
  };
  img.src=dataURL;
}

// Genera un PDF con diseño corporativo (encabezado GPA + el formato lleno).
// Toma el contenido del detalle (.pdf-area), quita botones (.no-print) y convierte
// las imágenes de S3 a dataURL para evitar problemas de CORS al renderizar.
// Motivos por los que una imagen no se pudo bajar (los junta pdfDeArea para avisar).
let _pdfFallas=[];
// Una URL firmada de S3 trae su fecha (X-Amz-Date) y su duración (X-Amz-Expires):
// con eso se sabe con CERTEZA si ya estaba vencida al intentar bajarla. Es clave para
// distinguir "el enlace venció" de "la descarga está bloqueada (permisos/CORS)", que
// en el navegador producen el mismo error genérico "Failed to fetch".
// Huella de la URL que falló: de dónde se abrió la app (para comparar con el CORS
// autorizado del bucket), a qué host se pidió la foto y QUÉ parámetros lleva (solo los
// nombres, nunca los valores de la firma). Sin esto no se puede saber si el problema es
// el origen, un enlace sin firmar o un formato de firma distinto al esperado.
function _diagUrl(url){
  try{const u=new URL(url,location.href);
    const ps=[...u.searchParams.keys()].map(k=>k.replace(/^X-Amz-/,"")).join(",");
    return "origen="+location.origin+" · host="+u.hostname+" · params=["+(ps||"NINGUNO")+"]";
  }catch(e){return "origen="+location.origin+" · URL ilegible: "+String(url).slice(0,60);}
}
function _estadoFirma(url){
  try{
    const q=new URL(url,location.href).searchParams;
    let vence=null,dur=null;
    const d=q.get("X-Amz-Date"),ex=q.get("X-Amz-Expires");
    if(d&&ex){                                  // firma moderna (SigV4): fecha + duración
      const t=Date.UTC(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8),+d.slice(9,11),+d.slice(11,13),+d.slice(13,15));
      vence=t+(+ex)*1000;dur=+ex;
    }else if(q.get("Expires")){                 // firma clásica (SigV2): vencimiento absoluto
      vence=(+q.get("Expires"))*1000;
    }
    if(!vence)return "";                        // no es una URL firmada (p. ej. logo)
    const min=Math.round(Math.abs(Date.now()-vence)/60000);
    return Date.now()>vence
      ?("enlace VENCIDO hace "+min+" min"+(dur?", duraba "+Math.round(dur/60)+" min":""))
      :("enlace VIGENTE aún "+min+" min → no fue el tiempo, revisar permisos");
  }catch(e){return "";}
}
// Junta las URLs de evidencia de un registro indexadas por la RUTA del objeto, para
// poder sustituir un enlace vencido por otro recién firmado (la ruta no cambia).
function _mapaUrls(obj,acc){
  acc=acc||{};
  if(typeof obj==="string"){if(/^https?:\/\//.test(obj)){try{acc[new URL(obj).pathname]=obj;}catch(e){}}return acc;}
  if(Array.isArray(obj)){obj.forEach(v=>_mapaUrls(v,acc));return acc;}
  if(obj&&typeof obj==="object"){Object.values(obj).forEach(v=>_mapaUrls(v,acc));return acc;}
  return acc;
}
// Vuelve a pedir el registro al servidor (solo su día) para obtener enlaces de evidencia
// RECIÉN firmados. Así el PDF sale con fotos aunque el registro se haya abierto hace
// rato o sea de hace años: es el arreglo de fondo al "no salen las fotos en el PDF".
async function urlsFrescas(tipo,reg,plantillaClave){
  try{
    if(!reg||!reg.fecha||!reg.id)return null;
    const d=ymd(reg.fecha),r={desde:d,hasta:d};
    const lista=plantillaClave?await api.listarFormulario(plantillaClave,r):await api.listar(tipo,r);
    const fresco=(lista||[]).find(x=>String(x.id)===String(reg.id));
    return fresco?_mapaUrls(fresco):null;
  }catch(e){return null;}
}
// Convierte una URL (S3/local) a dataURL; null si falla, anotando el MOTIVO.
// Distingue los dos casos reales: enlace vencido (403 de S3) vs bloqueado/sin red.
// Antes, un 403 devolvía el XML de error y se incrustaba como si fuera una imagen.
async function _aDataURL(url){
  try{
    // cache:"reload" es CLAVE, no una optimización: cuando la foto ya se mostró con una
    // etiqueta <img>, el navegador guardó esa respuesta SIN encabezados CORS (la etiqueta
    // no los pide). Un fetch posterior de la MISMA URL se sirve de esa copia, no
    // encuentra los encabezados y falla con el genérico "Failed to fetch" aunque el
    // enlace sea válido y el bucket tenga el CORS correcto. Forzar la red hace que S3
    // vuelva a responder, ahora con los encabezados que el fetch necesita.
    let r;
    try{r=await fetch(url,{cache:"reload"});}
    catch(e0){r=await fetch(url);}      // navegador que no soporte la opción
    if(!r.ok){const st=_estadoFirma(url);_pdfFallas.push("HTTP "+r.status+(st?" — "+st:"")+" — "+_diagUrl(url));return null;}
    const b=await r.blob();
    if(b.type&&b.type.indexOf("image/")!==0){_pdfFallas.push("no es imagen ("+b.type+") — "+_diagUrl(url));return null;}
    return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>{_pdfFallas.push("lectura fallida");res(null);};fr.readAsDataURL(b);});
  }catch(e){const st=_estadoFirma(url);
    _pdfFallas.push("bloqueada ("+((e&&e.message)||e)+")"+(st?" — "+st:" — sin datos de firma")+" — "+_diagUrl(url));
    return null;}
}
// jsPDF 2.5.1 no embebe WebP: convierte un dataURL WebP a JPEG para el PDF (otros formatos se dejan igual).
async function _jpegDataURL(dataURL){
  if(!dataURL||dataURL.indexOf("data:image/webp")!==0)return dataURL;
  return await new Promise(res=>{const img=new Image();img.onload=()=>{try{const c=document.createElement("canvas");c.width=img.width;c.height=img.height;c.getContext("2d").drawImage(img,0,0);res(c.toDataURL("image/jpeg",0.85));}catch(e){res(dataURL);}};img.onerror=()=>res(dataURL);img.src=dataURL;});
}
// Logo cacheado (para no re-descargarlo en exportaciones masivas)
let _logoCache;
async function _logoData(){ if(_logoCache===undefined)_logoCache=await _aDataURL("logo.png"); return _logoCache; }

// Construye el PDF corporativo a partir de un elemento .pdf-area y DEVUELVE el doc
// jsPDF (sin guardarlo). Reutilizable para descarga individual y masiva (ZIP).
// NO usa html2canvas → funciona en iPhone/Android/PC.
async function pdfDeArea(area,frescas){
  if(!area)return null;
  const JS=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
  if(!JS)return null;
  const titulo=area.dataset.pdftitle||"Formato GPA";
  const suc=area.dataset.pdfsucursal||"";
  const domicilio=DOMICILIOS[suc]||"";
  const clone=area.cloneNode(true);
  // .no-print = controles de pantalla. .pdf-omit = fotos de RUTINA de los checklists:
  // se ven en pantalla pero NO van al PDF, para que el PDF quede compacto y las únicas
  // fotos sean la EVIDENCIA de los puntos en mal estado (+ km y firma).
  clone.querySelectorAll(".no-print,.pdf-omit").forEach(n=>n.remove());
  // Imágenes → dataURL. Si una NO se puede bajar (típicamente porque la URL firmada
  // de la evidencia ya expiró) se cuenta y se AVISA en el PDF: antes se descartaba en
  // silencio y el PDF salía sin fotos sin que nadie se enterara.
  let omitidas=0;_pdfFallas=[];
  for(const img of [...clone.querySelectorAll("img")]){let s=img.getAttribute("src");
    // Si hay enlaces recién firmados, se usa el de esta misma ruta (el vencido falla).
    if(frescas&&s&&s.indexOf("data:")!==0){try{const pth=new URL(s,location.href).pathname;if(frescas[pth])s=frescas[pth];}catch(e){}}
    let d=(s&&s.indexOf("data:")===0)?s:await _aDataURL(s);d=await _jpegDataURL(d);if(d)img.setAttribute("src",d);else{omitidas++;img.remove();}}
  const motivos=[...new Set(_pdfFallas)].join("; ");
  if(omitidas)console.warn("PDF: "+omitidas+" imagen(es) omitidas. Motivos: "+motivos);
  const logoData=await _logoData();

  const doc=new JS({unit:"mm",format:"a4"});
  const PW=210,PH=297,M=12,CW=PW-2*M;let y=M;
  const ensure=h=>{if(y+h>PH-M){doc.addPage();y=M;}};
  const heading=t=>{t=(t||"").trim();if(!t)return;y+=2;ensure(8);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(24,95,165);doc.text(t,M,y);y+=2;doc.setDrawColor(225);doc.setLineWidth(0.2);doc.line(M,y,PW-M,y);y+=4;};
  const para=(t,o)=>{t=(t||"").trim();if(!t)return;o=o||{};const sz=o.size||10;doc.setFont("helvetica",o.bold?"bold":"normal");doc.setFontSize(sz);doc.setTextColor.apply(doc,o.color||[40,40,40]);const ls=doc.splitTextToSize(t,CW);for(const ln of ls){ensure(sz*0.5+1);doc.text(ln,M,y);y+=sz*0.42+1.8;}};
  const kv=(l,v)=>{l=(l||"").trim();v=(v==null?"":String(v)).trim();if(!l&&!v)return;doc.setFontSize(10);const L=doc.splitTextToSize(l,CW*0.44),R=doc.splitTextToSize(v,CW*0.52);const rows=Math.max(L.length,R.length);ensure(rows*4.6+1);doc.setFont("helvetica","normal");doc.setTextColor(120);doc.text(L,M,y);doc.setTextColor(40);doc.text(R,M+CW*0.46,y);y+=rows*4.6+1.5;};
  const addImg=d=>{try{const p=doc.getImageProperties(d);const s=Math.min((CW*0.62)/p.width,58/p.height);const w=p.width*s,h=p.height*s;ensure(h+3);doc.addImage(d,(p.fileType==="PNG"?"PNG":"JPEG"),M,y,w,h);y+=h+3;}catch(e){}};

  // Encabezado corporativo
  if(logoData){try{const lp=doc.getImageProperties(logoData);const lh=15,lw=Math.min(lp.width*(lh/lp.height),22);doc.addImage(logoData,"PNG",M,y,lw,lh);}catch(e){}}
  doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(24,95,165);doc.text("General de Productos para el Agua",M+24,y+5);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(80);doc.text(titulo+(suc?" — "+suc:""),M+24,y+10);
  let hb=18;
  if(domicilio){doc.setFontSize(7.5);doc.setTextColor(120);const dl=doc.splitTextToSize(domicilio,CW-26);doc.text(dl,M+24,y+14);hb=14+dl.length*3;}
  doc.setFontSize(8);doc.setTextColor(150);doc.text(new Date().toLocaleString("es-MX",{timeZone:MX_TZ}),PW-M,y+4,{align:"right"});
  y+=hb;doc.setDrawColor(24,95,165);doc.setLineWidth(0.6);doc.line(M,y,PW-M,y);y+=5;

  // Chequeo de montacargas: ~30 puntos en DOS columnas (texto + resultado) para ahorrar hojas
  const compactChequeo=card=>{
    const ct=card.querySelector(".ct");heading(ct?ct.textContent:"Chequeo visual completo");
    const rows=[...card.children].filter(c=>c.tagName==="DIV"&&!(c.classList&&c.classList.contains("ct")));
    const items=rows.map(r=>{const sp=r.querySelectorAll("span");return {txt:(sp[0]?sp[0].textContent:"").trim(),res:(sp.length?sp[sp.length-1].textContent:"").trim()};});
    const half=Math.ceil(items.length/2),colW=CW/2-1,lh=3.3;
    const colColor=res=>res==="O"?[46,107,17]:res==="P"?[163,45,45]:[120,120,120];
    // Líneas envueltas del texto de un ítem (pregunta completa, sin recortar)
    const lineas=it=>it?doc.splitTextToSize(it.txt,colW-9):[];
    // Dibuja una celda (resultado + pregunta multilínea) a partir de y0; no mueve y
    const cell=(it,x,y0)=>{if(!it)return;doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor.apply(doc,colColor(it.res));doc.text((it.res||"").substring(0,3),x,y0);doc.setFont("helvetica","normal");doc.setTextColor(70);doc.text(lineas(it),x+8,y0);};
    doc.setFontSize(7.5);
    for(let i=0;i<half;i++){
      const L=items[i],R=items[i+half];
      const filas=Math.max(lineas(L).length,lineas(R).length,1);
      const alto=filas*lh+1.8;
      ensure(alto);
      cell(L,M,y);cell(R,M+CW/2+1,y);
      y+=alto;
    }
    y+=2;
  };
  // Recorrido del detalle
  const INL=["SPAN","B","A","STRONG","EM","SMALL","I"];
  const walk=node=>{
    for(const el of node.children){
      const tag=el.tagName;
      if(el.classList&&el.classList.contains("card")){const ct0=el.querySelector(".ct");if(ct0&&/chequeo visual/i.test(ct0.textContent)){compactChequeo(el);continue;}}
      if(tag==="IMG"){const s=el.getAttribute("src");if(s&&s.indexOf("data:")===0)addImg(s);continue;}
      if(tag==="BR")continue;
      if(el.classList&&el.classList.contains("ct")){heading(el.textContent);continue;}
      if(el.classList&&el.classList.contains("dr")){const sp=el.querySelectorAll("span");kv(sp[0]&&sp[0].textContent,sp[sp.length-1]&&sp[sp.length-1].textContent);continue;}
      const kids=[...el.children];
      if(kids.length>=2&&kids.every(c=>INL.includes(c.tagName))){const sp=kids;kv(sp[0].textContent,sp.slice(1).map(s=>s.textContent).join(" "));continue;}
      if(kids.length===0){para(el.textContent);continue;}
      walk(el);
    }
  };
  walk(clone);
  // Aviso visible: si faltaron fotos, que quede constancia en el propio documento,
  // con el MOTIVO técnico para poder corregir la causa (no solo "expiró").
  if(omitidas){y+=2;
    const venc=/VENCIDO|HTTP 40[13]/.test(motivos);
    para("⚠️ "+omitidas+" fotografía(s) no se pudieron incluir."
      +(venc?" El enlace de la evidencia ya había vencido: recarga la app (o vuelve a abrir el registro) y descarga el PDF de nuevo."
            :" La descarga fue bloqueada aunque el enlace estaba vigente: es un permiso del almacén de evidencias. Repórtalo con este texto.")
      ,{size:9,bold:true,color:[163,45,45]});
    para("Detalle técnico: "+motivos,{size:8,color:[140,140,140]});}
  doc._fotosOmitidas=omitidas;
  return doc;
}

// Renderiza un componente de detalle fuera de pantalla, espera a que carguen las
// imágenes y devuelve su elemento .pdf-area (para generar el PDF en lote).
async function _areaDeDetalle(render){
  const host=document.createElement("div");
  host.style.cssText="position:fixed;left:-99999px;top:0;width:430px;background:#fff;z-index:-1";
  document.body.appendChild(host);
  const root=ReactDOM.createRoot(host);
  await new Promise(res=>{root.render(render());setTimeout(res,60);});
  const imgs=[...host.querySelectorAll("img")];
  await Promise.all(imgs.map(im=>im.complete?Promise.resolve():new Promise(r=>{im.onload=im.onerror=r;setTimeout(r,4000);})));
  const area=host.querySelector(".pdf-area");
  return {area,cleanup:()=>{try{root.unmount();}catch(e){}host.remove();}};
}

// Exporta TODOS los registros (de una plantilla dinámica) como un ZIP de PDFs,
// uno por registro. onProg(i,total) para mostrar avance.
async function zipPdfsFormularios(plantilla,registros,onProg){
  const JSZip=window.JSZip;
  if(!JSZip){alert("No cargó la librería de ZIP. Reintenta en unos segundos.");return;}
  const zip=new JSZip();const usados={};let ok=0;
  for(let i=0;i<registros.length;i++){
    const reg=registros[i];onProg&&onProg(i+1,registros.length);
    try{
      const {area,cleanup}=await _areaDeDetalle(()=>React.createElement(FormDinamicoDetail,{reg,plantilla,onBack:()=>{},onEstado:()=>{}}));
      const doc=await pdfDeArea(area);cleanup();
      if(!doc)continue;
      let base=((plantilla&&plantilla.clave)||"reg")+"_"+ymd(reg.fecha)+"_"+(reg.sucursal||"").replace(/[^a-zA-Z0-9]+/g,"")+"_"+(reg.id||i);
      base=base.replace(/[^a-zA-Z0-9_\-]+/g,"_");
      if(usados[base])base+="_"+(++usados[base]);else usados[base]=1;
      zip.file(base+".pdf",doc.output("arraybuffer"));ok++;
    }catch(e){/* salta el registro problemático */}
  }
  if(!ok){alert("No se pudo generar ningún PDF.");return;}
  const blob=await zip.generateAsync({type:"blob"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download="PDFs_"+((plantilla&&plantilla.clave)||"formularios")+"_"+new Date().toISOString().slice(0,10)+".zip";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}

// Fecha local YYYY-MM-DD (para filtros por día) y descarga de CSV genérica
// Día calendario de CIUDAD DE MÉXICO (YYYY-MM-DD) de cualquier instante/fecha, sin depender
// de la zona del dispositivo (UTC-6 fijo). Se usa para filtros, historial y cumplimiento.
const ymd=f=>{if(!f)return"";const d=new Date(new Date(f).getTime()-MX_MS);return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");};
// Ventana por defecto de los listados: la app trae solo los últimos N días; si un
// filtro pide fechas más viejas, se consulta el archivo histórico al servidor.
// VENTANA_DIAS la actualiza App.cargarTodo() con cat.config.ventanaDias.
let VENTANA_DIAS=45;
const ventanaInicio=()=>ymd(new Date(Date.now()-VENTANA_DIAS*86400000));
// ¿El rango que pide el usuario SE SALE de la ventana cargada? Entonces hay que ir al
// archivo del servidor. Cubre los dos casos: "Desde" más viejo que la ventana Y el
// caso de SOLO "Hasta" (sin Desde), que antes no consultaba nada y devolvía vacío.
const fueraDeVentana=(desde,hasta)=>(!!desde&&desde<ventanaInicio())||(!desde&&!!hasta);
// Parámetros para pedir ese rango: sin "desde" el servidor aplicaría su ventana por
// defecto, así que en ese caso se pide todo el historial hasta la fecha indicada.
const rangoArchivo=(desde,hasta)=>({desde:desde||undefined,hasta:hasta||undefined,todo:!desde});
// Los formularios dinámicos pueden ser hasta ANUALES; el tablero de período
// vigente necesita todo el período. Son de BAJO volumen, así que se cargan con un
// rango amplio (cubre el período anual). Combustible/reparto/montacargas usan la
// ventana normal (sus períodos son ≤ mensual y caben en VENTANA_DIAS).
const SEG_FORM_INICIO=()=>ymd(new Date(Date.now()-370*86400000));
const mxDow=f=>new Date(new Date(f).getTime()-MX_MS).getUTCDay(); // 0=Dom..6=Sáb (hora de México)
const mxDia=(Y,M,d)=>new Date(Date.UTC(Y,M-1,d,18,0,0)); // instante ~mediodía de México del día Y-M-d
const mxHora=(ds,H)=>{const[y,m,d]=String(ds).split("-").map(Number);return new Date(Date.UTC(y,m-1,d,H+6,0,0));}; // instante de las H:00 (México) del día ds
// Categoría del vehículo: usa v.categoria si está definida; si no, la infiere
// (responsable ALMACEN o combustible Gas LP = montacargas; el resto = reparto). Editable en Admin/Excel.
// Normalización robusta: acentos/mayúsculas del catálogo no deben romper reglas
// ("Eléctrico" vs "Electrico", "GAS LP", activo como texto, etc.).
const normTxt=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const esElectrico=v=>normTxt(v&&v.combustible).includes("electric");
const esGasLP=v=>normTxt(v&&v.combustible).replace(/\s+/g,"").includes("gaslp");
const esActivoV=v=>!!v&&v.activo!==false&&v.activo!==0&&normTxt(v.activo)!=="false"&&normTxt(v.activo)!=="no";
const catVeh=v=>v.categoria||(((v.responsable||"").toUpperCase().includes("ALMACEN")||esGasLP(v))?"montacargas":"reparto");
// Folio de identificación de un registro: TIPO-ID único (se muestra en el detalle
// y se plasma en el PDF y en los CSV descargados).
const folioDe=r=>{if(!r||!r.id)return"";const t=String(r.tipo_reg||"REG").split("#")[0];return (t+"-"+String(r.id)).toUpperCase();};
// Campo de foto reutilizable (comprime al capturar vía readFile)

  const csv=[cols.join(","),...filas.map(r=>r.map(esc).join(","))].join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=nombre+".csv";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
// Unidades presentes en una lista de registros (para el filtro de unidad del historial)
// Sucursales presentes en un conjunto de registros. El filtro solo tiene sentido si

const sucursalesDe=items=>[...new Set((items||[]).map(r=>r.sucursal||"").filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es"));
const unidadesDe=items=>{const m={};(items||[]).forEach(r=>{const k=String(r.vehicleId??"");if(k&&!m[k])m[k]={id:k,label:"#"+(r.economico||k)+(r.placas?" · "+r.placas:"")};});return Object.values(m).sort((a,b)=>a.label.localeCompare(b.label,"es",{numeric:true}));};
// Componente reutilizable: filtro de unidad (opcional) + fechas (desde/hasta) + botón CSV

function Login({onLogin,onSetNewPassword}){
  const[u,setU]=useState("");const[p,setP]=useState("");const[err,setErr]=useState("");const[busy,setBusy]=useState(false);
  const[needNew,setNeedNew]=useState(false);const[np,setNp]=useState("");const[np2,setNp2]=useState("");
  const[fp,setFp]=useState(0);const[code,setCode]=useState("");const[msg,setMsg]=useState(""); // fp: 0 login · 1 pedir código · 2 confirmar
  const go=async()=>{
    setErr("");setBusy(true);
    try{ const r=await onLogin(u.trim(),p);
      if(r&&r.challenge==="NEW_PASSWORD_REQUIRED")setNeedNew(true);
      else if(r&&r.challenge==="PASSWORD_RESET_REQUIRED"){setErr("");setFp(1);setMsg("Tu administrador restableció tu contraseña. Pulsa \"Enviar código\" para recibir un código por correo y crear una nueva.");}
    }
    catch(e){ setErr(e.message||"No se pudo iniciar sesión"); }
    setBusy(false);
  };
  const setNew=async()=>{
    setErr("");
    if(np.length<8)return setErr("La contraseña debe tener al menos 8 caracteres");
    if(np!==np2)return setErr("Las contraseñas no coinciden");
    setBusy(true);
    try{ await onSetNewPassword(np); }
    catch(e){ setErr(e.message||"No se pudo establecer la contraseña"); }
    setBusy(false);
  };
  const pedirCodigo=async()=>{
    setErr("");setMsg("");
    if(!u||!u.includes("@"))return setErr("Escribe tu correo primero");
    setBusy(true);
    try{ await api.forgotPassword(u.trim()); setFp(2); setMsg("Te enviamos un código a tu correo. Revísalo (y la carpeta de spam)."); }
    catch(e){ setErr(e.message||"No se pudo enviar el código"); }
    setBusy(false);
  };
  const confirmar=async()=>{
    setErr("");
    if(!code.trim())return setErr("Escribe el código que recibiste");
    if(np.length<8)return setErr("La contraseña debe tener al menos 8 caracteres");
    if(np!==np2)return setErr("Las contraseñas no coinciden");
    setBusy(true);
    try{ await api.confirmForgotPassword(u.trim(),code,np); setFp(0);setMsg("Contraseña actualizada. Ya puedes iniciar sesión.");setCode("");setNp("");setNp2("");setP(""); }
    catch(e){ setErr(e.message||"No se pudo cambiar la contraseña"); }
    setBusy(false);
  };
  const volverLogin=()=>{setFp(0);setErr("");setMsg("");setCode("");setNp("");setNp2("");};
  return(
    <div className="lw">
      <style>{GCS}</style>
      <div style={{width:120,height:120,marginBottom:16,display:"flex",alignItems:"center",justifyContent:"center"}}><img src="logo.png" alt="GPA Aqua" style={{maxWidth:"100%",maxHeight:"100%",objectFit:"contain"}}/></div>
      <div style={{fontSize:17,fontWeight:700,color:"#222",marginBottom:4,textAlign:"center"}}>General de Productos para el Agua</div>
      <div style={{fontSize:13,color:"#888",marginBottom:24}}>Sistema de Gestión</div>
      <div style={{width:"100%",maxWidth:340}}>
        <div className="card">
          {needNew ? <>
            <div style={{fontSize:14,fontWeight:700,color:"#222",marginBottom:6}}>Establece tu nueva contraseña</div>
            <div style={{fontSize:11,color:"#888",marginBottom:12}}>Es tu primer ingreso. Define una contraseña (mín. 8 caracteres, con minúsculas y números).</div>
            <label>Nueva contraseña</label><input type="password" value={np} onChange={e=>setNp(e.target.value)} placeholder="••••••"/>
            <label>Confirmar contraseña</label><input type="password" value={np2} onChange={e=>setNp2(e.target.value)} placeholder="••••••" onKeyDown={e=>e.key==="Enter"&&setNew()}/>
            {err&&<div className="eb" style={{marginTop:8}}>{err}</div>}
            <button className="bp" onClick={setNew} disabled={busy||!np||!np2} style={{marginTop:14}}>{busy?"Guardando…":"Guardar y entrar"}</button>
          </> : fp===1 ? <>
            <div style={{fontSize:14,fontWeight:700,color:"#222",marginBottom:6}}>Recuperar contraseña</div>
            <div style={{fontSize:11,color:"#888",marginBottom:12}}>Escribe tu correo y te enviaremos un código para restablecerla.</div>
            <label>Correo</label><input type="text" value={u} onChange={e=>setU(e.target.value)} placeholder="usuario@gpa.com.mx" autoCapitalize="off" onKeyDown={e=>e.key==="Enter"&&pedirCodigo()}/>
            {msg&&<div style={{background:C.greenLt,color:C.green,borderRadius:6,padding:"7px 10px",fontSize:12,marginTop:8}}>{msg}</div>}
            {err&&<div className="eb" style={{marginTop:8}}>{err}</div>}
            <button className="bp" onClick={pedirCodigo} disabled={busy||!u} style={{marginTop:14}}>{busy?"Enviando…":"Enviar código"}</button>
            <div style={{textAlign:"center",marginTop:10}}><a onClick={volverLogin} style={{fontSize:12,color:C.blue,cursor:"pointer"}}>← Volver</a></div>
          </> : fp===2 ? <>

            <div style={{fontSize:11,color:"#888",marginBottom:12}}>Escribe el código que llegó a {u} y tu nueva contraseña.</div>
            <label>Código de verificación</label><input type="text" value={code} onChange={e=>setCode(e.target.value)} placeholder="123456" inputMode="numeric"/>
            <label>Nueva contraseña</label><input type="password" value={np} onChange={e=>setNp(e.target.value)} placeholder="••••••"/>
            <label>Confirmar contraseña</label><input type="password" value={np2} onChange={e=>setNp2(e.target.value)} placeholder="••••••" onKeyDown={e=>e.key==="Enter"&&confirmar()}/>
            {err&&<div className="eb" style={{marginTop:8}}>{err}</div>}

            <div style={{textAlign:"center",marginTop:10}}><a onClick={()=>setFp(1)} style={{fontSize:12,color:C.blue,cursor:"pointer"}}>Reenviar código</a> · <a onClick={volverLogin} style={{fontSize:12,color:C.blue,cursor:"pointer"}}>Volver</a></div>
          </> : <>
            <label>Correo</label><input type="text" value={u} onChange={e=>setU(e.target.value)} placeholder="usuario@gpa.com.mx" autoCapitalize="off"/>
            <label>Contraseña</label><input type="password" value={p} onChange={e=>setP(e.target.value)} placeholder="••••••" onKeyDown={e=>e.key==="Enter"&&go()}/>
            {err&&<div className="eb" style={{marginTop:8}}>{err}</div>}
            {msg&&<div style={{background:C.greenLt,color:C.green,borderRadius:6,padding:"7px 10px",fontSize:12,marginTop:8}}>{msg}</div>}
            <button className="bp" onClick={go} disabled={busy||!u||!p} style={{marginTop:14}}>{busy?"Entrando…":"Iniciar sesión"}</button>
            <div style={{textAlign:"center",marginTop:10}}><a onClick={()=>{setErr("");setMsg("");setFp(1);}} style={{fontSize:12,color:C.blue,cursor:"pointer"}}>¿Olvidaste tu contraseña?</a></div>
          </>}
        </div>
        <div style={{fontSize:11,color:"#aaa",textAlign:"center",marginTop:8}}>Credenciales asignadas por administrador</div>
      </div>
    </div>
  );
}

// ─── APP PRINCIPAL ──────────────────────────────────────────────────
function App(){

  const showToast=m=>{setToast(m);setTimeout(()=>setToast(null),3000);};

  const cargarTodo=async()=>{
    setLoading(true);
    try{
      // Los catálogos son esenciales; cárgalos primero.
      const c=await api.catalogos();
      VENTANA_DIAS=(c.config&&c.config.ventanaDias)||45;   // ventana por defecto del servidor
      setCat(c);

      // tiene acceso a alguno (403), NO debe tumbar toda la app (queda vacío).
      const[sol,cl,mc]=await Promise.all([
        api.listar("combustible").catch(()=>[]),
        api.listar("checklist").catch(()=>[]),

      setData({combustible:sol,checklist:cl,montacargas:mc});
    }catch(e){showToast("⚠️ "+e.message);}
    setLoading(false);
  };
  useEffect(()=>{if(session)cargarTodo();},[session]);

  // Al crear un registro o cambiar su estado también se releen los CATÁLOGOS: el
  // "último km / últimas horas" por unidad es un DERIVADO de los registros, así que
  // si no se recargan, el formulario sigue comparando contra una lectura vieja
  // (p. ej. seguía tomando el km de una solicitud ya rechazada).
  const refrescar=async tipo=>{try{const items=await api.listar(tipo);setData(d=>({...d,[tipo]:items}));await refrescarCat();}catch(e){showToast("⚠️ "+e.message);}};
  const refrescarCat=async()=>{try{const c=await api.catalogos();VENTANA_DIAS=(c.config&&c.config.ventanaDias)||45;setCat(c);}catch(e){showToast("⚠️ "+e.message);}};
  const login=async(email,pass)=>{const r=await api.login(email,pass);if(r&&r.challenge)return r;setAlertaOff(false);alertaFormRef.current=null;setSession(api.session);};
  const setNewPassword=async(np)=>{await api.completeNewPassword(np);setSession(api.session);};
  const logout=()=>{api.logout();setSession(null);setCat(null);setAlerta(null);setAlertaOff(false);alertaFormRef.current=null;};

  // Aviso de cumplimiento al iniciar sesión (solo responsables con visibilidad de
  // sucursal/global: admin, analista, supervisor). Los operadores reciben el aviso

// Formulario dinámico multipaso (1 sección = 1 paso) construido desde la plantilla
function FormDinamico({plantilla,cat,rol,sucursalesUser,session,onDone,showToast}){
  // El responsable es SIEMPRE el titular de la cuenta que capturó (unificado con Cuentas).
  const yo={id:session.email,nombre:session.nombre||session.email,mail:session.email};
  const secs=plantilla.secciones||[];
  const availVeh=cat.vehicles.filter(v=>esActivoV(v)&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(v.sucursal)));
  const sucOpts=(sucursalesUser&&!["admin","analista"].includes(rol))?sucursalesUser:cat.sucursales;
  const[suc,setSuc]=useState(sucOpts[0]||session.sucursal||"");
  const[ans,setAns]=useState({});const[obs,setObs]=useState("");const[proxServ,setProxServ]=useState("");const[sig,setSig]=useState(null);
  const[step,setStep]=useState(0);const[busy,setBusy]=useState(false);
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  const reqFirma=plantilla.requiereFirma!==false;
  const total=secs.length+2;const isLast=step===total-1;const curSec=step>0&&step<total-1?secs[step-1]:null;
  const setA=(id,v)=>setAns(a=>({...a,[id]:v}));const getA=id=>ans[id];
  // Validación de completitud: toda pregunta visible debe responderse (fotos/notas opcionales)
  const[marcar,setMarcar]=useState(false);
  const REQ=["select","si_no","escala","opna","number","date","taco","vehiculo","text"];
  const vacio=it=>{const v=ans[it.id];return Array.isArray(v)?v.length===0:(v==null||v==="");};
  // Obligatorio: los tipos de respuesta (REQ) siempre; foto/fotos/daños/texto largo
  // solo si el Excel los marcó Obligatorio=Si (item.req). «aviso» nunca (no se contesta).
  const faltaItem=it=>condOK(it,getA)&&it.type!=="aviso"&&!it.opcional&&(REQ.includes(it.type)||it.req)&&vacio(it);
  const faltanSec=its=>(its||[]).filter(faltaItem);
  // Resultado tipo semáforo a partir de los campos «escala» (réplica del checklist)
  const escalaItems=secs.flatMap(s=>(s.items||[]).filter(it=>it.type==="escala"));
  const calcResultado=()=>{
    if(!escalaItems.length)return null;
    let bad=0,warn=0,answered=0,sum=0;
    escalaItems.forEach(it=>{const idx=ans[it.id];if(idx==null||idx==="")return;answered++;const o=(it.opts||[])[idx]||{};const sev=o.sev||"ok";if(sev==="bad")bad++;else if(sev==="warn")warn++;sum+=(o.val!=null?o.val:SEV_VAL[sev]);});
    const completo=answered===escalaItems.length;
    const nivel=!completo?"":bad>0?"fuera":warn>0?"atencion":"optimo";
    const lbl=nivel==="fuera"?"Fuera de servicio":nivel==="atencion"?"Requiere atención":nivel==="optimo"?"Óptimo / operativo":"Completa todos los puntos para ver el resultado";
    return{bad,warn,answered,total:escalaItems.length,sum,max:escalaItems.length*2,completo,nivel,lbl};
  };
  const res=calcResultado();
  const hoy=ymd(new Date());  // fecha local de hoy (para validar próximo servicio)
  const submit=async()=>{
    if(busy)return;
    if(!suc){setStep(0);return showToast("⚠️ Falta la sucursal");}
    for(let i=0;i<secs.length;i++){const f=faltanSec(secs[i].items);if(f.length){setStep(i+1);setMarcar(true);return showToast("⚠️ Faltan "+f.length+" respuesta(s) en «"+secs[i].title+"». Complétalas para enviar.");}}
    if(proxServ&&proxServ<hoy)return showToast("⚠️ La fecha de próximo servicio no puede ser anterior a hoy.");
    if(reqFirma&&!sig)return showToast("⚠️ Falta la firma");
    setBusy(true);
    try{
      const datos={sucursal:suc,responsable:yo?.nombre||session.nombre,answers:ans,obs,proximoServicio:proxServ};
      if(reqFirma)datos.firma=sig;
      if(res){datos.resultado=res.lbl;datos.resultadoNivel=res.nivel;datos.puntaje=res.sum;datos.puntajeMax=res.max;}
      const subido=await api.subirEvidencias("formulario",datos);
      await api.crearFormulario(plantilla.clave,subido);
      showToast("✓ Formulario enviado");onDone&&onDone();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };

// Respuesta de un ítem como texto legible (para CSV por registro)
function respuestaTexto(item,reg){
  const a=reg.answers||{};const v=a[item.id];const t=item.type;
  if(t==="escala"){if(v==null||v==="")return "";const o=(item.opts||[])[v]||{};const nota=a[item.id+"__nota"];const foto=a[item.id+"__foto"];return (o.t||"")+(nota?" — "+nota:"")+(foto?" (con foto de evidencia)":"");}
  if(t==="opna"){if(v==null||v==="")return "";const com=a[item.id+"__com"];return v+(com?" — "+com:"");}
  if(t==="fotos")return (v&&v.length)?v.length+" foto(s)":"";
  if(t==="damage_list")return (v&&v.length)?v.length+" daño(s): "+v.map(d=>d.desc||"sin descripción").join("; "):"";
  if(t==="photo")return v?"foto adjunta":"";
  if(t==="taco")return (v!=null&&v!=="")?"Nivel "+v:"";
  return v==null?"":String(v);
}
const edTxt=r=>{const e=(r&&r.ediciones)||[];return e.length?(e.length+" ed. · "+e[e.length-1].por+" "+fdt(e[e.length-1].en)):"";};
// ─── Hallazgos («mal estado») de un checklist, con su foto de evidencia ──────
// Valores que se consideran HALLAZGO en los checklists de reparto y formularios.
const MAL_VALORES=new Set(["No","Con raspaduras/golpes","Con Raspaduras/Golpes",
  "Bajo","Muy Bajo","Sin Nivel","Vencido","No cuenta","No hay extinguidor",
  "Mal estado","Malo","P"]);
// Ítems INFORMATIVOS: su "No" describe la configuración de la unidad, no un defecto.
const MAL_IGNORAR=new Set(["pt_int","ct_int"]);
// Foto(s) de evidencia asociadas a un punto (cuando no siguen el patrón "f_<id>").
// carrocería: las 4 tomas del vehículo (además, cada daño capturado va con su foto).
const FOTO_DE_ITEM={carroceria:["f_frente_d","f_frente_i","f_tras_d","f_tras_i"],
  espejos:["f_esp_p","f_esp_c"],luces_d:["f_luces_d","f_luces_t"],
  refacc:["f_ref"],gato:["f_herr"],llave_cruz:["f_herr"],triangulo:["f_herr"],cables:["f_herr"]};
const fotosDeItem=(item,a)=>(FOTO_DE_ITEM[item.id]||["f_"+item.id])
  .map(id=>a[id]).filter(x=>typeof x==="string"&&x);
// Recorre las secciones de un checklist (reparto o formulario dinámico) y devuelve
// los puntos en mal estado con su valor, nota y fotos de evidencia.
// Los TACO (nivel 1-10) NO se evalúan: son una medición, no un pasa/no-pasa (no hay
// umbral definido por operación); sus valores sí salen en el CSV de resultados.
function hallazgosSecs(secs,reg){
  const a=(reg&&reg.answers)||{};const out=[];
  (secs||[]).forEach(sec=>(sec.items||[]).forEach(item=>{
    const v=a[item.id],t=item.type;
    if(t==="damage_list"){(v||[]).forEach((d,i)=>out.push({sec:sec.title,label:(item.label||"Daño")+" #"+(i+1),valor:d.desc||"Daño registrado",sev:"bad",fotos:d.foto?[d.foto]:[]}));return;}
    if(v==null||v==="")return;
    if(t==="escala"){const o=(item.opts||[])[v]||{};const sev=o.sev||"ok";if(sev==="ok")return;
      return void out.push({sec:sec.title,label:item.label,valor:o.t||SEV_BADGE[sev],sev:sev==="bad"?"bad":"warn",nota:a[item.id+"__nota"]||"",fotos:[a[item.id+"__foto"]].filter(Boolean)});}
    if(t==="opna"){if(v!=="P")return;
      return void out.push({sec:sec.title,label:item.label,valor:"P — problema",sev:"bad",nota:a[item.id+"__com"]||"",fotos:[a[item.id+"__foto"]].filter(Boolean)});}
    if(["photo","fotos","taco","text","textarea","number","date","vehiculo","aviso"].includes(t))return;
    if(MAL_IGNORAR.has(item.id)||!MAL_VALORES.has(String(v)))return;
    out.push({sec:sec.title,label:item.label,valor:String(v),sev:"bad",fotos:fotosDeItem(item,a)});
  }));
  return out;
}
// Resumen de hallazgos para una celda de CSV
const malTxt=h=>h.map(x=>x.label+": "+x.valor+(x.nota?" ("+x.nota+")":"")).join(" | ");
// Tarjeta de evidencia (se ve en pantalla y es lo único con fotos que va al PDF)
function CardHallazgos({hall}){
  if(!hall)return null;
  if(!hall.length)return <div className="card"><div style={{fontSize:12,color:C.green,fontWeight:600}}>✓ Sin puntos en mal estado en este checklist.</div></div>;
  return(<div className="card"><div className="ct" style={{color:C.red}}>⚠️ Puntos en mal estado ({hall.length}) — evidencia</div>
    {hall.map((h,i)=><div key={i} style={{marginBottom:10,paddingBottom:10,borderBottom:".5px solid #f0c0c0"}}>
      <div className="dr"><span style={{maxWidth:"62%"}}>{h.sec?h.sec+" · ":""}{h.label}</span><span style={{fontWeight:700,color:h.sev==="warn"?C.amber:C.red}}>{h.valor}</span></div>
      {h.nota&&<div style={{fontSize:12,marginTop:2}}>{h.nota}</div>}
      {(h.fotos||[]).map((f,j)=><img key={j} src={f} style={{width:"100%",borderRadius:6,marginTop:4}} alt="evidencia"/>)}
    </div>)}</div>);
}

// Descarga UN registro dinámico como CSV (metadatos + cada campo con su respuesta)
function csvRegistroForm(plantilla,reg){
  const nombre=reg.plantillaNombre||(plantilla&&plantilla.nombre)||reg.plantillaClave||"formulario";
  const filas=[
    ["Datos","Folio",folioDe(reg)],
    ["Datos","Formulario",nombre],
    ["Datos","Código",(plantilla&&plantilla.codigo)||""],
    ["Datos","Fecha",fdt(reg.fecha)],
    ["Datos","Sucursal",reg.sucursal||""],
    ["Datos","Responsable",reg.responsable||reg.solicitante||""],
    ["Datos","Estado",reg.status||""],
  ];
  if(reg.resultado)filas.push(["Datos","Resultado",reg.resultado+(reg.puntaje!=null?" ("+reg.puntaje+"/"+reg.puntajeMax+")":"")]);
  if(reg.autorizadoPor)filas.push(["Datos","Autorizó",reg.autorizadoPor]);
  ((plantilla&&plantilla.secciones)||[]).forEach(sec=>(sec.items||[]).forEach(item=>{
    filas.push([sec.title||"",item.label||item.id,respuestaTexto(item,reg)]);
  }));
  if(reg.proximoServicio)filas.push(["Datos","Fecha de próximo servicio",reg.proximoServicio]);
  if(reg.obs)filas.push(["","Observaciones",reg.obs]);
  const fname=(plantilla&&plantilla.clave||"form")+"_"+(reg.id||"reg")+"_"+ymd(reg.fecha);
  csvDownload(fname,["Sección","Campo","Respuesta"],filas);
}

// CSV de UN registro recorriendo el detalle en pantalla (.pdf-area). Sirve para
// todos los módulos (combustible, reparto, montacargas y formularios dinámicos).
function csvDetalle(){
  const area=document.querySelector(".pdf-area");if(!area)return;
  const titulo=area.dataset.pdftitle||"registro";const suc=area.dataset.pdfsucursal||"";
  const INL=["SPAN","B","A","STRONG","EM","SMALL","I"];let sccn="";const filas=[];
  const walk=node=>{for(const el of node.children){
    if(el.classList&&el.classList.contains("no-print"))continue;
    if(el.classList&&el.classList.contains("ct")){sccn=(el.textContent||"").trim();continue;}
    if(el.classList&&el.classList.contains("dr")){const sp=el.querySelectorAll("span");if(sp.length>=2)filas.push([sccn,(sp[0].textContent||"").trim(),(sp[sp.length-1].textContent||"").trim()]);continue;}
    const kids=[...el.children];
    if(kids.length>=2&&kids.every(c=>INL.includes(c.tagName))){filas.push([sccn,(kids[0].textContent||"").trim(),kids.slice(1).map(s=>(s.textContent||"").trim()).join(" ")]);continue;}
    if(kids.length)walk(el);
  }};
  walk(area);
  filas.unshift(["Datos","Formato",titulo]);if(suc)filas.splice(1,0,["Datos","Sucursal",suc]);
  csvDownload(titulo.replace(/[^a-zA-Z0-9]+/g,"_")+"_"+new Date().toISOString().slice(0,10),["Sección","Campo","Valor"],filas);
}

        if(item.type==="escala"){if(v==null||v==="")return null;const o=(item.opts||[])[v]||{};const sev=o.sev||"ok";const nota=reg.answers?.[item.id+"__nota"];const efoto=reg.answers?.[item.id+"__foto"];return<div key={item.id} style={{marginBottom:6}}><div className="dr"><span style={{maxWidth:"60%"}}>{item.label}</span><span className={"bdg eb-"+sev}>{o.t||SEV_BADGE[sev]}</span></div>{nota&&<div style={{fontSize:11,color:"#888",marginTop:2}}>Nota: {nota}</div>}{efoto&&<img className="pdf-omit" src={efoto} style={{width:"100%",maxWidth:240,borderRadius:6,marginTop:4}} alt="evidencia del daño"/>}</div>;}

// Historial de registros de una plantilla (filtro de fecha + CSV)
function FormHistory({plantilla,items,loading,onSelect}){
  const[rDesde,setRDesde]=useState("");const[rHasta,setRHasta]=useState("");const[zip,setZip]=useState(null);const[fSuc,setFSuc]=useState("");
  const[ext,setExt]=useState(null);const[extBusy,setExtBusy]=useState(false);
  useEffect(()=>{let vivo=true;if(fueraDeVentana(rDesde,rHasta)){setExtBusy(true);api.listarFormulario(plantilla.clave,rangoArchivo(rDesde,rHasta)).then(r=>{if(vivo)setExt(r);}).catch(()=>{if(vivo)setExt(null);}).finally(()=>{if(vivo)setExtBusy(false);});}else{setExt(null);setExtBusy(false);}return()=>{vivo=false;};},[rDesde,rHasta,plantilla.clave]);
  const src=ext||items||[];
  const list=src.filter(r=>(!fSuc||(r.sucursal||"")===fSuc)&&(!rDesde||ymd(r.fecha)>=rDesde)&&(!rHasta||ymd(r.fecha)<=rHasta)).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  // CSV = TABLA DE RESULTADOS: una fila por registro y una columna por punto del formulario.
  const ptos=((plantilla&&plantilla.secciones)||[]).flatMap(sec=>(sec.items||[])
    .filter(it=>!["photo","fotos","aviso"].includes(it.type)).map(it=>({...it,sec:sec.title})));
  const csv=()=>csvDownload("form_"+plantilla.clave,
    ["Folio","Fecha","Sucursal","Responsable","Estado","Resultado","Puntaje","Próximo servicio","Puntos en mal estado","Detalle mal estado","Editado",
      ...ptos.map(p=>p.sec+" · "+p.label)],
    list.map(r=>{const h=hallazgosSecs((plantilla&&plantilla.secciones)||[],r);
      return [folioDe(r),fdt(r.fecha),r.sucursal,r.responsable||r.solicitante,r.status,r.resultado||"",r.puntaje!=null?r.puntaje+"/"+r.puntajeMax:"",r.proximoServicio||"",h.length,malTxt(h),edTxt(r),
        ...ptos.map(p=>respuestaTexto(p,r))];}));
  const descargarZip=async()=>{
    if(!list.length||zip)return;
    setZip({i:0,total:list.length});
    try{await zipPdfsFormularios(plantilla,list,(i,total)=>setZip({i,total}));}
    catch(e){alert("No se pudo generar el ZIP: "+e.message);}
    setZip(null);
  };
  if(loading)return<div className="spin"/>;
  return(
    <div>
      <FiltroFechas desde={rDesde} hasta={rHasta} setDesde={setRDesde} setHasta={setRHasta} onCSV={csv} n={list.length} sucursales={sucursalesDe(src)} sucursal={fSuc} setSucursal={setFSuc}/>
      {extBusy&&<div className="empty">Consultando archivo histórico…</div>}
      {ext&&!extBusy&&<div style={{fontSize:11,color:"#888",marginBottom:8}}>📚 Archivo histórico del servidor ({src.length} registros del rango)</div>}
      {list.length>0&&<button className="bs" style={{width:"100%",marginBottom:10}} disabled={!!zip} onClick={descargarZip}>{zip?`Generando PDFs… ${zip.i}/${zip.total}`:`⬇ Todos en PDF (ZIP) · ${list.length}`}</button>}
      {list.length===0&&!extBusy&&<div className="empty">No hay registros</div>}
      <div className="card">{list.map(r=><div key={r.id} className="li" onClick={()=>onSelect(r)}><div className="lit"><span className="lim">{r.sucursal||"—"}</span><span className={"bdg "+bcMC(r.status)}>{r.status}</span></div><div className="lis">{r.responsable||r.solicitante||"—"}{r.resultado?<span className={"bdg eb-"+(r.resultadoNivel==="fuera"?"bad":r.resultadoNivel==="atencion"?"warn":"ok")} style={{marginLeft:6}}>{r.resultado}</span>:null}</div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span className="lis">{fdt(r.fecha)}</span><button className="bs" style={{fontSize:11,padding:"3px 9px"}} onClick={e=>{e.stopPropagation();csvRegistroForm(plantilla,r);}}>⬇ CSV</button></div></div>)}</div>
    </div>
  );
}

// Descarga de TODO un módulo (varios formularios) en un rango: CSV combinado y ZIP de PDFs.
function csvModulo(nombre,grupos){
  const filas=[];
  grupos.forEach(g=>(g.registros||[]).forEach(r=>filas.push([g.plantilla.nombre||g.plantilla.clave,folioDe(r),fdt(r.fecha),r.sucursal||"",r.responsable||r.solicitante||"",r.status||"",r.resultado||r.resultadoNivel||"",r.proximoServicio||""])));
  csvDownload(nombre,["Formulario","Folio","Fecha","Sucursal","Responsable","Estado","Resultado","Próximo servicio"],filas);
}
async function zipPdfsModulo(nombreZip,grupos,onProg){
  const JSZip=window.JSZip;if(!JSZip){alert("No cargó la librería de ZIP. Reintenta en unos segundos.");return;}
  const zip=new JSZip();const usados={};let ok=0;const total=grupos.reduce((a,g)=>a+(g.registros||[]).length,0);let hecho=0;
  for(const g of grupos){for(const reg of (g.registros||[])){hecho++;onProg&&onProg(hecho,total);
    try{
      const {area,cleanup}=await _areaDeDetalle(()=>React.createElement(FormDinamicoDetail,{reg,plantilla:g.plantilla,onBack:()=>{},onEstado:()=>{}}));
      const doc=await pdfDeArea(area);cleanup();if(!doc)continue;
      let base=((g.plantilla&&g.plantilla.clave)||"reg")+"_"+ymd(reg.fecha)+"_"+(reg.sucursal||"").replace(/[^a-zA-Z0-9]+/g,"")+"_"+(reg.id||hecho);
      base=base.replace(/[^a-zA-Z0-9_\-]+/g,"_");
      if(usados[base])base+="_"+(++usados[base]);else usados[base]=1;
      zip.file(base+".pdf",doc.output("arraybuffer"));ok++;
    }catch(e){}
  }}
  if(!ok){alert("No se pudo generar ningún PDF.");return;}
  const blob=await zip.generateAsync({type:"blob"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download="Historial_"+nombreZip+".zip";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}

function SolForm({cat,items,session,rol,sucursalesUser,refrescar,showToast,onDone}){
  // El responsable es SIEMPRE el titular de la cuenta que capturó (unificado con Cuentas).
  const yo={id:session.email,nombre:session.nombre||session.email,mail:session.email};
  // Combustible: Gasolina, Diésel y Gas LP cargan combustible; solo se excluyen los eléctricos.
  const availVeh=cat.vehicles.filter(v=>esActivoV(v)&&!esElectrico(v)&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(v.sucursal)));
  // El solicitante SIEMPRE es la persona que inició sesión (match por su correo).
  const solicitante=yo||{id:null,nombre:session.nombre||session.email,mail:session.email};
  // Borrador: guarda lo no enviado para retomarlo después. No se envía → no cuenta para km/controles.
  const DKEY="gpa_sol_draft_"+session.email;
  const draftRef=useRef(undefined);
  if(draftRef.current===undefined){try{draftRef.current=JSON.parse(localStorage.getItem(DKEY))||{};}catch{draftRef.current={};}}
  const D=draftRef.current;
  // Preselección: la última unidad que ESTE usuario capturó (si no hay borrador a medias).
  const ultUsada=(items||[]).filter(r=>(r.accountId||r.mail)===session.email).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]?.vehicleId;
  const[veh,setVeh]=useState(D.veh||(ultUsada&&availVeh.some(v=>String(v.id)===String(ultUsada))?String(ultUsada):(availVeh[0]?String(availVeh[0].id):"")));
  const[km,setKm]=useState(D.km||"");const[tank,setTank]=useState(D.tank??0.25);const[obs,setObs]=useState(D.obs||"");
  // Evidencia: una o más fotos (borradores viejos con una sola 'photo' se migran solos)
  const[fotos,setFotos]=useState(D.fotos||(D.photo?[D.photo]:[]));const[sig,setSig]=useState(D.sig||null);const[step,setStep]=useState(D.step||1);const[busy,setBusy]=useState(false);
  const[forzarKm,setForzarKm]=useState(false);
  const[teniaBorrador]=useState(!!(D.km||(D.fotos&&D.fotos.length)||D.photo||D.obs||(D.step&&D.step>1)));
  useEffect(()=>{try{localStorage.setItem(DKEY,JSON.stringify({veh,km,tank,obs,fotos,sig,step}));}catch{}},[veh,km,tank,obs,fotos,sig,step]);
  const descartarBorrador=()=>{try{localStorage.removeItem(DKEY);}catch{}setVeh(availVeh[0]?String(availVeh[0].id):"");setKm("");setTank(0.25);setObs("");setFotos([]);setSig(null);setStep(1);showToast("Borrador descartado");};
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  const vehicle=cat.vehicles.find(v=>String(v.id)===String(veh));
  const user=solicitante;
  const need=Math.max(0,1-tank);const litros=vehicle?Math.round(vehicle.tanque*need):0;const monto=vehicle?Math.round(litros*vehicle.precio):0;
  // Último km REAL de la unidad (del catálogo/backend), no solo lo que capturó este usuario.
  const lastKm=vehicle&&vehicle.ultimoKm!=null?vehicle.ultimoKm:null;
  // Montacargas (Gas LP/Eléctrico): máx 100 km entre cargas; vehículos normales: 1000
  const maxDeltaKm=vehicle&&(esGasLP(vehicle)||esElectrico(vehicle))?100:1000;
  const kmN=parseFloat(km);const kmErr=km&&lastKm!=null?(kmN<lastKm?`No puede ser menor al último: ${lastKm.toLocaleString()} km`:kmN-lastKm>maxDeltaKm?`No puede exceder ${maxDeltaKm.toLocaleString()} km del último (${lastKm.toLocaleString()} km)`:null):null;
  // El bloqueo solo se libera si un admin marca "forzar" (corrección). El backend revalida igual.
  const puedeForzar=rol==="admin";const kmBloq=kmErr&&!(puedeForzar&&forzarKm);
  const submit=async()=>{
    if(!vehicle||!user||busy)return;
    setBusy(true);
    try{
      const datos={vehicleId:vehicle.id,placas:vehicle.placas,subMarca:vehicle.subMarca,sucursal:vehicle.sucursal,economico:vehicle.economico,combustible:vehicle.combustible,producto:vehicle.producto,precio:vehicle.precio,tanque:vehicle.tanque,userId:user.id,responsable:user.nombre,mail:user.mail,km:kmN,tankBefore:tank,tankAfter:1,necesidad:need,litros,monto,obs,fotos,photo:fotos[0]||null,firma:sig,status:"Pendiente",...(puedeForzar&&forzarKm&&kmErr?{forzar:true}:{})};
      const subido=await api.subirEvidencias("combustible",datos);
      await api.crear("combustible",subido);
      try{localStorage.removeItem(DKEY);}catch{}
      showToast("✓ Solicitud enviada");
      await refrescar();
      onDone();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  return(
    <div>
      <div className="sb">{[1,2,3].map(s=><div key={s} className="sd" style={{background:step>=s?C.blue:"#e0e0e0"}}/>)}</div>
      {teniaBorrador&&<div className="wb" style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}><span>📝 Retomaste un borrador no enviado.</span><button className="bd" style={{padding:"4px 10px",fontSize:11}} onClick={descartarBorrador}>Descartar</button></div>}
      {step===1&&<>
        <div className="card">
          <div className="ct">Vehículo</div>
          <select value={veh} onChange={e=>setVeh(e.target.value)}><option value="">— Selecciona —</option>{availVeh.map(v=><option key={v.id} value={v.id}>#{v.economico} · {v.placas} · {v.subMarca}</option>)}</select>
          {vehicle&&<div style={{marginTop:8,fontSize:12}}><div className="dr"><span>Sucursal</span><span>{vehicle.sucursal}</span></div><div className="dr"><span>Combustible</span><span>{vehicle.combustible}</span></div><div className="dr"><span>Precio/L</span><span>${vehicle.precio.toFixed(2)}</span></div><div className="dr"><span>Tanque</span><span>{vehicle.tanque}L</span></div></div>}
        </div>
        <div className="card">
          <div className="ct">Solicitante</div>
          <label>Responsable (tu sesión)</label>

          <label>Kilometraje actual</label>
          <input type="number" placeholder="Ej. 91127" value={km} onChange={e=>setKm(e.target.value)}/>
          {lastKm!=null&&<div style={{fontSize:11,color:"#888",marginTop:3}}>Último registro: {lastKm.toLocaleString()} km</div>}
          {kmErr&&<div className="eb">{kmErr}</div>}
          {kmErr&&puedeForzar&&<label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,marginTop:6,color:C.red}}><input type="checkbox" checked={forzarKm} onChange={e=>setForzarKm(e.target.checked)} style={{width:"auto"}}/>Forzar captura fuera de rango (corrección de admin)</label>}
        </div>

          {vehicle&&<div className="cb"><div className="cr"><span>Litros estimados</span><span>{litros} L</span></div><div className="cr" style={{borderTop:`1px solid ${C.blueMd}`,marginTop:6,paddingTop:6,fontSize:15}}><span>Monto estimado</span><span>${monto.toLocaleString()}</span></div></div>}
        </div>
        <label>Observaciones</label>

        <button className="bp" disabled={!veh||!km||!!kmBloq} onClick={()=>setStep(2)}>Siguiente →</button>
      </>}
      {step===2&&<>

          {fotos.length>0&&<div className="fg" style={{marginBottom:8}}>{fotos.map((src,i)=><div key={i} className="ft"><img src={src} alt={"evidencia "+(i+1)}/><button className="fx" onClick={()=>setFotos(f=>f.filter((_,j)=>j!==i))}>×</button></div>)}</div>}
          <div className="pb"><div style={{fontSize:22}}>📷</div><div style={{marginTop:3}}>{fotos.length?"Agregar otra foto":"Toca para capturar"}</div><input type="file" accept="image/*" capture="environment" onChange={e=>{readFile(e,d=>setFotos(f=>[...f,d]));e.target.value="";}}/></div>
          {fotos.length>0&&<div style={{fontSize:11,color:"#888",marginTop:6}}>{fotos.length} foto(s) agregada(s). Toca <b>×</b> para quitar una.</div>}
        </div>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(1)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0}} disabled={!fotos.length} onClick={()=>setStep(3)}>Siguiente →</button></div>
      </>}
      {step===3&&<>
        <div className="card">
          <div className="ct">Firma del Solicitante</div>
          <canvas ref={sigRef} className="sig" width={340} height={130} onMouseDown={sigH.start} onMouseMove={sigH.move} onMouseUp={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}} onTouchStart={sigH.start} onTouchMove={sigH.move} onTouchEnd={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}}/>
          <button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>sigH.clear(setSig)}>Limpiar</button>
          {user&&<div style={{marginTop:8,fontSize:12,textAlign:"center"}}><b>{user.nombre}</b><br/><span style={{fontSize:11,color:"#888"}}>Notif: {cat.config?.emailLogistica||"logística"}</span></div>}
        </div>
        <div className="card"><div className="ct">Resumen</div><div className="dr"><span>Vehículo</span><span>{vehicle?.placas}</span></div><div className="dr"><span>Litros</span><span>{litros} L</span></div><div className="dr"><span>Monto</span><span style={{color:C.blue,fontWeight:700}}>${monto.toLocaleString()}</span></div></div>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(2)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0}} disabled={!sig||busy} onClick={submit}>{busy?"Enviando…":"Enviar"}</button></div>
      </>}
    </div>
  );
}

  const ultUsada=(items||[]).filter(r=>(r.accountId||r.mail)===session.email).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]?.vehicleId;
  const[veh,setVeh]=useState(D.veh||(ultUsada&&availVeh.some(v=>String(v.id)===String(ultUsada))?String(ultUsada):(availVeh[0]?String(availVeh[0].id):"")));
  const[km,setKm]=useState(D.km||"");
  const[fotoAntes,setFotoAntes]=useState(D.fotoAntes||null);const[fotoDespues,setFotoDespues]=useState(D.fotoDespues||null);
  const[lleno,setLleno]=useState(D.lleno||"Si");
  const[fotoBomba,setFotoBomba]=useState(D.fotoBomba||null);
  const[litros,setLitros]=useState(D.litros||"");const[precioLitro,setPrecioLitro]=useState(D.precioLitro||"");const[monto,setMonto]=useState(D.monto||"");
  // Ubicación: NO se restaura del borrador (evita que se altere entre sesiones);
  // el valor autoritativo se re-lee del dispositivo al enviar. Ver submit().
  const[fotoTicket,setFotoTicket]=useState(D.fotoTicket||null);const[ubic,setUbic]=useState(null);
  const[fotoPersona,setFotoPersona]=useState(D.fotoPersona||null);const[obs,setObs]=useState(D.obs||"");const[sig,setSig]=useState(D.sig||null);
  const[step,setStep]=useState(D.step||1);const[busy,setBusy]=useState(false);const[geo,setGeo]=useState(false);
  const[forzarKm,setForzarKm]=useState(false);
  const[teniaBorrador]=useState(!!(D.km||D.fotoAntes||D.litros||(D.step&&D.step>1)));
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  // Inicio del llenado (para la métrica de duración; no se persiste ni se muestra).
  const inicioRef=useRef(null);if(inicioRef.current===null)inicioRef.current=new Date().toISOString();
  // `ubic` NO se persiste al borrador: la ubicación no puede quedar en un almacén editable.
  useEffect(()=>{try{localStorage.setItem(DKEY,JSON.stringify({veh,km,fotoAntes,fotoDespues,lleno,fotoBomba,litros,precioLitro,monto,fotoTicket,fotoPersona,obs,sig,step}));}catch{}},[veh,km,fotoAntes,fotoDespues,lleno,fotoBomba,litros,precioLitro,monto,fotoTicket,fotoPersona,obs,sig,step]);
  const descartar=()=>{try{localStorage.removeItem(DKEY);}catch{}setVeh(availVeh[0]?String(availVeh[0].id):"");setKm("");setFotoAntes(null);setFotoDespues(null);setLleno("Si");setFotoBomba(null);setLitros("");setPrecioLitro("");setMonto("");setFotoTicket(null);setUbic(null);setFotoPersona(null);setObs("");setSig(null);setStep(1);showToast("Borrador descartado");};
  const vehicle=cat.vehicles.find(v=>String(v.id)===String(veh));
  // Último km REAL de la unidad (del catálogo/backend), no solo lo que capturó este usuario.
  const lastKm=vehicle&&vehicle.ultimoKm!=null?vehicle.ultimoKm:null;
  const maxDeltaKm=vehicle&&(esGasLP(vehicle)||esElectrico(vehicle))?100:1000;
  const kmN=parseFloat(km);const kmErr=km&&lastKm!=null?(kmN<lastKm?`No puede ser menor al último: ${lastKm.toLocaleString()} km`:kmN-lastKm>maxDeltaKm?`No puede exceder ${maxDeltaKm.toLocaleString()} km del último (${lastKm.toLocaleString()} km)`:null):null;
  // El bloqueo solo se libera si un admin marca "forzar" (corrección). El backend revalida igual.
  const puedeForzar=rol==="admin";const kmBloq=kmErr&&!(puedeForzar&&forzarKm);
  // Asignación (relación 1 a 1): el reporte se liga a la solicitud APROBADA más
  // reciente de la unidad que aún NO tenga reporte. El backend revalida contra el
  // historial completo y sella el folio en el reporte.
  const reportadasIds=new Set((items||[]).filter(r=>r.formato==="reporte"&&r.solicitudId).map(r=>String(r.solicitudId)));
  const solAsignable=(items||[]).filter(s=>String(s.vehicleId)===String(veh)&&s.formato!=="reporte"&&s.status==="Aprobada"&&!reportadasIds.has(String(s.id))).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0];
  const sinAsign=!!vehicle&&!solAsignable;
  // Lectura CRUDA del dispositivo (no editable por el usuario): resuelve
  // {lat,lng,accuracy,capturadoEn} o rechaza. El navegador exige permiso de GPS
  // por seguridad; no hay forma de leer la ubicación sin él.
  const leerGPS=()=>new Promise((resolve,reject)=>{
    if(!navigator.geolocation)return reject(new Error("Este dispositivo no tiene GPS"));
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,capturadoEn:new Date().toISOString()}),
      ()=>reject(new Error("Debes permitir el GPS para enviar el reporte")),
      {enableHighAccuracy:true,timeout:15000,maximumAge:0});
  });
  const obtenerUbic=async()=>{
    setGeo(true);
    try{
      const g=await leerGPS();let direccion="";
      try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${g.lat}&lon=${g.lng}`);const d=await r.json();direccion=d.display_name||"";}catch{}

  };
  useEffect(()=>{if(step===2&&!ubic&&!geo)obtenerUbic();},[step]);
  // Monto total = litros × precio/L (automático; no se captura a mano)
  useEffect(()=>{const mm=(parseFloat(litros)||0)*(parseFloat(precioLitro)||0);setMonto(mm?mm.toFixed(2):"");},[litros,precioLitro]);
  // NO se bloquea por sinAsign: un operador solo ve SUS registros, así que puede
  // no ver la solicitud aprobada que registró otro usuario. La regla la valida el
  // backend contra TODO el historial (solicitud_asignable_vehiculo); el cliente
  // solo avisa. Así un usuario distinto al que hizo la solicitud sí puede reportar.
  const can1=veh&&km&&!kmBloq&&fotoAntes&&fotoDespues;
  // Candados de la carga: litros ≤ capacidad del tanque de la unidad; precio/L ≤ $100.
  const tanqueCap=vehicle?parseFloat(vehicle.tanque)||0:0;
  const litrosN=parseFloat(litros);
  const litrosErr=litros!==""?(!(litrosN>0)?"Litros inválidos.":(tanqueCap>0&&litrosN>tanqueCap?`No puede exceder la capacidad del tanque (${tanqueCap} L).`:null)):null;
  const precioN=parseFloat(precioLitro);
  const precioErr=precioLitro!==""?(!(precioN>0)?"Precio inválido.":(precioN>100?"El precio por litro no puede exceder $100.":null)):null;
  const can2=fotoBomba&&fotoPersona&&litros&&precioLitro&&monto&&fotoTicket&&!litrosErr&&!precioErr;
  const submit=async()=>{
    if(!vehicle||busy||!sig||!fotoPersona)return;setBusy(true);
    // Ubicación OBLIGATORIA e inmodificable: se re-lee del dispositivo en fresco
    // en el momento del envío. Si el usuario no da permiso, no se puede enviar.
    let fix;
    try{fix=await leerGPS();}catch(e){showToast("⚠️ "+e.message);setBusy(false);return;}
    let direccion="";
    try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${fix.lat}&lon=${fix.lng}`);const d=await r.json();direccion=d.display_name||"";}catch{}
    setUbic({...fix,direccion});
    // Bloque de auditoría: lo ve Fleet Command, NO se muestra al operador.
    const fin=new Date().toISOString();
    const _auditoria={
      inicioLlenado:inicioRef.current,
      finLlenado:fin,
      duracionSeg:Math.max(0,Math.round((new Date(fin)-new Date(inicioRef.current))/1000)),
      geo:fix,                                    // lat,lng,accuracy(m),capturadoEn — lectura del dispositivo
      tz:(Intl.DateTimeFormat().resolvedOptions().timeZone)||"",
      plataforma:navigator.userAgent||""
    };
    try{
      const datos={formato:"reporte",vehicleId:vehicle.id,economico:vehicle.economico,placas:vehicle.placas,subMarca:vehicle.subMarca,sucursal:vehicle.sucursal,areaResponsable:vehicle.responsable,combustible:vehicle.combustible,producto:vehicle.producto,precio:vehicle.precio,tanque:vehicle.tanque,km:kmN,fotoAntes,fotoDespues,lleno,fotoBomba,litros:parseFloat(litros)||0,precioLitro:parseFloat(precioLitro)||0,monto:parseFloat(monto)||0,fotoTicket,ubicacion:{lat:fix.lat,lng:fix.lng,direccion},userId:solicitante.id,responsable:solicitante.nombre,mail:solicitante.mail,fotoPersona,firma:sig,obs,status:"Pendiente",...(solAsignable?{solicitudId:solAsignable.id,folioSolicitud:folioDe(solAsignable)}:{}),_auditoria,...(puedeForzar&&forzarKm&&kmErr?{forzar:true}:{})};
      const subido=await api.subirEvidencias("combustible",datos);
      await api.crear("combustible",subido);
      try{localStorage.removeItem(DKEY);}catch{}
      showToast("✓ Reporte de carga enviado");await refrescar();onDone();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  return(
    <div>
      <div className="sb">{[1,2,3].map(s=><div key={s} className="sd" style={{background:step>=s?C.blue:"#e0e0e0"}}/>)}</div>
      {teniaBorrador&&<div className="wb" style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}><span>📝 Retomaste un reporte no enviado.</span><button className="bd" style={{padding:"4px 10px",fontSize:11}} onClick={descartar}>Descartar</button></div>}
      {step===1&&<>
        <div className="card"><div className="ct">Generales del Vehículo</div>
          <select value={veh} onChange={e=>setVeh(e.target.value)}><option value="">— Selecciona —</option>{availVeh.map(v=><option key={v.id} value={v.id}>#{v.economico} · {v.placas} · {v.subMarca}</option>)}</select>
          {vehicle&&<div style={{marginTop:8,fontSize:12}}><div className="dr"><span>Sucursal</span><span>{vehicle.sucursal}</span></div><div className="dr"><span>Responsable (área)</span><span>{vehicle.responsable}</span></div><div className="dr"><span>Combustible</span><span>{vehicle.combustible}</span></div><div className="dr"><span>Precio catálogo/L</span><span>${vehicle.precio.toFixed(2)}</span></div><div className="dr"><span>Tanque</span><span>{vehicle.tanque}L</span></div><div className="dr"><span>Producto</span><span>{vehicle.producto}</span></div></div>}
          {sinAsign&&<div className="wb" style={{marginTop:8}}>⚠️ En tu vista no aparece una solicitud <b>aprobada y sin reporte</b> para esta unidad. Si otro usuario la registró y ya está aprobada, el sistema lo validará al enviar (puedes continuar). Regla: una solicitud aprobada = un reporte.</div>}
          {solAsignable&&<div style={{marginTop:8,background:C.blueLt,color:C.blue,borderRadius:6,padding:"7px 10px",fontSize:12}}>🔗 Se vinculará a la solicitud <b>{folioDe(solAsignable)}</b> (aprobada {fdate(solAsignable.fecha)}). Este folio quedará ligado al reporte.</div>}
        </div>
        <div className="card"><div className="ct">Datos del vehículo para la carga</div>
          <label>Kilometraje al cargar combustible</label><input type="number" value={km} onChange={e=>setKm(e.target.value)} placeholder="Ej. 14806"/>
          {lastKm!=null&&<div style={{fontSize:11,color:"#888",marginTop:3}}>Último registro: {lastKm.toLocaleString()} km</div>}
          {kmErr&&<div className="eb">{kmErr}</div>}
          {kmErr&&puedeForzar&&<label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,marginTop:6,color:C.red}}><input type="checkbox" checked={forzarKm} onChange={e=>setForzarKm(e.target.checked)} style={{width:"auto"}}/>Forzar captura fuera de rango (corrección de admin)</label>}
          <FotoCampo val={fotoAntes} set={setFotoAntes} label="Foto de km y medidor ANTES de cargar (ambos en la misma foto)"/>
          <FotoCampo val={fotoDespues} set={setFotoDespues} label="Foto del medidor al FINALIZAR la carga"/>

          {litrosErr&&<div className="eb">{litrosErr}</div>}
          <label>Precio por litro (debe coincidir con fotos; máx. $100)</label><input type="number" step="0.01" min="0.01" max="100" value={precioLitro} onChange={e=>setPrecioLitro(e.target.value)} placeholder="Ej. 28.18"/>
          {precioErr&&<div className="eb">{precioErr}</div>}
          <label>Monto total de la carga ($) — automático (litros × precio/L)</label><input type="text" value={monto?"$"+Number(monto).toLocaleString("es-MX",{minimumFractionDigits:2}):"—"} disabled style={{background:"#f5f5f5",color:"#222",fontWeight:600}}/>
          <FotoCampo val={fotoTicket} set={setFotoTicket} label="Foto del ticket de carga (fecha y hora deben coincidir)"/>
          <label>Ubicación de carga (automática)</label>
          <div style={{fontSize:12,color:"#555",background:"#fafafa",borderRadius:6,padding:"8px 10px"}}>{geo?"Obteniendo ubicación…":ubic?(ubic.direccion||`${ubic.lat.toFixed(5)}, ${ubic.lng.toFixed(5)}`):"Sin ubicación"}</div>
          <button className="bs" style={{width:"100%",marginTop:6}} onClick={obtenerUbic} disabled={geo}>📍 {ubic?"Actualizar ubicación":"Obtener ubicación"}</button>

      </>}
      {step===3&&<>
        <div className="card"><div className="ct">Quien realizó la carga</div>
          <div className="dr"><span>Responsable</span><span>{solicitante.nombre}</span></div><div className="dr"><span>Correo</span><span>{solicitante.mail}</span></div>
          {fotoPersona&&<div style={{marginTop:6}}><div style={{fontSize:11,color:"#888",marginBottom:3}}>Foto de quien cargó (capturada en el paso anterior)</div><img src={fotoPersona} style={{width:"100%",borderRadius:8}} alt="persona"/></div>}
        </div>
        <div className="card"><div className="ct">Firma de quien realizó la carga</div>

          <div style={{marginTop:8,fontSize:12,textAlign:"center"}}><b>{solicitante.nombre}</b><br/><span style={{fontSize:11,color:"#888"}}>Notif: {cat.config?.emailLogistica||"logística"}</span></div>
        </div>

        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(2)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0}} disabled={!sig||!fotoPersona||busy} onClick={submit}>{busy?"Enviando…":"Enviar reporte"}</button></div>
      </>}
    </div>
  );
