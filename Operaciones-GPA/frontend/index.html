function useSig(ref){
  const drawing=useRef(false);
  const start=e=>{drawing.current=true;const c=ref.current;const ctx=c.getContext("2d");const r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo((e.touches?.[0]||e).clientX-r.left,(e.touches?.[0]||e).clientY-r.top);};
  const move=e=>{if(!drawing.current)return;const c=ref.current;const ctx=c.getContext("2d");const r=c.getBoundingClientRect();ctx.lineTo((e.touches?.[0]||e).clientX-r.left,(e.touches?.[0]||e).clientY-r.top);ctx.strokeStyle=C.blue;ctx.lineWidth=2;ctx.stroke();};
  const end=()=>{drawing.current=false;};
  const clear=cb=>{ref.current?.getContext("2d").clearRect(0,0,400,150);cb&&cb(null);};
  return{start,move,end,clear};
}
// Lee la foto y la comprime a calidad ESTÁNDAR (máx 1280px lado mayor, JPEG ~60%)
// para reducir el uso de datos al subir. No-imágenes o errores: usa el original.
const IMG_MAX=1280, IMG_Q=0.6;
const readFile=(e,cb)=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    const src=ev.target.result;
    if(!/^image\//.test(f.type||"")){cb(src);return;}
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>=h&&w>IMG_MAX){h=Math.round(h*IMG_MAX/w);w=IMG_MAX;}
      else if(h>w&&h>IMG_MAX){w=Math.round(w*IMG_MAX/h);h=IMG_MAX;}
      try{const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",IMG_Q));}
      catch{cb(src);}
    };
    img.onerror=()=>cb(src);
    img.src=src;
  };
  r.readAsDataURL(f);
};

// Genera un PDF con diseño corporativo (encabezado GPA + el formato lleno).
// Toma el contenido del detalle (.pdf-area), quita botones (.no-print) y convierte
// las imágenes de S3 a dataURL para evitar problemas de CORS al renderizar.
// Convierte una URL (S3/local) a dataURL; null si falla.
async function _aDataURL(url){
  try{const r=await fetch(url);const b=await r.blob();return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b);});}
  catch(e){return null;}
}
// Genera el PDF con jsPDF DIRECTAMENTE (texto vectorial + imágenes), recorriendo el
// contenido del detalle (.pdf-area). NO usa html2canvas → funciona en iPhone/Android/PC
// (html2canvas rasterizaba en blanco en iOS Safari).
async function descargarPDFCorp(){
  const area=document.querySelector(".pdf-area");
  if(!area)return;
  const JS=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
  if(!JS){window.print();return;} // respaldo si no cargó la librería
  const titulo=area.dataset.pdftitle||"Formato GPA";
  const suc=area.dataset.pdfsucursal||"";
  const domicilio=DOMICILIOS[suc]||"";
  const clone=area.cloneNode(true);
  clone.querySelectorAll(".no-print").forEach(n=>n.remove());
  // Imágenes → dataURL (las que no se puedan, se omiten)
  for(const img of [...clone.querySelectorAll("img")]){const d=await _aDataURL(img.getAttribute("src"));if(d)img.setAttribute("src",d);else img.remove();}
  const logoData=await _aDataURL("logo.png");

  const doc=new JS({unit:"mm",format:"a4"});
  const PW=210,PH=297,M=12,CW=PW-2*M;let y=M;
  const ensure=h=>{if(y+h>PH-M){doc.addPage();y=M;}};
  const heading=t=>{t=(t||"").trim();if(!t)return;y+=2;ensure(8);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(24,95,165);doc.text(t,M,y);y+=2;doc.setDrawColor(225);doc.setLineWidth(0.2);doc.line(M,y,PW-M,y);y+=4;};
  const para=(t,o)=>{t=(t||"").trim();if(!t)return;o=o||{};const sz=o.size||10;doc.setFont("helvetica",o.bold?"bold":"normal");doc.setFontSize(sz);doc.setTextColor.apply(doc,o.color||[40,40,40]);const ls=doc.splitTextToSize(t,CW);for(const ln of ls){ensure(sz*0.5+1);doc.text(ln,M,y);y+=sz*0.42+1.8;}};
  const kv=(l,v)=>{l=(l||"").trim();v=(v==null?"":String(v)).trim();if(!l&&!v)return;doc.setFontSize(10);const L=doc.splitTextToSize(l,CW*0.44),R=doc.splitTextToSize(v,CW*0.52);const rows=Math.max(L.length,R.length);ensure(rows*4.6+1);doc.setFont("helvetica","normal");doc.setTextColor(120);doc.text(L,M,y);doc.setTextColor(40);doc.text(R,M+CW*0.46,y);y+=rows*4.6+1.5;};
  const addImg=d=>{try{const p=doc.getImageProperties(d);const s=Math.min((CW*0.62)/p.width,58/p.height);const w=p.width*s,h=p.height*s;ensure(h+3);doc.addImage(d,(p.fileType==="PNG"?"PNG":"JPEG"),M,y,w,h);y+=h+3;}catch(e){}};

  // Encabezado corporativo
  if(logoData){try{const lp=doc.getImageProperties(logoData);const lh=15,lw=Math.min(lp.width*(lh/lp.height),22);doc.addImage(logoData,"PNG",M,y,lw,lh);}catch(e){}}
  doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(24,95,165);doc.text("General de Productos para el Agua",M+24,y+5);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(80);doc.text(titulo+(suc?" — "+suc:""),M+24,y+10);
  let hb=18;
  if(domicilio){doc.setFontSize(7.5);doc.setTextColor(120);const dl=doc.splitTextToSize(domicilio,CW-26);doc.text(dl,M+24,y+14);hb=14+dl.length*3;}
  doc.setFontSize(8);doc.setTextColor(150);doc.text(new Date().toLocaleString("es-MX"),PW-M,y+4,{align:"right"});
  y+=hb;doc.setDrawColor(24,95,165);doc.setLineWidth(0.6);doc.line(M,y,PW-M,y);y+=5;

  // Chequeo de montacargas: ~30 puntos en DOS columnas (texto + resultado) para ahorrar hojas
  const compactChequeo=card=>{
    const ct=card.querySelector(".ct");heading(ct?ct.textContent:"Chequeo visual completo");
    const rows=[...card.children].filter(c=>c.tagName==="DIV"&&!(c.classList&&c.classList.contains("ct")));
    const items=rows.map(r=>{const sp=r.querySelectorAll("span");return {txt:(sp[0]?sp[0].textContent:"").trim(),res:(sp.length?sp[sp.length-1].textContent:"").trim()};});
    const half=Math.ceil(items.length/2),colW=CW/2-1,lineH=4.3;
    const colColor=res=>res==="O"?[46,107,17]:res==="P"?[163,45,45]:[120,120,120];
    const cell=(it,x)=>{if(!it)return;doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor.apply(doc,colColor(it.res));doc.text((it.res||"").substring(0,3),x,y);doc.setFont("helvetica","normal");doc.setTextColor(70);const t=doc.splitTextToSize(it.txt,colW-9)[0]||"";doc.text(t,x+8,y);};
    for(let i=0;i<half;i++){ensure(lineH);cell(items[i],M);cell(items[i+half],M+CW/2+1);y+=lineH;}
    y+=2;
  };
  // Recorrido del detalle
  const INL=["SPAN","B","A","STRONG","EM","SMALL","I"];
  const walk=node=>{
    for(const el of node.children){
      const tag=el.tagName;
      if(el.classList&&el.classList.contains("card")){const ct0=el.querySelector(".ct");if(ct0&&/chequeo visual/i.test(ct0.textContent)){compactChequeo(el);continue;}}
      if(tag==="IMG"){const s=el.getAttribute("src");if(s&&s.indexOf("data:")===0)addImg(s);continue;}
      if(tag==="BR")continue;
      if(el.classList&&el.classList.contains("ct")){heading(el.textContent);continue;}
      if(el.classList&&el.classList.contains("dr")){const sp=el.querySelectorAll("span");kv(sp[0]&&sp[0].textContent,sp[sp.length-1]&&sp[sp.length-1].textContent);continue;}
      const kids=[...el.children];
      if(kids.length>=2&&kids.every(c=>INL.includes(c.tagName))){const sp=kids;kv(sp[0].textContent,sp.slice(1).map(s=>s.textContent).join(" "));continue;}
      if(kids.length===0){para(el.textContent);continue;}
      walk(el);
    }
  };
  walk(clone);

  const fname=titulo.replace(/[^a-zA-Z0-9]+/g,"_")+"_"+new Date().toISOString().slice(0,10)+".pdf";
  try{doc.save(fname);}catch(e){try{window.open(doc.output("bloburl"),"_blank");}catch(e2){alert("No se pudo generar el PDF: "+e.message);}}
}

function csvDownload(nombre,cols,filas){
  const esc=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const csv=[cols.join(","),...filas.map(r=>r.map(esc).join(","))].join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=nombre+".csv";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}

// ─── LOGIN ──────────────────────────────────────────────────────────
function Login({onLogin,onSetNewPassword}){
  const[u,setU]=useState("");const[p,setP]=useState("");const[err,setErr]=useState("");const[busy,setBusy]=useState(false);
  const[needNew,setNeedNew]=useState(false);const[np,setNp]=useState("");const[np2,setNp2]=useState("");
  const[fp,setFp]=useState(0);const[code,setCode]=useState("");const[msg,setMsg]=useState(""); // fp: 0 login · 1 pedir código · 2 confirmar
  const go=async()=>{
    setErr("");setBusy(true);
    try{ const r=await onLogin(u.trim(),p);
      if(r&&r.challenge==="NEW_PASSWORD_REQUIRED")setNeedNew(true);
      else if(r&&r.challenge==="PASSWORD_RESET_REQUIRED"){setErr("");setFp(1);setMsg("Tu administrador restableció tu contraseña. Pulsa \"Enviar código\" para recibir un código por correo y crear una nueva.");}
    }
    catch(e){ setErr(e.message||"No se pudo iniciar sesión"); }
    setBusy(false);
  };
  const setNew=async()=>{
    setErr("");
    if(np.length<8)return setErr("La contraseña debe tener al menos 8 caracteres");
    if(np!==np2)return setErr("Las contraseñas no coinciden");
    setBusy(true);
    try{ await onSetNewPassword(np); }
    catch(e){ setErr(e.message||"No se pudo establecer la contraseña"); }
    setBusy(false);
  };
  const pedirCodigo=async()=>{
    setErr("");setMsg("");
    if(!u||!u.includes("@"))return setErr("Escribe tu correo primero");
    setBusy(true);
    try{ await api.forgotPassword(u.trim()); setFp(2); setMsg("Te enviamos un código a tu correo. Revísalo (y la carpeta de spam)."); }
    catch(e){ setErr(e.message||"No se pudo enviar el código"); }
    setBusy(false);
  };
  const confirmar=async()=>{
    setErr("");
    if(!code.trim())return setErr("Escribe el código que recibiste");
    if(np.length<8)return setErr("La contraseña debe tener al menos 8 caracteres");
    if(np!==np2)return setErr("Las contraseñas no coinciden");
    setBusy(true);
    try{ await api.confirmForgotPassword(u.trim(),code,np); setFp(0);setMsg("Contraseña actualizada. Ya puedes iniciar sesión.");setCode("");setNp("");setNp2("");setP(""); }
    catch(e){ setErr(e.message||"No se pudo cambiar la contraseña"); }
    setBusy(false);
  };
  const volverLogin=()=>{setFp(0);setErr("");setMsg("");setCode("");setNp("");setNp2("");};
  return(
    <div className="lw">
      <style>{GCS}</style>
      <div style={{width:120,height:120,marginBottom:16,display:"flex",alignItems:"center",justifyContent:"center"}}><img src="logo.png" alt="GPA Aqua" style={{maxWidth:"100%",maxHeight:"100%",objectFit:"contain"}}/></div>
      <div style={{fontSize:17,fontWeight:700,color:"#222",marginBottom:4,textAlign:"center"}}>General de Productos para el Agua</div>
      <div style={{fontSize:13,color:"#888",marginBottom:24}}>Sistema de Control de Unidades</div>
      <div style={{width:"100%",maxWidth:340}}>
        <div className="card">
          {needNew ? <>
            <div style={{fontSize:14,fontWeight:700,color:"#222",marginBottom:6}}>Establece tu nueva contraseña</div>
            <div style={{fontSize:11,color:"#888",marginBottom:12}}>Es tu primer ingreso. Define una contraseña (mín. 8 caracteres, con minúsculas y números).</div>
            <label>Nueva contraseña</label><input type="password" value={np} onChange={e=>setNp(e.target.value)} placeholder="••••••"/>
            <label>Confirmar contraseña</label><input type="password" value={np2} onChange={e=>setNp2(e.target.value)} placeholder="••••••" onKeyDown={e=>e.key==="Enter"&&setNew()}/>
            {err&&<div className="eb" style={{marginTop:8}}>{err}</div>}
            <button className="bp" onClick={setNew} disabled={busy||!np||!np2} style={{marginTop:14}}>{busy?"Guardando…":"Guardar y entrar"}</button>
          </> : fp===1 ? <>
            <div style={{fontSize:14,fontWeight:700,color:"#222",marginBottom:6}}>Recuperar contraseña</div>
            <div style={{fontSize:11,color:"#888",marginBottom:12}}>Escribe tu correo y te enviaremos un código para restablecerla.</div>
            <label>Correo</label><input type="text" value={u} onChange={e=>setU(e.target.value)} placeholder="usuario@gpa.com.mx" autoCapitalize="off" onKeyDown={e=>e.key==="Enter"&&pedirCodigo()}/>
            {msg&&<div style={{background:C.greenLt,color:C.green,borderRadius:6,padding:"7px 10px",fontSize:12,marginTop:8}}>{msg}</div>}
            {err&&<div className="eb" style={{marginTop:8}}>{err}</div>}
            <button className="bp" onClick={pedirCodigo} disabled={busy||!u} style={{marginTop:14}}>{busy?"Enviando…":"Enviar código"}</button>
            <div style={{textAlign:"center",marginTop:10}}><a onClick={volverLogin} style={{fontSize:12,color:C.blue,cursor:"pointer"}}>← Volver</a></div>
          </> : fp===2 ? <>
            <div style={{fontSize:14,fontWeight:700,color:"#222",marginBottom:6}}>Restablecer contraseña</div>
            <div style={{fontSize:11,color:"#888",marginBottom:12}}>Escribe el código que llegó a {u} y tu nueva contraseña.</div>
            <label>Código de verificación</label><input type="text" value={code} onChange={e=>setCode(e.target.value)} placeholder="123456" inputMode="numeric"/>
            <label>Nueva contraseña</label><input type="password" value={np} onChange={e=>setNp(e.target.value)} placeholder="••••••"/>
            <label>Confirmar contraseña</label><input type="password" value={np2} onChange={e=>setNp2(e.target.value)} placeholder="••••••" onKeyDown={e=>e.key==="Enter"&&confirmar()}/>
            {err&&<div className="eb" style={{marginTop:8}}>{err}</div>}
            <button className="bp" onClick={confirmar} disabled={busy||!code||!np||!np2} style={{marginTop:14}}>{busy?"Guardando…":"Cambiar contraseña"}</button>
            <div style={{textAlign:"center",marginTop:10}}><a onClick={()=>setFp(1)} style={{fontSize:12,color:C.blue,cursor:"pointer"}}>Reenviar código</a> · <a onClick={volverLogin} style={{fontSize:12,color:C.blue,cursor:"pointer"}}>Volver</a></div>
          </> : <>
            <label>Correo</label><input type="text" value={u} onChange={e=>setU(e.target.value)} placeholder="usuario@gpa.com.mx" autoCapitalize="off"/>
            <label>Contraseña</label><input type="password" value={p} onChange={e=>setP(e.target.value)} placeholder="••••••" onKeyDown={e=>e.key==="Enter"&&go()}/>
            {err&&<div className="eb" style={{marginTop:8}}>{err}</div>}
            {msg&&<div style={{background:C.greenLt,color:C.green,borderRadius:6,padding:"7px 10px",fontSize:12,marginTop:8}}>{msg}</div>}
            <button className="bp" onClick={go} disabled={busy||!u||!p} style={{marginTop:14}}>{busy?"Entrando…":"Iniciar sesión"}</button>
            <div style={{textAlign:"center",marginTop:10}}><a onClick={()=>{setErr("");setMsg("");setFp(1);}} style={{fontSize:12,color:C.blue,cursor:"pointer"}}>¿Olvidaste tu contraseña?</a></div>
          </>}
        </div>
        <div style={{fontSize:11,color:"#aaa",textAlign:"center",marginTop:8}}>Credenciales asignadas por administrador</div>
      </div>
    </div>
  );
}

// Formulario dinámico multipaso (1 sección = 1 paso) construido desde la plantilla
function FormDinamico({plantilla,cat,rol,sucursalesUser,session,onDone,showToast}){
  const yo=cat.users.find(u=>u.mail===session.email)||null;
  const secs=plantilla.secciones||[];
  const availVeh=cat.vehicles.filter(v=>v.activo&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(v.sucursal)));
  const sucOpts=(sucursalesUser&&!["admin","analista"].includes(rol))?sucursalesUser:cat.sucursales;
  const[suc,setSuc]=useState(sucOpts[0]||session.sucursal||"");
  const[ans,setAns]=useState({});const[obs,setObs]=useState("");const[sig,setSig]=useState(null);
  const[step,setStep]=useState(0);const[busy,setBusy]=useState(false);
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  const reqFirma=plantilla.requiereFirma!==false;
  const total=secs.length+2;const isLast=step===total-1;const curSec=step>0&&step<total-1?secs[step-1]:null;
  const setA=(id,v)=>setAns(a=>({...a,[id]:v}));const getA=id=>ans[id];
  const submit=async()=>{
    if(busy)return;
    if(!suc)return showToast("⚠️ Falta la sucursal");
    if(reqFirma&&!sig)return showToast("⚠️ Falta la firma");
    setBusy(true);
    try{
      const datos={sucursal:suc,responsable:yo?.nombre||session.nombre,answers:ans,obs};
      if(reqFirma)datos.firma=sig;
      const subido=await api.subirEvidencias("formulario",datos);
      await api.crearFormulario(plantilla.clave,subido);
      showToast("✓ Formulario enviado");onDone&&onDone();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:13,fontWeight:700,color:C.blue}}>{plantilla.nombre}</span><span style={{fontSize:11,color:"#888"}}>Paso {step+1}/{total}</span></div>
      <div className="sb">{Array.from({length:total}).map((_,i)=><div key={i} className="sd" style={{background:step>=i?C.blue:"#e0e0e0"}}/>)}</div>
      {step===0&&<div>
        <div className="card"><div className="ct">Datos Generales</div>
          <label>Sucursal</label><select value={suc} onChange={e=>setSuc(e.target.value)}><option value="">— Selecciona —</option>{sucOpts.map(s=><option key={s}>{s}</option>)}</select>
          <label>Responsable</label><input type="text" value={yo?.nombre||session.nombre} disabled style={{background:"#f5f5f5",color:"#888"}}/>
        </div>
        <button className="bp" disabled={!suc} onClick={()=>setStep(1)}>Siguiente →</button>
      </div>}
      {curSec&&<div>
        <div className="card"><div className="ct">{curSec.title}</div>
          {(curSec.items||[]).map(item=>condOK(item,getA)?<CampoForm key={item.id} item={item} getA={getA} setA={setA} availVeh={availVeh}/>:null)}
        </div>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(s=>s-1)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0}} onClick={()=>setStep(s=>s+1)}>Siguiente →</button></div>
      </div>}
      {isLast&&<div>
        <div className="card"><div className="ct">Observaciones</div><textarea rows={3} value={obs} onChange={e=>setObs(e.target.value)} placeholder="Comentarios (si aplica)"/></div>
        {reqFirma&&<div className="card"><div className="ct">Firma</div>
          <canvas ref={sigRef} className="sig" width={340} height={120} onMouseDown={sigH.start} onMouseMove={sigH.move} onMouseUp={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}} onTouchStart={sigH.start} onTouchMove={sigH.move} onTouchEnd={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}}/>
          <button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>sigH.clear(setSig)}>Limpiar</button>
          <div style={{marginTop:8,fontSize:12,textAlign:"center"}}><b>{yo?.nombre||session.nombre}</b></div>
        </div>}
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(s=>s-1)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0}} disabled={busy||(reqFirma&&!sig)} onClick={submit}>{busy?"Enviando…":"Enviar"}</button></div>
      </div>}
    </div>
  );
}

function SolForm({cat,items,session,rol,sucursalesUser,refrescar,showToast,onDone}){
  const yo=cat.users.find(u=>u.mail===session.email)||null;
  // Combustible: Gasolina, Diésel y Gas LP cargan combustible; solo se excluyen los eléctricos.
  const availVeh=cat.vehicles.filter(v=>v.activo&&v.combustible!=="Electrico"&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(v.sucursal)));
  // El solicitante SIEMPRE es la persona que inició sesión (match por su correo).
  const solicitante=yo||{id:null,nombre:session.nombre||session.email,mail:session.email};
  // Borrador: guarda lo no enviado para retomarlo después. No se envía → no cuenta para km/controles.
  const DKEY="gpa_sol_draft_"+session.email;
  const draftRef=useRef(undefined);
  if(draftRef.current===undefined){try{draftRef.current=JSON.parse(localStorage.getItem(DKEY))||{};}catch{draftRef.current={};}}
  const D=draftRef.current;
  const[veh,setVeh]=useState(D.veh||(availVeh[0]?String(availVeh[0].id):""));
  const[km,setKm]=useState(D.km||"");const[tank,setTank]=useState(D.tank||0.25);const[obs,setObs]=useState(D.obs||"");
  const[photo,setPhoto]=useState(D.photo||null);const[sig,setSig]=useState(D.sig||null);const[step,setStep]=useState(D.step||1);const[busy,setBusy]=useState(false);
  const[teniaBorrador]=useState(!!(D.km||D.photo||D.obs||(D.step&&D.step>1)));
  useEffect(()=>{try{localStorage.setItem(DKEY,JSON.stringify({veh,km,tank,obs,photo,sig,step}));}catch{}},[veh,km,tank,obs,photo,sig,step]);
  const descartarBorrador=()=>{try{localStorage.removeItem(DKEY);}catch{}setVeh(availVeh[0]?String(availVeh[0].id):"");setKm("");setTank(0.25);setObs("");setPhoto(null);setSig(null);setStep(1);showToast("Borrador descartado");};
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  const vehicle=cat.vehicles.find(v=>String(v.id)===String(veh));
  const user=solicitante;
  const need=Math.max(0,1-tank);const litros=vehicle?Math.round(vehicle.tanque*need):0;const monto=vehicle?Math.round(litros*vehicle.precio):0;
  const lastKm=items.filter(s=>String(s.vehicleId)===String(veh)).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]?.km??null;
  // Montacargas (Gas LP/Eléctrico): máx 100 km entre cargas; vehículos normales: 1000
  const maxDeltaKm=vehicle&&(vehicle.combustible==="Gas LP"||vehicle.combustible==="Electrico")?100:1000;
  const kmN=parseFloat(km);const kmErr=km&&lastKm!=null?(kmN<lastKm?`No puede ser menor al último: ${lastKm.toLocaleString()} km`:kmN-lastKm>maxDeltaKm?`No puede exceder ${maxDeltaKm.toLocaleString()} km del último (${lastKm.toLocaleString()} km)`:null):null;
  const submit=async()=>{
    if(!vehicle||!user||busy)return;
    setBusy(true);
    try{
      const datos={vehicleId:vehicle.id,placas:vehicle.placas,subMarca:vehicle.subMarca,sucursal:vehicle.sucursal,economico:vehicle.economico,combustible:vehicle.combustible,producto:vehicle.producto,precio:vehicle.precio,tanque:vehicle.tanque,userId:user.id,responsable:user.nombre,mail:user.mail,km:kmN,tankBefore:tank,tankAfter:1,necesidad:need,litros,monto,obs,photo,firma:sig,status:"Pendiente"};
      const subido=await api.subirEvidencias("combustible",datos);
      await api.crear("combustible",subido);
      try{localStorage.removeItem(DKEY);}catch{}
      showToast("✓ Solicitud enviada");
      await refrescar();
      onDone();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  return(
    <div>
      <div className="sb">{[1,2,3].map(s=><div key={s} className="sd" style={{background:step>=s?C.blue:"#e0e0e0"}}/>)}</div>
      {teniaBorrador&&<div className="wb" style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}><span>📝 Retomaste un borrador no enviado.</span><button className="bd" style={{padding:"4px 10px",fontSize:11}} onClick={descartarBorrador}>Descartar</button></div>}
      {step===1&&<>
        <div className="card">
          <div className="ct">Vehículo</div>
          <select value={veh} onChange={e=>setVeh(e.target.value)}><option value="">— Selecciona —</option>{availVeh.map(v=><option key={v.id} value={v.id}>#{v.economico} · {v.placas} · {v.subMarca}</option>)}</select>

// ─── REPORTE DE CARGA REALIZADA (formato PDF) ───────────────────────
function RepForm({cat,items,session,rol,sucursalesUser,refrescar,showToast,onDone}){
  const yo=cat.users.find(u=>u.mail===session.email)||null;
  const availVeh=cat.vehicles.filter(v=>v.activo&&v.combustible!=="Electrico"&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(v.sucursal)));
  const solicitante=yo||{id:null,nombre:session.nombre||session.email,mail:session.email};
  const DKEY="gpa_rep_draft_"+session.email;
  const draftRef=useRef(undefined);
  if(draftRef.current===undefined){try{draftRef.current=JSON.parse(localStorage.getItem(DKEY))||{};}catch{draftRef.current={};}}
  const D=draftRef.current;
  const[veh,setVeh]=useState(D.veh||(availVeh[0]?String(availVeh[0].id):""));
  const[km,setKm]=useState(D.km||"");
  const[fotoAntes,setFotoAntes]=useState(D.fotoAntes||null);const[fotoDespues,setFotoDespues]=useState(D.fotoDespues||null);
  const[lleno,setLleno]=useState(D.lleno||"Si");
  const[fotoBomba,setFotoBomba]=useState(D.fotoBomba||null);
  const[litros,setLitros]=useState(D.litros||"");const[precioLitro,setPrecioLitro]=useState(D.precioLitro||"");const[monto,setMonto]=useState(D.monto||"");
  const[fotoTicket,setFotoTicket]=useState(D.fotoTicket||null);const[ubic,setUbic]=useState(D.ubic||null);
  const[fotoPersona,setFotoPersona]=useState(D.fotoPersona||null);const[obs,setObs]=useState(D.obs||"");const[sig,setSig]=useState(D.sig||null);
  const[step,setStep]=useState(D.step||1);const[busy,setBusy]=useState(false);const[geo,setGeo]=useState(false);
  const[teniaBorrador]=useState(!!(D.km||D.fotoAntes||D.litros||(D.step&&D.step>1)));
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  useEffect(()=>{try{localStorage.setItem(DKEY,JSON.stringify({veh,km,fotoAntes,fotoDespues,lleno,fotoBomba,litros,precioLitro,monto,fotoTicket,ubic,fotoPersona,obs,sig,step}));}catch{}},[veh,km,fotoAntes,fotoDespues,lleno,fotoBomba,litros,precioLitro,monto,fotoTicket,ubic,fotoPersona,obs,sig,step]);
  const descartar=()=>{try{localStorage.removeItem(DKEY);}catch{}setVeh(availVeh[0]?String(availVeh[0].id):"");setKm("");setFotoAntes(null);setFotoDespues(null);setLleno("Si");setFotoBomba(null);setLitros("");setPrecioLitro("");setMonto("");setFotoTicket(null);setUbic(null);setFotoPersona(null);setObs("");setSig(null);setStep(1);showToast("Borrador descartado");};
  const vehicle=cat.vehicles.find(v=>String(v.id)===String(veh));
  const lastKm=items.filter(s=>String(s.vehicleId)===String(veh)).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]?.km??null;
  const maxDeltaKm=vehicle&&(vehicle.combustible==="Gas LP"||vehicle.combustible==="Electrico")?100:1000;
  const kmN=parseFloat(km);const kmErr=km&&lastKm!=null?(kmN<lastKm?`No puede ser menor al último: ${lastKm.toLocaleString()} km`:kmN-lastKm>maxDeltaKm?`No puede exceder ${maxDeltaKm.toLocaleString()} km del último (${lastKm.toLocaleString()} km)`:null):null;
  const obtenerUbic=()=>{
    if(!navigator.geolocation){showToast("Este dispositivo no tiene GPS");return;}
    setGeo(true);
    navigator.geolocation.getCurrentPosition(async pos=>{
      const lat=pos.coords.latitude,lng=pos.coords.longitude;let direccion="";
      try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`);const d=await r.json();direccion=d.display_name||"";}catch{}
      setUbic({lat,lng,direccion});setGeo(false);
    },()=>{showToast("No se pudo obtener la ubicación (permite el GPS)");setGeo(false);},{enableHighAccuracy:true,timeout:12000,maximumAge:0});
  };
  useEffect(()=>{if(step===2&&!ubic&&!geo)obtenerUbic();},[step]);
  const can1=veh&&km&&!kmErr&&fotoAntes&&fotoDespues;
  const can2=fotoBomba&&litros&&precioLitro&&monto&&fotoTicket;
  const submit=async()=>{
    if(!vehicle||busy||!sig||!fotoPersona)return;setBusy(true);
    try{
      const datos={formato:"reporte",vehicleId:vehicle.id,economico:vehicle.economico,placas:vehicle.placas,subMarca:vehicle.subMarca,sucursal:vehicle.sucursal,areaResponsable:vehicle.responsable,combustible:vehicle.combustible,producto:vehicle.producto,precio:vehicle.precio,tanque:vehicle.tanque,km:kmN,fotoAntes,fotoDespues,lleno,fotoBomba,litros:parseFloat(litros)||0,precioLitro:parseFloat(precioLitro)||0,monto:parseFloat(monto)||0,fotoTicket,ubicacion:ubic,userId:solicitante.id,responsable:solicitante.nombre,mail:solicitante.mail,fotoPersona,firma:sig,obs,status:"Pendiente"};
      const subido=await api.subirEvidencias("combustible",datos);
      await api.crear("combustible",subido);
      try{localStorage.removeItem(DKEY);}catch{}
      showToast("✓ Reporte de carga enviado");await refrescar();onDone();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  return(
    <div>
      <div className="sb">{[1,2,3].map(s=><div key={s} className="sd" style={{background:step>=s?C.blue:"#e0e0e0"}}/>)}</div>
      {teniaBorrador&&<div className="wb" style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}><span>📝 Retomaste un reporte no enviado.</span><button className="bd" style={{padding:"4px 10px",fontSize:11}} onClick={descartar}>Descartar</button></div>}
      {step===1&&<>
        <div className="card"><div className="ct">Generales del Vehículo</div>
          <select value={veh} onChange={e=>setVeh(e.target.value)}><option value="">— Selecciona —</option>{availVeh.map(v=><option key={v.id} value={v.id}>#{v.economico} · {v.placas} · {v.subMarca}</option>)}</select>
          {vehicle&&<div style={{marginTop:8,fontSize:12}}><div className="dr"><span>Sucursal</span><span>{vehicle.sucursal}</span></div><div className="dr"><span>Responsable (área)</span><span>{vehicle.responsable}</span></div><div className="dr"><span>Combustible</span><span>{vehicle.combustible}</span></div><div className="dr"><span>Precio catálogo/L</span><span>${vehicle.precio.toFixed(2)}</span></div><div className="dr"><span>Tanque</span><span>{vehicle.tanque}L</span></div><div className="dr"><span>Producto</span><span>{vehicle.producto}</span></div></div>}
        </div>
        <div className="card"><div className="ct">Datos del vehículo para la carga</div>
          <label>Kilometraje al cargar combustible</label><input type="number" value={km} onChange={e=>setKm(e.target.value)} placeholder="Ej. 14806"/>
          {lastKm!=null&&<div style={{fontSize:11,color:"#888",marginTop:3}}>Último registro: {lastKm.toLocaleString()} km</div>}
          {kmErr&&<div className="eb">{kmErr}</div>}
          <FotoCampo val={fotoAntes} set={setFotoAntes} label="Foto de km y medidor ANTES de cargar (ambos en la misma foto)"/>
          <FotoCampo val={fotoDespues} set={setFotoDespues} label="Foto del medidor al FINALIZAR la carga"/>
          <label>¿Se llenó el tanque?</label>
          <div className="rr">{["Si","No"].map(o=><button key={o} className={"rb"+(lleno===o?" O":"")} onClick={()=>setLleno(o)}>{o}</button>)}</div>
        </div>
        <button className="bp" disabled={!can1} onClick={()=>setStep(2)}>Siguiente →</button>
      </>}
      {step===2&&<>
        <div className="card"><div className="ct">Datos de la gasolinera</div>
          <FotoCampo val={fotoBomba} set={setFotoBomba} label="Foto de la bomba al finalizar carga"/>
          <label>Litros cargados</label><input type="number" step="0.001" value={litros} onChange={e=>setLitros(e.target.value)} placeholder="Ej. 53.229"/>
          <label>Precio por litro (debe coincidir con fotos)</label><input type="number" step="0.01" value={precioLitro} onChange={e=>setPrecioLitro(e.target.value)} placeholder="Ej. 28.18"/>
          <label>Monto total de la carga ($)</label><input type="number" step="0.01" value={monto} onChange={e=>setMonto(e.target.value)} placeholder="Ej. 1499.99"/>
          <FotoCampo val={fotoTicket} set={setFotoTicket} label="Foto del ticket de carga (fecha y hora deben coincidir)"/>
          <label>Ubicación de carga (automática)</label>
          <div style={{fontSize:12,color:"#555",background:"#fafafa",borderRadius:6,padding:"8px 10px"}}>{geo?"Obteniendo ubicación…":ubic?(ubic.direccion||`${ubic.lat.toFixed(5)}, ${ubic.lng.toFixed(5)}`):"Sin ubicación"}</div>
          <button className="bs" style={{width:"100%",marginTop:6}} onClick={obtenerUbic} disabled={geo}>📍 {ubic?"Actualizar ubicación":"Obtener ubicación"}</button>
        </div>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(1)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0}} disabled={!can2} onClick={()=>setStep(3)}>Siguiente →</button></div>
      </>}
      {step===3&&<>
        <div className="card"><div className="ct">Quien realizó la carga</div>
          <div className="dr"><span>Responsable</span><span>{solicitante.nombre}</span></div><div className="dr"><span>Correo</span><span>{solicitante.mail}</span></div>
          <FotoCampo val={fotoPersona} set={setFotoPersona} label="Foto de quien realiza la carga en la bomba" capture="user"/>
        </div>
        <div className="card"><div className="ct">Firma de quien realizó la carga</div>
          <canvas ref={sigRef} className="sig" width={340} height={130} onMouseDown={sigH.start} onMouseMove={sigH.move} onMouseUp={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}} onTouchStart={sigH.start} onTouchMove={sigH.move} onTouchEnd={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}}/>
          <button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>sigH.clear(setSig)}>Limpiar</button>
          <div style={{marginTop:8,fontSize:12,textAlign:"center"}}><b>{solicitante.nombre}</b><br/><span style={{fontSize:11,color:"#888"}}>Notif: {cat.config?.emailLogistica||"logística"}</span></div>
        </div>
        <label>Observaciones</label><textarea rows={2} style={{marginBottom:10}} value={obs} onChange={e=>setObs(e.target.value)} placeholder="Notas (opcional)"/>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(2)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0}} disabled={!sig||!fotoPersona||busy} onClick={submit}>{busy?"Enviando…":"Enviar reporte"}</button></div>
      </>}
    </div>
  );

    </div>
  );
}

function CLForm({tipo,cat,items,session,rol,sucursalesUser,refrescar,showToast,onDone}){
  const sections=tipo==="semanal"?SEMANAL_SEC:MENSUAL_SEC;
  const yo=cat.users.find(u=>u.mail===session.email)||null;
  const availVeh=cat.vehicles.filter(v=>v.activo&&v.combustible!=="Gas LP"&&v.combustible!=="Electrico"&&catVeh(v)==="reparto"&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(v.sucursal)));
  const availUsr=cat.users.filter(u=>u.activo&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(u.sucursal)));
  const[veh,setVeh]=useState(availVeh[0]?String(availVeh[0].id):"");
  const[usr,setUsr]=useState(yo?String(yo.id):availUsr[0]?String(availUsr[0].id):"");
  const[km,setKm]=useState("");const[fotoKm,setFotoKm]=useState(null);const[ans,setAns]=useState({});const[sig,setSig]=useState(null);const[obs,setObs]=useState("");const[step,setStep]=useState(0);const[busy,setBusy]=useState(false);
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  const vehicle=cat.vehicles.find(v=>String(v.id)===String(veh));const user=cat.users.find(u=>String(u.id)===String(usr));
  const total=sections.length+2;const isLast=step===total-1;const curSec=step>0&&step<total-1?sections[step-1]:null;
  const setA=(id,v)=>setAns(a=>({...a,[id]:v}));const getA=id=>ans[id];
  const visible=item=>{if(!item.cond)return true;const[cid,cv]=item.cond.split(":");return String(getA(cid))===cv;};
  const submit=async()=>{
    if(!vehicle||!user||!km||!fotoKm||!sig||busy)return;
    setBusy(true);
    try{
      const datos={tipo,vehicleId:vehicle.id,placas:vehicle.placas,subMarca:vehicle.subMarca,sucursal:vehicle.sucursal,economico:vehicle.economico,userId:user.id,responsable:user.nombre,km:parseFloat(km),fotoKm,answers:ans,obs,firma:sig,status:"Aprobado"};
      const subido=await api.subirEvidencias("checklist",datos);
      await api.crear("checklist",subido);
      showToast("✓ Checklist enviado");await refrescar();onDone();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:13,fontWeight:700,color:tipo==="semanal"?C.blue:C.green}}>{tipo==="semanal"?"Checklist Semanal":"Checklist Mensual"}</span><span style={{fontSize:11,color:"#888"}}>Paso {step+1}/{total}</span></div>
      <div className="sb">{Array.from({length:total}).map((_,i)=><div key={i} className="sd" style={{background:step>=i?(tipo==="semanal"?C.blue:C.green):"#e0e0e0"}}/>)}</div>
      {step===0&&<div>
        <div className="card"><div className="ct">Datos Generales</div>
          <label>Vehículo</label><select value={veh} onChange={e=>setVeh(e.target.value)}><option value="">— Selecciona —</option>{availVeh.map(v=><option key={v.id} value={v.id}>#{v.economico} · {v.placas}</option>)}</select>
          <label>Responsable que verifica</label><select value={usr} onChange={e=>setUsr(e.target.value)}><option value="">— Selecciona —</option>{availUsr.map(u=><option key={u.id} value={u.id}>{u.nombre}</option>)}</select>
          <label>Kilometraje del día</label><input type="number" value={km} onChange={e=>setKm(e.target.value)} placeholder="Ej. 97710"/>
          <label>Foto del kilometraje</label>
          <div className="pb">{!fotoKm&&<><div style={{fontSize:22}}>📷</div><div style={{marginTop:3}}>Toca para capturar</div></>}{fotoKm&&<img src={fotoKm} alt="km"/>}<input type="file" accept="image/*" capture="environment" onChange={e=>readFile(e,setFotoKm)}/></div>
          {fotoKm&&<button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>setFotoKm(null)}>Cambiar foto</button>}
        </div>
        <button className="bp" disabled={!veh||!usr||!km||!fotoKm} onClick={()=>setStep(1)} style={{background:tipo==="semanal"?C.blue:C.green}}>Siguiente →</button>
      </div>}
      {curSec&&<div>
        <div className="card"><div className="ct">{curSec.title}</div>
          {curSec.items.map(item=>{
            if(!visible(item))return null;const v=getA(item.id);
            return(
              <div key={item.id} style={{marginBottom:10}}>
                <label>{item.label}</label>
                {item.type==="select"&&<select value={v||""} onChange={e=>setA(item.id,e.target.value)}><option value="">— Selecciona —</option>{item.opts.map(o=><option key={o}>{o}</option>)}</select>}
                {item.type==="text"&&<input type="text" value={v||""} onChange={e=>setA(item.id,e.target.value)}/>}
                {item.type==="number"&&<input type="number" value={v||""} onChange={e=>setA(item.id,e.target.value)}/>}
                {item.type==="date"&&<input type="date" value={v||""} onChange={e=>setA(item.id,e.target.value)}/>}
                {item.type==="taco"&&<div className="tcg">{TACO_OPTS.map(n=><button key={n} className={"tcb"+(v===n?" sel":"")} onClick={()=>setA(item.id,n)}>{n}</button>)}</div>}
                {item.type==="photo"&&<div><div className="pb">{!v&&<><div style={{fontSize:20}}>📷</div><div style={{fontSize:11,marginTop:2}}>Toca para capturar</div></>}{v&&<img src={v} alt={item.label}/>}<input type="file" accept="image/*" capture="environment" onChange={e=>readFile(e,d=>setA(item.id,d))}/></div>{v&&<button className="bs" style={{marginTop:4,width:"100%",fontSize:11}} onClick={()=>setA(item.id,null)}>Cambiar</button>}</div>}
                {item.type==="damage_list"&&<DmgList value={v||[]} onChange={w=>setA(item.id,w)}/>}
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(s=>s-1)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0,background:tipo==="semanal"?C.blue:C.green}} onClick={()=>setStep(s=>s+1)}>Siguiente →</button></div>
      </div>}
      {isLast&&<div>
        <div className="card"><div className="ct">Observaciones</div><textarea rows={3} value={obs} onChange={e=>setObs(e.target.value)} placeholder="Reportes o comentarios (solo si aplica)"/></div>
        <div className="card"><div className="ct">Firma de quien verifica</div>
          <canvas ref={sigRef} className="sig" width={340} height={120} onMouseDown={sigH.start} onMouseMove={sigH.move} onMouseUp={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}} onTouchStart={sigH.start} onTouchMove={sigH.move} onTouchEnd={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}}/>
          <button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>sigH.clear(setSig)}>Limpiar</button>
          {user&&<div style={{marginTop:8,fontSize:12,textAlign:"center"}}><b>{user.nombre}</b><br/><span style={{fontSize:11,color:"#888"}}>Notif: {cat.config?.emailRiesgos||"riesgos"}</span></div>}
        </div>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(s=>s-1)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0,background:tipo==="semanal"?C.blue:C.green}} disabled={!sig||busy} onClick={submit}>{busy?"Enviando…":"Enviar checklist"}</button></div>
      </div>}
    </div>
  );
}

function DmgList({value,onChange}){
  const add=()=>onChange([...value,{foto:null,desc:""}]);
  const upd=(i,f,v)=>{const n=[...value];n[i]={...n[i],[f]:v};onChange(n);};
  const del=i=>onChange(value.filter((_,j)=>j!==i));
  return(
    <div>
      {value.map((d,i)=>(
        <div key={i} style={{background:"#fafafa",borderRadius:8,border:".5px solid #eee",padding:10,marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:12,fontWeight:600}}>Daño #{i+1}</span><button className="bd" style={{padding:"4px 10px",fontSize:11}} onClick={()=>del(i)}>Eliminar</button></div>
          <div className="pb" style={{marginBottom:6}}>{!d.foto&&<><div style={{fontSize:18}}>📷</div><div style={{fontSize:11}}>Foto del daño</div></>}{d.foto&&<img src={d.foto} alt="daño"/>}<input type="file" accept="image/*" capture="environment" onChange={e=>readFile(e,r=>upd(i,"foto",r))}/></div>
          {d.foto&&<button className="bs" style={{width:"100%",fontSize:11,marginBottom:6}} onClick={()=>upd(i,"foto",null)}>Cambiar foto</button>}
          <label>Descripción</label><input type="text" value={d.desc} onChange={e=>upd(i,"desc",e.target.value)} placeholder="Ej. Golpe puerta piloto"/>
        </div>
      ))}
      <button className="bs" style={{width:"100%",marginTop:4}} onClick={add}>+ Agregar daño</button>
    </div>
  );
}

function CLHistory({items,onSelect}){
  const[f,setF]=useState("Todos");const[rDesde,setRDesde]=useState("");const[rHasta,setRHasta]=useState("");
  const list=items.filter(c=>(f==="Todos"||c.tipo===f)&&(!rDesde||ymd(c.fecha)>=rDesde)&&(!rHasta||ymd(c.fecha)<=rHasta)).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const csv=()=>csvDownload("checklist_reparto",["Fecha","Tipo","Unidad","Placas","Sucursal","Responsable","Km"],list.map(c=>[fdt(c.fecha),c.tipo,c.economico,c.placas,c.sucursal,c.responsable,c.km]));
  return(

function MCForm({tipo,cat,mc,registros,session,sucursalesUser,refrescar,showToast,onDone}){
  const items=tipo==="gas"?ITEMS_GAS:ITEMS_ELEC;
  const yo=cat.users.find(u=>u.mail===session.email)||null;
  const availMC=mc.filter(v=>!sucursalesUser||sucursalesUser.includes(v.sucursal));
  const[eq,setEq]=useState(availMC[0]?String(availMC[0].id):"");
  const[estatus,setEstatus]=useState("Activo");const[dia,setDia]=useState(new Date().toISOString().split("T")[0]);
  const[horas,setHoras]=useState("");
  // Número de semana ISO calculado automáticamente a partir de la fecha de revisión
  const isoSemana=s=>{if(!s)return"";const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+((w1.getDay()+6)%7))/7);};
  const semana=isoSemana(dia);
  const[resps,setResps]=useState({});const[fotos,setFotos]=useState({});const[coments,setComents]=useState({});
  const[obs,setObs]=useState("");const[sig,setSig]=useState(null);const[step,setStep]=useState(0);const[busy,setBusy]=useState(false);
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  const vehicle=cat.vehicles.find(v=>String(v.id)===String(eq));

  const lastHoras=(registros||[]).filter(r=>String(r.vehicleId)===String(eq)).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]?.horas??null;
  const horasN=parseFloat(horas);
  const horasErr=horas!==""&&lastHoras!=null?(horasN<lastHoras?`No puede ser menor al último: ${lastHoras} h`:horasN-lastHoras>100?`No puede exceder 100 h del último (${lastHoras} h)`:null):null;
  const CHUNK=10;const chunks=[];for(let i=0;i<items.length;i+=CHUNK)chunks.push(items.slice(i,i+CHUNK));
  const total=chunks.length+2;const isLast=step===total-1;const curChunk=step>0&&step<total-1?chunks[step-1]:null;const off=(step-1)*CHUNK;
  const setR=(i,v)=>setResps(r=>({...r,[i]:v}));const setF=(i,v)=>setFotos(f=>({...f,[i]:v}));const setC=(i,v)=>setComents(c=>({...c,[i]:v}));
  const probs=Object.entries(resps).filter(([,v])=>v==="P");
  const canSubmit=!!(eq&&sig&&(estatus!=="Activo"||probs.every(([i])=>fotos[i]&&coments[i])));
  const submit=async()=>{
    if(!canSubmit||busy)return;setBusy(true);
    try{
      const datos={tipo,username:yo?.nombre||session.nombre,vehicleId:vehicle?.id,placas:vehicle?.placas,subMarca:vehicle?.subMarca,sucursal:vehicle?.sucursal,economico:vehicle?.economico,estatus,dia,semana,horas:parseFloat(horas)||0,resps,fotos,coments,obs,firma:sig,status:"Aprobado",autorizadoPor:"Envío automático"};
      const subido=await api.subirEvidencias("montacargas",datos);
      await api.crear("montacargas",subido);
      showToast("✓ Checklist enviado");await refrescar();onDone();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  const color=tipo==="gas"?C.amber:C.blue;
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:13,fontWeight:700,color}}>{tipo==="gas"?"⛽ Gas/Gasolina":"⚡ Eléctrico"} — Diario</span><span style={{fontSize:11,color:"#888"}}>Paso {step+1}/{total}</span></div>
      <div className="sb">{Array.from({length:total}).map((_,i)=><div key={i} className="sd" style={{background:step>=i?color:"#e0e0e0"}}/>)}</div>
      {step===0&&<div>
        <div className="card"><div className="ct">Información General</div>
          <label>Montacargas</label><select value={eq} onChange={e=>setEq(e.target.value)}><option value="">— Selecciona —</option>{availMC.map(v=><option key={v.id} value={v.id}>#{v.economico} · {v.placas} · {v.subMarca}</option>)}</select>
          {vehicle&&<div style={{marginTop:6,fontSize:12}}><div className="dr"><span>Sucursal</span><span>{vehicle.sucursal}</span></div><div className="dr"><span>Tipo</span><span>{vehicle.combustible}</span></div></div>}
          <label>Estatus del equipo</label><select value={estatus} onChange={e=>setEstatus(e.target.value)}>{ESTATUS_MC.map(o=><option key={o}>{o}</option>)}</select>
          <label>Fecha de revisión</label><input type="date" value={dia} onChange={e=>setDia(e.target.value)}/>
          <div className="r2"><div><label>Semana No. (automática)</label><input type="text" value={semana?"Semana "+semana:""} disabled style={{background:"#f5f5f5",color:"#666"}}/></div><div><label>Horas de trabajo</label><input type="number" value={horas} onChange={e=>setHoras(e.target.value)} placeholder="Ej. 1250"/></div></div>
          {lastHoras!=null&&<div style={{fontSize:11,color:"#888",marginTop:3}}>Último registro: {lastHoras} h</div>}
          {horasErr&&<div className="eb">{horasErr}</div>}

        </div>
        {estatus!=="Activo"&&<div className="wb">⚠️ Equipo inactivo — solo se registran datos generales y firma.</div>}
        <button className="bp" disabled={!eq||!dia||!!horasErr} onClick={()=>setStep(1)} style={{background:color}}>Siguiente →</button>
      </div>}
      {curChunk&&estatus==="Activo"&&<div>
        <div className="card"><div className="ct">Chequeo Visual — #{off+1} al #{off+curChunk.length}</div>
          {curChunk.map((item,idx)=>{const i=off+idx;const r=resps[i];return(

                <div className="pb">{!fotos[i]&&<><div style={{fontSize:18}}>📷</div><div style={{fontSize:11,marginTop:2}}>Foto del problema</div></>}{fotos[i]&&<img src={fotos[i]} alt="p"/>}<input type="file" accept="image/*" capture="environment" onChange={e=>readFile(e,d=>setF(i,d))}/></div>

      </div>}
      {curChunk&&estatus!=="Activo"&&<div><div style={{textAlign:"center",padding:"20px 0",color:"#888",fontSize:13}}>Equipo inactivo — chequeo omitido.</div><div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(s=>s-1)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0,background:color}} onClick={()=>setStep(total-1)}>Ir a firma →</button></div></div>}
      {isLast&&<div>

      </div>}
    </div>
  );

          {repFiltrado.length===0?<div className="empty">Sin cargas en el rango/estado</div>:
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{textAlign:"left",color:"#888"}}><th style={{padding:"4px 0"}}>#Unidad</th><th>Monto</th><th>Estado</th><th style={{textAlign:"right"}}>Fecha</th></tr></thead>
            <tbody>{repFiltrado.map(s=><tr key={s.id} style={{borderTop:".5px solid #f0f0f0"}}><td style={{padding:"5px 0",fontWeight:600}}>#{s.economico}</td><td style={{color:C.blue,fontWeight:600}}>${(s.monto||0).toLocaleString()}</td><td><span className={"bdg "+bcSol(s.status)} style={{fontSize:10}}>{s.status}</span></td><td style={{textAlign:"right",color:"#888"}}>{new Date(s.fecha).toLocaleDateString("es-MX")}</td></tr>)}</tbody>
          </table>}
        </div>}
      </>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
