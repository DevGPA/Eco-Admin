function useSig(ref){
  const drawing=useRef(false);
  const start=e=>{drawing.current=true;const c=ref.current;const ctx=c.getContext("2d");const r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo((e.touches?.[0]||e).clientX-r.left,(e.touches?.[0]||e).clientY-r.top);};
  const move=e=>{if(!drawing.current)return;const c=ref.current;const ctx=c.getContext("2d");const r=c.getBoundingClientRect();ctx.lineTo((e.touches?.[0]||e).clientX-r.left,(e.touches?.[0]||e).clientY-r.top);ctx.strokeStyle=C.blue;ctx.lineWidth=2;ctx.stroke();};
  const end=()=>{drawing.current=false;};
  const clear=cb=>{ref.current?.getContext("2d").clearRect(0,0,400,150);cb&&cb(null);};
  return{start,move,end,clear};
}
// Lee la foto y la comprime a calidad ESTÁNDAR (máx 1280px lado mayor, JPEG ~60%)
// para reducir el uso de datos al subir. No-imágenes o errores: usa el original.
const IMG_MAX=1280, IMG_Q=0.6;
const readFile=(e,cb)=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    const src=ev.target.result;
    if(!/^image\//.test(f.type||"")){cb(src);return;}
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>=h&&w>IMG_MAX){h=Math.round(h*IMG_MAX/w);w=IMG_MAX;}
      else if(h>w&&h>IMG_MAX){w=Math.round(w*IMG_MAX/h);h=IMG_MAX;}
      try{const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",IMG_Q));}
      catch{cb(src);}
    };
    img.onerror=()=>cb(src);
    img.src=src;
  };
  r.readAsDataURL(f);
};

// Genera un PDF con diseño corporativo (encabezado GPA + el formato lleno).
// Toma el contenido del detalle (.pdf-area), quita botones (.no-print) y convierte
// las imágenes de S3 a dataURL para evitar problemas de CORS al renderizar.
async function descargarPDFCorp(){
  const area=document.querySelector(".pdf-area");
  if(!area||typeof html2pdf==="undefined"){window.print();return;}
  const titulo=area.dataset.pdftitle||"Formato GPA";
  const clone=area.cloneNode(true);
  clone.querySelectorAll(".no-print").forEach(n=>n.remove());
  await Promise.all([...clone.querySelectorAll("img")].map(async img=>{
    try{const r=await fetch(img.src);const b=await r.blob();img.src=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b);});}catch(e){}
  }));
  const head=document.createElement("div");
  head.innerHTML='<div style="display:flex;align-items:center;gap:12px;border-bottom:3px solid '+C.blue+';padding-bottom:10px;margin-bottom:14px">'
    +'<div style="width:46px;height:46px;background:'+C.blue+';color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px">GPA</div>'
    +'<div style="flex:1"><div style="font-size:15px;font-weight:800;color:'+C.blue+'">General de Productos para el Agua</div>'
    +'<div style="font-size:12px;color:#555">'+titulo+'</div></div>'
    +'<div style="font-size:10px;color:#888;text-align:right">'+new Date().toLocaleString("es-MX")+'</div></div>';
  const wrap=document.createElement("div");
  wrap.style.cssText="width:190mm;padding:4mm;background:#fff;font-family:-apple-system,Segoe UI,sans-serif;color:#222;position:fixed;left:-10000px;top:0";
  wrap.appendChild(head);wrap.appendChild(clone);
  document.body.appendChild(wrap);
  const fname=titulo.replace(/[^a-zA-Z0-9]+/g,"_")+"_"+new Date().toISOString().slice(0,10)+".pdf";
  try{await html2pdf().set({margin:[8,8,8,8],filename:fname,image:{type:"jpeg",quality:0.92},html2canvas:{scale:2,useCORS:true,backgroundColor:"#fff"},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"]}}).from(wrap).save();}
  finally{wrap.remove();}
}

// ─── LOGIN ──────────────────────────────────────────────────────────
function Login({onLogin,onSetNewPassword}){
  const[u,setU]=useState("");const[p,setP]=useState("");const[err,setErr]=useState("");const[busy,setBusy]=useState(false);
  const[needNew,setNeedNew]=useState(false);const[np,setNp]=useState("");const[np2,setNp2]=useState("");
  const[fp,setFp]=useState(0);const[code,setCode]=useState("");const[msg,setMsg]=useState(""); // fp: 0 login · 1 pedir código · 2 confirmar
  const go=async()=>{
    setErr("");setBusy(true);
    try{ const r=await onLogin(u.trim(),p);
      if(r&&r.challenge==="NEW_PASSWORD_REQUIRED")setNeedNew(true);
      else if(r&&r.challenge==="PASSWORD_RESET_REQUIRED"){setErr("");setFp(1);setMsg("Tu administrador restableció tu contraseña. Pulsa \"Enviar código\" para recibir un código por correo y crear una nueva.");}
    }
    catch(e){ setErr(e.message||"No se pudo iniciar sesión"); }
    setBusy(false);
  };
  const setNew=async()=>{
    setErr("");
    if(np.length<8)return setErr("La contraseña debe tener al menos 8 caracteres");
    if(np!==np2)return setErr("Las contraseñas no coinciden");
    setBusy(true);
    try{ await onSetNewPassword(np); }
    catch(e){ setErr(e.message||"No se pudo establecer la contraseña"); }
    setBusy(false);
  };
  const pedirCodigo=async()=>{
    setErr("");setMsg("");
    if(!u||!u.includes("@"))return setErr("Escribe tu correo primero");
    setBusy(true);
    try{ await api.forgotPassword(u.trim()); setFp(2); setMsg("Te enviamos un código a tu correo. Revísalo (y la carpeta de spam)."); }
    catch(e){ setErr(e.message||"No se pudo enviar el código"); }
    setBusy(false);
  };
  const confirmar=async()=>{
    setErr("");
    if(!code.trim())return setErr("Escribe el código que recibiste");
    if(np.length<8)return setErr("La contraseña debe tener al menos 8 caracteres");
    if(np!==np2)return setErr("Las contraseñas no coinciden");
    setBusy(true);
    try{ await api.confirmForgotPassword(u.trim(),code,np); setFp(0);setMsg("Contraseña actualizada. Ya puedes iniciar sesión.");setCode("");setNp("");setNp2("");setP(""); }
    catch(e){ setErr(e.message||"No se pudo cambiar la contraseña"); }
    setBusy(false);
  };
  const volverLogin=()=>{setFp(0);setErr("");setMsg("");setCode("");setNp("");setNp2("");};
  return(
    <div className="lw">
      <style>{GCS}</style>
      <div className="logo" style={{width:64,height:64,fontSize:20,marginBottom:16}}>GPA</div>
      <div style={{fontSize:17,fontWeight:700,color:"#222",marginBottom:4,textAlign:"center"}}>General de Productos para el Agua</div>
      <div style={{fontSize:13,color:"#888",marginBottom:24}}>Sistema de Control de Unidades</div>
      <div style={{width:"100%",maxWidth:340}}>
        <div className="card">
          {needNew ? <>
            <div style={{fontSize:14,fontWeight:700,color:"#222",marginBottom:6}}>Establece tu nueva contraseña</div>
            <div style={{fontSize:11,color:"#888",marginBottom:12}}>Es tu primer ingreso. Define una contraseña (mín. 8 caracteres, con minúsculas y números).</div>
            <label>Nueva contraseña</label><input type="password" value={np} onChange={e=>setNp(e.target.value)} placeholder="••••••"/>
            <label>Confirmar contraseña</label><input type="password" value={np2} onChange={e=>setNp2(e.target.value)} placeholder="••••••" onKeyDown={e=>e.key==="Enter"&&setNew()}/>
            {err&&<div className="eb" style={{marginTop:8}}>{err}</div>}
            <button className="bp" onClick={setNew} disabled={busy||!np||!np2} style={{marginTop:14}}>{busy?"Guardando…":"Guardar y entrar"}</button>
          </> : fp===1 ? <>
            <div style={{fontSize:14,fontWeight:700,color:"#222",marginBottom:6}}>Recuperar contraseña</div>
            <div style={{fontSize:11,color:"#888",marginBottom:12}}>Escribe tu correo y te enviaremos un código para restablecerla.</div>
            <label>Correo</label><input type="text" value={u} onChange={e=>setU(e.target.value)} placeholder="usuario@gpa.com.mx" autoCapitalize="off" onKeyDown={e=>e.key==="Enter"&&pedirCodigo()}/>
            {msg&&<div style={{background:C.greenLt,color:C.green,borderRadius:6,padding:"7px 10px",fontSize:12,marginTop:8}}>{msg}</div>}
            {err&&<div className="eb" style={{marginTop:8}}>{err}</div>}
            <button className="bp" onClick={pedirCodigo} disabled={busy||!u} style={{marginTop:14}}>{busy?"Enviando…":"Enviar código"}</button>
            <div style={{textAlign:"center",marginTop:10}}><a onClick={volverLogin} style={{fontSize:12,color:C.blue,cursor:"pointer"}}>← Volver</a></div>
          </> : fp===2 ? <>
            <div style={{fontSize:14,fontWeight:700,color:"#222",marginBottom:6}}>Restablecer contraseña</div>
            <div style={{fontSize:11,color:"#888",marginBottom:12}}>Escribe el código que llegó a {u} y tu nueva contraseña.</div>
            <label>Código de verificación</label><input type="text" value={code} onChange={e=>setCode(e.target.value)} placeholder="123456" inputMode="numeric"/>
            <label>Nueva contraseña</label><input type="password" value={np} onChange={e=>setNp(e.target.value)} placeholder="••••••"/>
            <label>Confirmar contraseña</label><input type="password" value={np2} onChange={e=>setNp2(e.target.value)} placeholder="••••••" onKeyDown={e=>e.key==="Enter"&&confirmar()}/>
            {err&&<div className="eb" style={{marginTop:8}}>{err}</div>}
            <button className="bp" onClick={confirmar} disabled={busy||!code||!np||!np2} style={{marginTop:14}}>{busy?"Guardando…":"Cambiar contraseña"}</button>
            <div style={{textAlign:"center",marginTop:10}}><a onClick={()=>setFp(1)} style={{fontSize:12,color:C.blue,cursor:"pointer"}}>Reenviar código</a> · <a onClick={volverLogin} style={{fontSize:12,color:C.blue,cursor:"pointer"}}>Volver</a></div>
          </> : <>
            <label>Correo</label><input type="text" value={u} onChange={e=>setU(e.target.value)} placeholder="usuario@gpa.com.mx" autoCapitalize="off"/>
            <label>Contraseña</label><input type="password" value={p} onChange={e=>setP(e.target.value)} placeholder="••••••" onKeyDown={e=>e.key==="Enter"&&go()}/>
            {err&&<div className="eb" style={{marginTop:8}}>{err}</div>}
            {msg&&<div style={{background:C.greenLt,color:C.green,borderRadius:6,padding:"7px 10px",fontSize:12,marginTop:8}}>{msg}</div>}
            <button className="bp" onClick={go} disabled={busy||!u||!p} style={{marginTop:14}}>{busy?"Entrando…":"Iniciar sesión"}</button>
            <div style={{textAlign:"center",marginTop:10}}><a onClick={()=>{setErr("");setMsg("");setFp(1);}} style={{fontSize:12,color:C.blue,cursor:"pointer"}}>¿Olvidaste tu contraseña?</a></div>
          </>}
        </div>
        <div style={{fontSize:11,color:"#aaa",textAlign:"center",marginTop:8}}>Credenciales asignadas por administrador</div>
      </div>
    </div>
  );
}

// ─── APP PRINCIPAL ──────────────────────────────────────────────────
function App(){
  const[session,setSession]=useState(api.isAuth?api.session:null);
  const[cat,setCat]=useState(null);
  const[data,setData]=useState({combustible:[],checklist:[],montacargas:[]});
  const[loading,setLoading]=useState(false);
  const[module,setModule]=useState("combustible");
  const[toast,setToast]=useState(null);
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(null),3000);};

  const cargarTodo=async()=>{
    setLoading(true);
    try{
      const[c,sol,cl,mc]=await Promise.all([api.catalogos(),api.listar("combustible"),api.listar("checklist"),api.listar("montacargas")]);
      setCat(c);setData({combustible:sol,checklist:cl,montacargas:mc});
    }catch(e){showToast("⚠️ "+e.message);}
    setLoading(false);
  };
  useEffect(()=>{if(session)cargarTodo();},[session]);

  const refrescar=async tipo=>{try{const items=await api.listar(tipo);setData(d=>({...d,[tipo]:items}));}catch(e){showToast("⚠️ "+e.message);}};
  const refrescarCat=async()=>{try{setCat(await api.catalogos());}catch(e){showToast("⚠️ "+e.message);}};
  const login=async(email,pass)=>{const r=await api.login(email,pass);if(r&&r.challenge)return r;setSession(api.session);};
  const setNewPassword=async(np)=>{await api.completeNewPassword(np);setSession(api.session);};
  const logout=()=>{api.logout();setSession(null);setCat(null);};

  if(!session)return<Login onLogin={login} onSetNewPassword={setNewPassword}/>;
  const rol=session.rol;
  const sucursalesUser=(session.sucursales&&session.sucursales.length)?session.sucursales:null; // null = todas
  const userMods=(session.modulos&&session.modulos.length)?session.modulos:null;                 // null = todos

  const opModules=[
    {id:"combustible",label:"Combustible",icon:"M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"},
    {id:"checklist",label:"Reparto",icon:"M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"},
    {id:"montacargas",label:"Montacargas",icon:"M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"},
  ].filter(mo=>!userMods||userMods.includes(mo.id));
  const modules=[
    ...opModules,
    ...(rol==="admin"?[{id:"admin",label:"Admin",icon:"M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z"}]:[]),
  ];
  const mod=modules.find(x=>x.id===module)?module:(modules[0]&&modules[0].id);

  return(
    <div className="wrap">
      <style>{GCS}</style>
      {toast&&<div className="toast">{toast}</div>}
      <div className="hdr">
        <div className="hdr-l">
          <div className="logo">GPA</div>
          <div>
            <div style={{fontSize:13,fontWeight:700}}>GPA Control Unidades</div>
            <div style={{fontSize:10,opacity:.75}}>{session.nombre} · <span className={"bdg "+rolBadge(rol)} style={{fontSize:9,padding:"1px 6px"}}>{rolLabel(rol)}</span></div>
          </div>
        </div>
        <button onClick={logout} style={{background:"rgba(255,255,255,.15)",border:"none",color:"#fff",borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer"}}>Salir</button>
      </div>
      <div className="pg">
        {!cat&&loading&&<div className="spin"/>}
        {cat&&<>
          {mod==="combustible"&&<ModCombustible cat={cat} items={data.combustible} rol={rol} sucursalesUser={sucursalesUser} session={session} refrescar={()=>refrescar("combustible")} showToast={showToast}/>}
          {mod==="checklist"&&<ModChecklist cat={cat} items={data.checklist} rol={rol} sucursalesUser={sucursalesUser} session={session} refrescar={()=>refrescar("checklist")} showToast={showToast}/>}
          {mod==="montacargas"&&<ModMontacargas cat={cat} items={data.montacargas} rol={rol} sucursalesUser={sucursalesUser} session={session} refrescar={()=>refrescar("montacargas")} showToast={showToast}/>}
          {mod==="admin"&&rol==="admin"&&<ModAdmin cat={cat} refrescarCat={refrescarCat} showToast={showToast}/>}
        </>}
      </div>
      <nav className="nav">
        {modules.map(m=>(
          <button key={m.id} className={mod===m.id?"act":""} onClick={()=>setModule(m.id)}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d={m.icon}/></svg>
            {m.label}
          </button>
        ))}
      </nav>
    </div>
  );
}

// ─── MÓDULO COMBUSTIBLE ──────────────────────────────────────────────
function ModCombustible({cat,items,rol,sucursalesUser,session,refrescar,showToast}){
  const[view,setView]=useState(rol==="analista"?"history":"form");
  const[sel,setSel]=useState(null);
  return(
    <div>
      {rol!=="analista"&&<div className="tr">
        {["form","history"].map(v=><button key={v} className={"trb"+(view===v?" act":"")} onClick={()=>{setView(v);setSel(null);}}>{v==="form"?"Nueva Solicitud":"Historial"}</button>)}
      </div>}
      {view==="form"&&rol!=="analista"&&<SolForm cat={cat} items={items} session={session} rol={rol} sucursalesUser={sucursalesUser} refrescar={refrescar} showToast={showToast} onDone={()=>setView("history")}/>}
      {view==="history"&&!sel&&<SolHistory items={items} rol={rol} onSelect={s=>{setSel(s);setView("detail");}}/>}
      {view==="detail"&&sel&&<SolDetail sol={sel} rol={rol} refrescar={refrescar} showToast={showToast} onBack={()=>{setView("history");setSel(null);}}/>}
    </div>
  );
}

function SolForm({cat,items,session,rol,sucursalesUser,refrescar,showToast,onDone}){
  const yo=cat.users.find(u=>u.mail===session.email)||null;
  // Combustible: Gasolina, Diésel y Gas LP cargan combustible; solo se excluyen los eléctricos.
  const availVeh=cat.vehicles.filter(v=>v.activo&&v.combustible!=="Electrico"&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(v.sucursal)));
  const availUsr=cat.users.filter(u=>u.activo&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(u.sucursal)));
  const[veh,setVeh]=useState(availVeh[0]?String(availVeh[0].id):"");
  const[usr,setUsr]=useState(yo?String(yo.id):availUsr[0]?String(availUsr[0].id):"");
  const[km,setKm]=useState("");const[tank,setTank]=useState(0.25);const[obs,setObs]=useState("");
  const[photo,setPhoto]=useState(null);const[sig,setSig]=useState(null);const[step,setStep]=useState(1);const[busy,setBusy]=useState(false);
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  const vehicle=cat.vehicles.find(v=>String(v.id)===String(veh));
  const user=cat.users.find(u=>String(u.id)===String(usr));
  const need=Math.max(0,1-tank);const litros=vehicle?Math.round(vehicle.tanque*need):0;const monto=vehicle?Math.round(litros*vehicle.precio):0;
  const lastKm=items.filter(s=>String(s.vehicleId)===String(veh)).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]?.km??null;
  const kmN=parseFloat(km);const kmErr=km&&lastKm!=null?(kmN<lastKm?`No puede ser menor al último: ${lastKm.toLocaleString()} km`:kmN-lastKm>1000?`No puede exceder 1,000 km del último (${lastKm.toLocaleString()} km)`:null):null;
  const submit=async()=>{
    if(!vehicle||!user||busy)return;
    setBusy(true);
    try{
      const datos={vehicleId:vehicle.id,placas:vehicle.placas,subMarca:vehicle.subMarca,sucursal:vehicle.sucursal,economico:vehicle.economico,combustible:vehicle.combustible,producto:vehicle.producto,precio:vehicle.precio,tanque:vehicle.tanque,userId:user.id,responsable:user.nombre,mail:user.mail,km:kmN,tankBefore:tank,tankAfter:1,necesidad:need,litros,monto,obs,photo,firma:sig,status:"Pendiente"};
      const subido=await api.subirEvidencias("combustible",datos);
      await api.crear("combustible",subido);
      showToast("✓ Solicitud enviada");
      await refrescar();
      onDone();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  return(
    <div>
      <div className="sb">{[1,2,3].map(s=><div key={s} className="sd" style={{background:step>=s?C.blue:"#e0e0e0"}}/>)}</div>
      {step===1&&<>
        <div className="card">
          <div className="ct">Vehículo</div>
          <select value={veh} onChange={e=>setVeh(e.target.value)}><option value="">— Selecciona —</option>{availVeh.map(v=><option key={v.id} value={v.id}>#{v.economico} · {v.placas} · {v.subMarca}</option>)}</select>
          {vehicle&&<div style={{marginTop:8,fontSize:12}}><div className="dr"><span>Sucursal</span><span>{vehicle.sucursal}</span></div><div className="dr"><span>Combustible</span><span>{vehicle.combustible}</span></div><div className="dr"><span>Precio/L</span><span>${vehicle.precio.toFixed(2)}</span></div><div className="dr"><span>Tanque</span><span>{vehicle.tanque}L</span></div></div>}
        </div>
        <div className="card">
          <div className="ct">Solicitante</div>
          <label>Responsable</label>
          <select value={usr} onChange={e=>setUsr(e.target.value)}><option value="">— Selecciona —</option>{availUsr.map(u=><option key={u.id} value={u.id}>{u.nombre}</option>)}</select>
          <label>Kilometraje actual</label>
          <input type="number" placeholder="Ej. 91127" value={km} onChange={e=>setKm(e.target.value)}/>
          {lastKm!=null&&<div style={{fontSize:11,color:"#888",marginTop:3}}>Último registro: {lastKm.toLocaleString()} km</div>}
          {kmErr&&<div className="eb">{kmErr}</div>}
        </div>
        <div className="card">
          <div className="ct">Nivel de Tanque</div>
          <label>Nivel actual</label>
          <div className="tg">{TANK_OPTS.map(o=><button key={o.val} className={"tb"+(tank===o.val?" sel":"")} onClick={()=>setTank(o.val)}>{o.label}</button>)}</div>
          {vehicle&&<div className="cb"><div className="cr"><span>Litros estimados</span><span>{litros} L</span></div><div className="cr" style={{borderTop:`1px solid ${C.blueMd}`,marginTop:6,paddingTop:6,fontSize:15}}><span>Monto estimado</span><span>${monto.toLocaleString()}</span></div></div>}
        </div>
        <label>Observaciones</label>
        <textarea rows={2} style={{marginBottom:10}} value={obs} onChange={e=>setObs(e.target.value)} placeholder="Notas adicionales..."/>
        <button className="bp" disabled={!veh||!usr||!km||!!kmErr} onClick={()=>setStep(2)}>Siguiente →</button>
      </>}
      {step===2&&<>
        <div className="card">
          <div className="ct">Foto de Evidencia</div>
          <p style={{fontSize:12,color:"#888",marginBottom:8}}>Captura el kilometraje y nivel del tanque en la misma foto.</p>
          <div className="pb">{!photo&&<><div style={{fontSize:22}}>📷</div><div style={{marginTop:3}}>Toca para capturar</div></>}{photo&&<img src={photo} alt="ev"/>}<input type="file" accept="image/*" capture="environment" onChange={e=>readFile(e,setPhoto)}/></div>
          {photo&&<button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>setPhoto(null)}>Cambiar foto</button>}
        </div>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(1)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0}} disabled={!photo} onClick={()=>setStep(3)}>Siguiente →</button></div>
      </>}
      {step===3&&<>
        <div className="card">
          <div className="ct">Firma del Solicitante</div>
          <canvas ref={sigRef} className="sig" width={340} height={130} onMouseDown={sigH.start} onMouseMove={sigH.move} onMouseUp={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}} onTouchStart={sigH.start} onTouchMove={sigH.move} onTouchEnd={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}}/>
          <button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>sigH.clear(setSig)}>Limpiar</button>
          {user&&<div style={{marginTop:8,fontSize:12,textAlign:"center"}}><b>{user.nombre}</b><br/><span style={{fontSize:11,color:"#888"}}>Notif: {cat.config?.emailLogistica||"logística"}</span></div>}
        </div>
        <div className="card"><div className="ct">Resumen</div><div className="dr"><span>Vehículo</span><span>{vehicle?.placas}</span></div><div className="dr"><span>Litros</span><span>{litros} L</span></div><div className="dr"><span>Monto</span><span style={{color:C.blue,fontWeight:700}}>${monto.toLocaleString()}</span></div></div>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(2)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0}} disabled={!sig||busy} onClick={submit}>{busy?"Enviando…":"Enviar"}</button></div>
      </>}
    </div>
  );
}

function SolHistory({items,rol,onSelect}){
  const[f,setF]=useState("Todos");
  const list=items.filter(s=>f==="Todos"||s.status===f).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  return(
    <div>
      <div className="tr">{["Todos","Pendiente","Aprobada","Rechazada"].map(x=><button key={x} className={"trb"+(f===x?" act":"")} onClick={()=>setF(x)}>{x}</button>)}</div>
      {list.length===0&&<div className="empty">No hay solicitudes</div>}
      <div className="card">{list.map(s=><div key={s.id} className="li" onClick={()=>onSelect(s)}><div className="lit"><span className="lim">{s.placas} · #{s.economico}</span><span className={"bdg "+bcSol(s.status)}>{s.status}</span></div><div className="lis">{s.responsable} · {s.sucursal}</div><div className="lis">{fdate(s.fecha)} · {s.litros}L · <span style={{color:C.blue,fontWeight:600}}>${s.monto?.toLocaleString()}</span></div></div>)}</div>
    </div>
  );
}

function SolDetail({sol,rol,refrescar,showToast,onBack}){
  const canChange=rol==="admin"||rol==="analista"||rol==="supervisor";
  const[busy,setBusy]=useState(false);
  const change=async st=>{setBusy(true);try{await api.cambiarEstado("combustible",sol.id,st);showToast("Estado actualizado");await refrescar();onBack();}catch(e){showToast("⚠️ "+e.message);}setBusy(false);};
  return(
    <div className="pdf-area" data-pdftitle="Solicitud de combustible">
      <div className="no-print" style={{display:"flex",gap:8,marginBottom:12}}><button className="bs" onClick={onBack}>← Volver</button><button className="bs" onClick={descargarPDFCorp}>⬇ Descargar PDF</button></div>
      <div className="card"><div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><div className="ct" style={{marginBottom:0}}>Solicitud</div><span className={"bdg "+bcSol(sol.status)}>{sol.status}</span></div><div className="dr"><span>Fecha</span><span>{fdt(sol.fecha)}</span></div><div className="dr"><span>Placas</span><span>{sol.placas}</span></div><div className="dr"><span>Sucursal</span><span>{sol.sucursal}</span></div><div className="dr"><span>Responsable</span><span>{sol.responsable}</span></div><div className="dr"><span>Kilometraje</span><span>{sol.km?.toLocaleString()} km</span></div><div className="dr"><span>Nivel antes</span><span>{TANK_OPTS.find(t=>t.val===sol.tankBefore)?.label}</span></div><div className="dr"><span>Litros</span><span>{sol.litros} L</span></div><div className="dr"><span>Monto</span><span style={{color:C.blue,fontWeight:700}}>${sol.monto?.toLocaleString()}</span></div>{sol.obs&&<div className="dr"><span>Obs.</span><span>{sol.obs}</span></div>}</div>
      {sol.photo&&<div className="card"><div className="ct">Foto Evidencia</div><img src={sol.photo} style={{width:"100%",borderRadius:8}} alt="ev"/></div>}
      {sol.firma&&<div className="card"><div className="ct">Firma</div><img src={sol.firma} style={{width:"100%",borderRadius:8,background:"#f9f9f9"}} alt="firma"/></div>}
      {canChange&&<div className="card no-print"><div className="ct">Cambiar Estado</div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{["Pendiente","Aprobada","Rechazada"].map(st=><button key={st} disabled={busy} style={{flex:1,padding:8,borderRadius:6,border:`1px solid ${st==="Aprobada"?C.green:st==="Rechazada"?C.red:"#ccc"}`,background:sol.status===st?(st==="Aprobada"?C.greenLt:st==="Rechazada"?C.redLt:"#f5f5f5"):"#fff",color:st==="Aprobada"?C.green:st==="Rechazada"?C.red:"#555",cursor:"pointer",fontSize:12,fontWeight:600}} onClick={()=>change(st)}>{st}</button>)}</div></div>}
    </div>
  );
}

// ─── MÓDULO CHECKLIST REPARTO ────────────────────────────────────────
const SEMANAL_SEC=[

function ModChecklist({cat,items,rol,sucursalesUser,session,refrescar,showToast}){
  const[view,setView]=useState("home");const[tipo,setTipo]=useState(null);const[sel,setSel]=useState(null);
  const canCreate=rol!=="analista";
  if(view==="new")return<CLForm tipo={tipo} cat={cat} items={items} session={session} rol={rol} sucursalesUser={sucursalesUser} refrescar={refrescar} showToast={showToast} onDone={()=>setView("history")}/>;
  if(view==="detail"&&sel)return<CLDetail cl={sel} onBack={()=>{setView("history");setSel(null);}}/>;
  if(view==="history")return<div><button className="bs" style={{marginBottom:12}} onClick={()=>setView("home")}>← Inicio</button><CLHistory items={items} onSelect={c=>{setSel(c);setView("detail");}}/></div>;
  return(
    <div>
      <div style={{fontSize:15,fontWeight:700,color:"#222",marginBottom:16}}>Checklist Unidades de Reparto</div>
      {canCreate&&<>
        <div className="card" style={{cursor:"pointer",borderLeft:`4px solid ${C.blue}`}} onClick={()=>{setTipo("semanal");setView("new");}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontWeight:700,fontSize:14,color:C.blue}}>📋 Checklist Semanal</div><div style={{fontSize:12,color:"#888",marginTop:3}}>Revisión básica semanal</div></div><div style={{fontSize:22,color:C.blue}}>→</div></div>
        </div>
        <div className="card" style={{cursor:"pointer",borderLeft:`4px solid ${C.green}`}} onClick={()=>{setTipo("mensual");setView("new");}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontWeight:700,fontSize:14,color:C.green}}>📋 Checklist Mensual</div><div style={{fontSize:12,color:"#888",marginTop:3}}>Revisión completa mensual</div></div><div style={{fontSize:22,color:C.green}}>→</div></div>
        </div>
      </>}
      <div className="card" style={{cursor:"pointer"}} onClick={()=>setView("history")}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontWeight:700,fontSize:14}}>🗂 Historial</div><div style={{fontSize:12,color:"#888",marginTop:3}}>{items.length} registro(s)</div></div><div style={{fontSize:22,color:"#888"}}>→</div></div></div>
    </div>
  );
}

function CLForm({tipo,cat,items,session,rol,sucursalesUser,refrescar,showToast,onDone}){
  const sections=tipo==="semanal"?SEMANAL_SEC:MENSUAL_SEC;
  const yo=cat.users.find(u=>u.mail===session.email)||null;
  const availVeh=cat.vehicles.filter(v=>v.activo&&v.combustible!=="Gas LP"&&v.combustible!=="Electrico"&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(v.sucursal)));
  const availUsr=cat.users.filter(u=>u.activo&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(u.sucursal)));
  const[veh,setVeh]=useState(availVeh[0]?String(availVeh[0].id):"");
  const[usr,setUsr]=useState(yo?String(yo.id):availUsr[0]?String(availUsr[0].id):"");
  const[km,setKm]=useState("");const[fotoKm,setFotoKm]=useState(null);const[ans,setAns]=useState({});const[sig,setSig]=useState(null);const[obs,setObs]=useState("");const[step,setStep]=useState(0);const[busy,setBusy]=useState(false);
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  const vehicle=cat.vehicles.find(v=>String(v.id)===String(veh));const user=cat.users.find(u=>String(u.id)===String(usr));
  const total=sections.length+2;const isLast=step===total-1;const curSec=step>0&&step<total-1?sections[step-1]:null;
  const setA=(id,v)=>setAns(a=>({...a,[id]:v}));const getA=id=>ans[id];
  const visible=item=>{if(!item.cond)return true;const[cid,cv]=item.cond.split(":");return String(getA(cid))===cv;};
  const submit=async()=>{
    if(!vehicle||!user||!km||!fotoKm||!sig||busy)return;
    setBusy(true);
    try{
      const datos={tipo,vehicleId:vehicle.id,placas:vehicle.placas,subMarca:vehicle.subMarca,sucursal:vehicle.sucursal,economico:vehicle.economico,userId:user.id,responsable:user.nombre,km:parseFloat(km),fotoKm,answers:ans,obs,firma:sig};
      const subido=await api.subirEvidencias("checklist",datos);
      await api.crear("checklist",subido);
      showToast("✓ Checklist enviado");await refrescar();onDone();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:13,fontWeight:700,color:tipo==="semanal"?C.blue:C.green}}>{tipo==="semanal"?"Checklist Semanal":"Checklist Mensual"}</span><span style={{fontSize:11,color:"#888"}}>Paso {step+1}/{total}</span></div>
      <div className="sb">{Array.from({length:total}).map((_,i)=><div key={i} className="sd" style={{background:step>=i?(tipo==="semanal"?C.blue:C.green):"#e0e0e0"}}/>)}</div>
      {step===0&&<div>
        <div className="card"><div className="ct">Datos Generales</div>
          <label>Vehículo</label><select value={veh} onChange={e=>setVeh(e.target.value)}><option value="">— Selecciona —</option>{availVeh.map(v=><option key={v.id} value={v.id}>#{v.economico} · {v.placas}</option>)}</select>
          <label>Responsable que verifica</label><select value={usr} onChange={e=>setUsr(e.target.value)}><option value="">— Selecciona —</option>{availUsr.map(u=><option key={u.id} value={u.id}>{u.nombre}</option>)}</select>
          <label>Kilometraje del día</label><input type="number" value={km} onChange={e=>setKm(e.target.value)} placeholder="Ej. 97710"/>
          <label>Foto del kilometraje</label>
          <div className="pb">{!fotoKm&&<><div style={{fontSize:22}}>📷</div><div style={{marginTop:3}}>Toca para capturar</div></>}{fotoKm&&<img src={fotoKm} alt="km"/>}<input type="file" accept="image/*" capture="environment" onChange={e=>readFile(e,setFotoKm)}/></div>
          {fotoKm&&<button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>setFotoKm(null)}>Cambiar foto</button>}
        </div>
        <button className="bp" disabled={!veh||!usr||!km||!fotoKm} onClick={()=>setStep(1)} style={{background:tipo==="semanal"?C.blue:C.green}}>Siguiente →</button>
      </div>}
      {curSec&&<div>
        <div className="card"><div className="ct">{curSec.title}</div>
          {curSec.items.map(item=>{
            if(!visible(item))return null;const v=getA(item.id);
            return(
              <div key={item.id} style={{marginBottom:10}}>
                <label>{item.label}</label>
                {item.type==="select"&&<select value={v||""} onChange={e=>setA(item.id,e.target.value)}><option value="">— Selecciona —</option>{item.opts.map(o=><option key={o}>{o}</option>)}</select>}
                {item.type==="text"&&<input type="text" value={v||""} onChange={e=>setA(item.id,e.target.value)}/>}
                {item.type==="number"&&<input type="number" value={v||""} onChange={e=>setA(item.id,e.target.value)}/>}
                {item.type==="date"&&<input type="date" value={v||""} onChange={e=>setA(item.id,e.target.value)}/>}
                {item.type==="taco"&&<div className="tcg">{TACO_OPTS.map(n=><button key={n} className={"tcb"+(v===n?" sel":"")} onClick={()=>setA(item.id,n)}>{n}</button>)}</div>}
                {item.type==="photo"&&<div><div className="pb">{!v&&<><div style={{fontSize:20}}>📷</div><div style={{fontSize:11,marginTop:2}}>Toca para capturar</div></>}{v&&<img src={v} alt={item.label}/>}<input type="file" accept="image/*" capture="environment" onChange={e=>readFile(e,d=>setA(item.id,d))}/></div>{v&&<button className="bs" style={{marginTop:4,width:"100%",fontSize:11}} onClick={()=>setA(item.id,null)}>Cambiar</button>}</div>}
                {item.type==="damage_list"&&<DmgList value={v||[]} onChange={w=>setA(item.id,w)}/>}
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(s=>s-1)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0,background:tipo==="semanal"?C.blue:C.green}} onClick={()=>setStep(s=>s+1)}>Siguiente →</button></div>
      </div>}
      {isLast&&<div>
        <div className="card"><div className="ct">Observaciones</div><textarea rows={3} value={obs} onChange={e=>setObs(e.target.value)} placeholder="Reportes o comentarios (solo si aplica)"/></div>
        <div className="card"><div className="ct">Firma de quien verifica</div>
          <canvas ref={sigRef} className="sig" width={340} height={120} onMouseDown={sigH.start} onMouseMove={sigH.move} onMouseUp={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}} onTouchStart={sigH.start} onTouchMove={sigH.move} onTouchEnd={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}}/>
          <button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>sigH.clear(setSig)}>Limpiar</button>
          {user&&<div style={{marginTop:8,fontSize:12,textAlign:"center"}}><b>{user.nombre}</b><br/><span style={{fontSize:11,color:"#888"}}>Notif: {cat.config?.emailRiesgos||"riesgos"}</span></div>}
        </div>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(s=>s-1)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0,background:tipo==="semanal"?C.blue:C.green}} disabled={!sig||busy} onClick={submit}>{busy?"Enviando…":"Enviar checklist"}</button></div>
      </div>}
    </div>
  );
}

function DmgList({value,onChange}){
  const add=()=>onChange([...value,{foto:null,desc:""}]);
  const upd=(i,f,v)=>{const n=[...value];n[i]={...n[i],[f]:v};onChange(n);};
  const del=i=>onChange(value.filter((_,j)=>j!==i));
  return(
    <div>
      {value.map((d,i)=>(
        <div key={i} style={{background:"#fafafa",borderRadius:8,border:".5px solid #eee",padding:10,marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:12,fontWeight:600}}>Daño #{i+1}</span><button className="bd" style={{padding:"4px 10px",fontSize:11}} onClick={()=>del(i)}>Eliminar</button></div>
          <div className="pb" style={{marginBottom:6}}>{!d.foto&&<><div style={{fontSize:18}}>📷</div><div style={{fontSize:11}}>Foto del daño</div></>}{d.foto&&<img src={d.foto} alt="daño"/>}<input type="file" accept="image/*" capture="environment" onChange={e=>readFile(e,r=>upd(i,"foto",r))}/></div>
          {d.foto&&<button className="bs" style={{width:"100%",fontSize:11,marginBottom:6}} onClick={()=>upd(i,"foto",null)}>Cambiar foto</button>}
          <label>Descripción</label><input type="text" value={d.desc} onChange={e=>upd(i,"desc",e.target.value)} placeholder="Ej. Golpe puerta piloto"/>
        </div>
      ))}
      <button className="bs" style={{width:"100%",marginTop:4}} onClick={add}>+ Agregar daño</button>
    </div>
  );
}

function CLHistory({items,onSelect}){
  const[f,setF]=useState("Todos");
  const list=items.filter(c=>f==="Todos"||c.tipo===f).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  return(
    <div>
      <div className="tr">{["Todos","semanal","mensual"].map(x=><button key={x} className={"trb"+(f===x?" act":"")} onClick={()=>setF(x)}>{x==="Todos"?"Todos":x==="semanal"?"Semanal":"Mensual"}</button>)}</div>
      {list.length===0&&<div className="empty">No hay checklists</div>}
      <div className="card">{list.map(c=><div key={c.id} className="li" onClick={()=>onSelect(c)}><div className="lit"><span className="lim">{c.placas} · #{c.economico}</span><span className={"bdg "+(c.tipo==="semanal"?"dpe":"dok")}>{c.tipo==="semanal"?"Semanal":"Mensual"}</span></div><div className="lis">{c.responsable} · {c.sucursal}</div><div className="lis">{fdt(c.fecha)}</div></div>)}</div>
    </div>
  );
}

function CLDetail({cl,onBack}){
  const secs=cl.tipo==="semanal"?SEMANAL_SEC:MENSUAL_SEC;
  return(
    <div className="pdf-area" data-pdftitle="Checklist de reparto">
      <div className="no-print" style={{display:"flex",gap:8,marginBottom:12}}><button className="bs" onClick={onBack}>← Volver</button><button className="bs" onClick={descargarPDFCorp}>⬇ Descargar PDF</button></div>
      <div className="card"><div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><div className="ct" style={{marginBottom:0}}>{cl.tipo==="semanal"?"Semanal":"Mensual"}</div><span className={"bdg "+(cl.tipo==="semanal"?"dpe":"dok")}>{cl.tipo==="semanal"?"Semanal":"Mensual"}</span></div><div className="dr"><span>Fecha</span><span>{fdt(cl.fecha)}</span></div><div className="dr"><span>Vehículo</span><span>{cl.placas} · {cl.subMarca}</span></div><div className="dr"><span>Sucursal</span><span>{cl.sucursal}</span></div><div className="dr"><span>Responsable</span><span>{cl.responsable}</span></div><div className="dr"><span>Km</span><span>{cl.km?.toLocaleString()}</span></div></div>

function ModAdmin({cat,refrescarCat,showToast}){

  const[accounts,setAccounts]=useState(null);

  const blankV={id:"",economico:"",placas:"",subMarca:"",sucursal:cat.sucursales[0]||"",tanque:60,responsable:"",combustible:"Gasolina",producto:"",precio:26.63,activo:true,_isNew:true};

  useEffect(()=>{if(sec==="cuentas"&&accounts===null)cargarCuentas();},[sec]);
  // ── Reporte de cargas de combustible ──
  const[reporte,setReporte]=useState(null);
  const[rModo,setRModo]=useState("dia");const[rDia,setRDia]=useState("");const[rDesde,setRDesde]=useState("");const[rHasta,setRHasta]=useState("");const[rEstado,setREstado]=useState("Todos");
  const cargarReporte=async()=>{try{setReporte(await api.listar("combustible"));}catch(e){showToast("⚠️ "+e.message);}};
  useEffect(()=>{if(sec==="reportes"&&reporte===null)cargarReporte();},[sec]);
  const fechaLocal=f=>{const d=new Date(f);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};  /* fecha local, no UTC, para coincidir con lo mostrado */
  const repSufijo=rModo==="dia"?(rDia||"dia"):((rDesde||"inicio")+"_a_"+(rHasta||"hoy"));
  const repFiltrado=(reporte||[]).filter(s=>{const d=s.fecha?fechaLocal(s.fecha):"";const okFecha=rModo==="dia"?(!rDia||d===rDia):((!rDesde||d>=rDesde)&&(!rHasta||d<=rHasta));return okFecha&&(rEstado==="Todos"||s.status===rEstado);}).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const repMonto=repFiltrado.reduce((a,s)=>a+(s.monto||0),0);
  const repLitros=repFiltrado.reduce((a,s)=>a+(s.litros||0),0);
  const descargarReporteCSV=()=>{
    const cols=["Fecha","Unidad","Placas","Sucursal","Responsable","Combustible","Litros","Monto","Estado"];
    const esc=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    const filas=repFiltrado.map(s=>[new Date(s.fecha).toLocaleString("es-MX"),s.economico,s.placas,s.sucursal,s.responsable,s.combustible,s.litros,s.monto,s.status]);
    const total=["","","","","","","TOTAL "+repLitros.toFixed(2)+" L","TOTAL $"+repMonto.toFixed(2),""];
    const csv=[cols.join(","),...filas.map(r=>r.map(esc).join(",")),total.map(esc).join(",")].join("\r\n");
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});  /* BOM para Excel */
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download="reporte_cargas_"+repSufijo+".csv";
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);

          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{textAlign:"left",color:"#888"}}><th style={{padding:"4px 0"}}>#Unidad</th><th style={{textAlign:"center"}}>Cargas</th><th style={{textAlign:"right"}}>Monto</th></tr></thead>
            <tbody>{repPorUnidad.map(u=><tr key={u.economico} style={{borderTop:".5px solid #f0f0f0"}}><td style={{padding:"5px 0",fontWeight:600}}>#{u.economico}</td><td style={{textAlign:"center",color:"#888"}}>{u.cargas}</td><td style={{textAlign:"right",color:C.blue,fontWeight:700}}>${u.monto.toLocaleString()}</td></tr>)}</tbody>
            <tfoot><tr style={{borderTop:`1px solid ${C.blueMd}`}}><td style={{padding:"5px 0",fontWeight:700}}>TOTAL</td><td style={{textAlign:"center",fontWeight:700}}>{repFiltrado.length}</td><td style={{textAlign:"right",fontWeight:700,color:C.blue}}>${repMonto.toLocaleString()}</td></tr></tfoot>
          </table>
        </div>}
        {reporte!==null&&<div className="card"><div className="ct">Detalle de cargas ({repFiltrado.length})</div>
          {repFiltrado.length===0?<div className="empty">Sin cargas en el rango/estado</div>:
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{textAlign:"left",color:"#888"}}><th style={{padding:"4px 0"}}>#Unidad</th><th>Monto</th><th>Estado</th><th style={{textAlign:"right"}}>Fecha</th></tr></thead>
            <tbody>{repFiltrado.map(s=><tr key={s.id} style={{borderTop:".5px solid #f0f0f0"}}><td style={{padding:"5px 0",fontWeight:600}}>#{s.economico}</td><td style={{color:C.blue,fontWeight:600}}>${(s.monto||0).toLocaleString()}</td><td><span className={"bdg "+bcSol(s.status)} style={{fontSize:10}}>{s.status}</span></td><td style={{textAlign:"right",color:"#888"}}>{new Date(s.fecha).toLocaleDateString("es-MX")}</td></tr>)}</tbody>
          </table>}
        </div>}
      </>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
