const fdt=s=>{try{return new Date(s).toLocaleString("es-MX")}catch{return s}};

function useSig(ref){
  const drawing=useRef(false);
  const start=e=>{drawing.current=true;const c=ref.current;const ctx=c.getContext("2d");const r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo((e.touches?.[0]||e).clientX-r.left,(e.touches?.[0]||e).clientY-r.top);};
  const move=e=>{if(!drawing.current)return;const c=ref.current;const ctx=c.getContext("2d");const r=c.getBoundingClientRect();ctx.lineTo((e.touches?.[0]||e).clientX-r.left,(e.touches?.[0]||e).clientY-r.top);ctx.strokeStyle=C.blue;ctx.lineWidth=2;ctx.stroke();};
  const end=()=>{drawing.current=false;};
  const clear=cb=>{ref.current?.getContext("2d").clearRect(0,0,400,150);cb&&cb(null);};
  return{start,move,end,clear};
}
// Lee la foto y la comprime a calidad ESTÁNDAR (máx 1280px lado mayor, JPEG ~60%)
// para reducir el uso de datos al subir. No-imágenes o errores: usa el original.
const IMG_MAX=1280, IMG_Q=0.6;
const readFile=(e,cb)=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    const src=ev.target.result;
    if(!/^image\//.test(f.type||"")){cb(src);return;}
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>=h&&w>IMG_MAX){h=Math.round(h*IMG_MAX/w);w=IMG_MAX;}
      else if(h>w&&h>IMG_MAX){w=Math.round(w*IMG_MAX/h);h=IMG_MAX;}
      try{const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);cb(c.toDataURL("image/jpeg",IMG_Q));}
      catch{cb(src);}
    };
    img.onerror=()=>cb(src);
    img.src=src;
  };
  r.readAsDataURL(f);
};

// Genera un PDF con diseño corporativo (encabezado GPA + el formato lleno).
// Toma el contenido del detalle (.pdf-area), quita botones (.no-print) y convierte
// las imágenes de S3 a dataURL para evitar problemas de CORS al renderizar.
// Convierte una URL (S3/local) a dataURL; null si falla.
async function _aDataURL(url){
  try{const r=await fetch(url);const b=await r.blob();return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b);});}
  catch(e){return null;}
}
// Logo cacheado (para no re-descargarlo en exportaciones masivas)
let _logoCache;
async function _logoData(){ if(_logoCache===undefined)_logoCache=await _aDataURL("logo.png"); return _logoCache; }

// Construye el PDF corporativo a partir de un elemento .pdf-area y DEVUELVE el doc
// jsPDF (sin guardarlo). Reutilizable para descarga individual y masiva (ZIP).
// NO usa html2canvas → funciona en iPhone/Android/PC.
async function pdfDeArea(area){
  if(!area)return null;
  const JS=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
  if(!JS)return null;
  const titulo=area.dataset.pdftitle||"Formato GPA";
  const suc=area.dataset.pdfsucursal||"";
  const domicilio=DOMICILIOS[suc]||"";
  const clone=area.cloneNode(true);
  clone.querySelectorAll(".no-print").forEach(n=>n.remove());
  // Imágenes → dataURL (las que no se puedan, se omiten)
  for(const img of [...clone.querySelectorAll("img")]){const s=img.getAttribute("src");const d=(s&&s.indexOf("data:")===0)?s:await _aDataURL(s);if(d)img.setAttribute("src",d);else img.remove();}
  const logoData=await _logoData();

  const doc=new JS({unit:"mm",format:"a4"});
  const PW=210,PH=297,M=12,CW=PW-2*M;let y=M;
  const ensure=h=>{if(y+h>PH-M){doc.addPage();y=M;}};
  const heading=t=>{t=(t||"").trim();if(!t)return;y+=2;ensure(8);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(24,95,165);doc.text(t,M,y);y+=2;doc.setDrawColor(225);doc.setLineWidth(0.2);doc.line(M,y,PW-M,y);y+=4;};
  const para=(t,o)=>{t=(t||"").trim();if(!t)return;o=o||{};const sz=o.size||10;doc.setFont("helvetica",o.bold?"bold":"normal");doc.setFontSize(sz);doc.setTextColor.apply(doc,o.color||[40,40,40]);const ls=doc.splitTextToSize(t,CW);for(const ln of ls){ensure(sz*0.5+1);doc.text(ln,M,y);y+=sz*0.42+1.8;}};
  const kv=(l,v)=>{l=(l||"").trim();v=(v==null?"":String(v)).trim();if(!l&&!v)return;doc.setFontSize(10);const L=doc.splitTextToSize(l,CW*0.44),R=doc.splitTextToSize(v,CW*0.52);const rows=Math.max(L.length,R.length);ensure(rows*4.6+1);doc.setFont("helvetica","normal");doc.setTextColor(120);doc.text(L,M,y);doc.setTextColor(40);doc.text(R,M+CW*0.46,y);y+=rows*4.6+1.5;};
  const addImg=d=>{try{const p=doc.getImageProperties(d);const s=Math.min((CW*0.62)/p.width,58/p.height);const w=p.width*s,h=p.height*s;ensure(h+3);doc.addImage(d,(p.fileType==="PNG"?"PNG":"JPEG"),M,y,w,h);y+=h+3;}catch(e){}};

  // Encabezado corporativo
  if(logoData){try{const lp=doc.getImageProperties(logoData);const lh=15,lw=Math.min(lp.width*(lh/lp.height),22);doc.addImage(logoData,"PNG",M,y,lw,lh);}catch(e){}}
  doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(24,95,165);doc.text("General de Productos para el Agua",M+24,y+5);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.setTextColor(80);doc.text(titulo+(suc?" — "+suc:""),M+24,y+10);
  let hb=18;
  if(domicilio){doc.setFontSize(7.5);doc.setTextColor(120);const dl=doc.splitTextToSize(domicilio,CW-26);doc.text(dl,M+24,y+14);hb=14+dl.length*3;}
  doc.setFontSize(8);doc.setTextColor(150);doc.text(new Date().toLocaleString("es-MX"),PW-M,y+4,{align:"right"});
  y+=hb;doc.setDrawColor(24,95,165);doc.setLineWidth(0.6);doc.line(M,y,PW-M,y);y+=5;

  // Chequeo de montacargas: ~30 puntos en DOS columnas (texto + resultado) para ahorrar hojas
  const compactChequeo=card=>{
    const ct=card.querySelector(".ct");heading(ct?ct.textContent:"Chequeo visual completo");
    const rows=[...card.children].filter(c=>c.tagName==="DIV"&&!(c.classList&&c.classList.contains("ct")));
    const items=rows.map(r=>{const sp=r.querySelectorAll("span");return {txt:(sp[0]?sp[0].textContent:"").trim(),res:(sp.length?sp[sp.length-1].textContent:"").trim()};});
    const half=Math.ceil(items.length/2),colW=CW/2-1,lh=3.3;
    const colColor=res=>res==="O"?[46,107,17]:res==="P"?[163,45,45]:[120,120,120];
    // Líneas envueltas del texto de un ítem (pregunta completa, sin recortar)
    const lineas=it=>it?doc.splitTextToSize(it.txt,colW-9):[];
    // Dibuja una celda (resultado + pregunta multilínea) a partir de y0; no mueve y
    const cell=(it,x,y0)=>{if(!it)return;doc.setFont("helvetica","bold");doc.setFontSize(7.5);doc.setTextColor.apply(doc,colColor(it.res));doc.text((it.res||"").substring(0,3),x,y0);doc.setFont("helvetica","normal");doc.setTextColor(70);doc.text(lineas(it),x+8,y0);};
    doc.setFontSize(7.5);
    for(let i=0;i<half;i++){
      const L=items[i],R=items[i+half];
      const filas=Math.max(lineas(L).length,lineas(R).length,1);
      const alto=filas*lh+1.8;
      ensure(alto);
      cell(L,M,y);cell(R,M+CW/2+1,y);
      y+=alto;
    }
    y+=2;
  };
  // Recorrido del detalle
  const INL=["SPAN","B","A","STRONG","EM","SMALL","I"];
  const walk=node=>{
    for(const el of node.children){
      const tag=el.tagName;
      if(el.classList&&el.classList.contains("card")){const ct0=el.querySelector(".ct");if(ct0&&/chequeo visual/i.test(ct0.textContent)){compactChequeo(el);continue;}}
      if(tag==="IMG"){const s=el.getAttribute("src");if(s&&s.indexOf("data:")===0)addImg(s);continue;}
      if(tag==="BR")continue;
      if(el.classList&&el.classList.contains("ct")){heading(el.textContent);continue;}
      if(el.classList&&el.classList.contains("dr")){const sp=el.querySelectorAll("span");kv(sp[0]&&sp[0].textContent,sp[sp.length-1]&&sp[sp.length-1].textContent);continue;}
      const kids=[...el.children];
      if(kids.length>=2&&kids.every(c=>INL.includes(c.tagName))){const sp=kids;kv(sp[0].textContent,sp.slice(1).map(s=>s.textContent).join(" "));continue;}
      if(kids.length===0){para(el.textContent);continue;}
      walk(el);
    }
  };
  walk(clone);
  return doc;
}

// Descarga individual: genera el PDF del detalle en pantalla y lo guarda.
async function descargarPDFCorp(){
  const area=document.querySelector(".pdf-area");

}

// Renderiza un componente de detalle fuera de pantalla, espera a que carguen las
// imágenes y devuelve su elemento .pdf-area (para generar el PDF en lote).
async function _areaDeDetalle(render){
  const host=document.createElement("div");
  host.style.cssText="position:fixed;left:-99999px;top:0;width:430px;background:#fff;z-index:-1";
  document.body.appendChild(host);
  const root=ReactDOM.createRoot(host);
  await new Promise(res=>{root.render(render());setTimeout(res,60);});
  const imgs=[...host.querySelectorAll("img")];
  await Promise.all(imgs.map(im=>im.complete?Promise.resolve():new Promise(r=>{im.onload=im.onerror=r;setTimeout(r,4000);})));
  const area=host.querySelector(".pdf-area");
  return {area,cleanup:()=>{try{root.unmount();}catch(e){}host.remove();}};
}

// Exporta TODOS los registros (de una plantilla dinámica) como un ZIP de PDFs,
// uno por registro. onProg(i,total) para mostrar avance.
async function zipPdfsFormularios(plantilla,registros,onProg){
  const JSZip=window.JSZip;
  if(!JSZip){alert("No cargó la librería de ZIP. Reintenta en unos segundos.");return;}
  const zip=new JSZip();const usados={};let ok=0;
  for(let i=0;i<registros.length;i++){
    const reg=registros[i];onProg&&onProg(i+1,registros.length);
    try{
      const {area,cleanup}=await _areaDeDetalle(()=>React.createElement(FormDinamicoDetail,{reg,plantilla,onBack:()=>{},onEstado:()=>{}}));
      const doc=await pdfDeArea(area);cleanup();
      if(!doc)continue;
      let base=((plantilla&&plantilla.clave)||"reg")+"_"+ymd(reg.fecha)+"_"+(reg.sucursal||"").replace(/[^a-zA-Z0-9]+/g,"")+"_"+(reg.id||i);
      base=base.replace(/[^a-zA-Z0-9_\-]+/g,"_");
      if(usados[base])base+="_"+(++usados[base]);else usados[base]=1;
      zip.file(base+".pdf",doc.output("arraybuffer"));ok++;
    }catch(e){/* salta el registro problemático */}
  }
  if(!ok){alert("No se pudo generar ningún PDF.");return;}
  const blob=await zip.generateAsync({type:"blob"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download="PDFs_"+((plantilla&&plantilla.clave)||"formularios")+"_"+new Date().toISOString().slice(0,10)+".zip";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}

// ─── LOGIN ──────────────────────────────────────────────────────────
function Login({onLogin,onSetNewPassword}){
  const[u,setU]=useState("");const[p,setP]=useState("");const[err,setErr]=useState("");const[busy,setBusy]=useState(false);
  const[needNew,setNeedNew]=useState(false);const[np,setNp]=useState("");const[np2,setNp2]=useState("");

  const go=async()=>{
    setErr("");setBusy(true);
    try{ const r=await onLogin(u.trim(),p);
      if(r&&r.challenge==="NEW_PASSWORD_REQUIRED")setNeedNew(true);
      else if(r&&r.challenge==="PASSWORD_RESET_REQUIRED"){setErr("");setFp(1);setMsg("Tu administrador restableció tu contraseña. Pulsa \"Enviar código\" para recibir un código por correo y crear una nueva.");}
    }
    catch(e){ setErr(e.message||"No se pudo iniciar sesión"); }
    setBusy(false);
  };
  const setNew=async()=>{
    setErr("");
    if(np.length<8)return setErr("La contraseña debe tener al menos 8 caracteres");
    if(np!==np2)return setErr("Las contraseñas no coinciden");
    setBusy(true);
    try{ await onSetNewPassword(np); }
    catch(e){ setErr(e.message||"No se pudo establecer la contraseña"); }
    setBusy(false);
  };
  const pedirCodigo=async()=>{
    setErr("");setMsg("");
    if(!u||!u.includes("@"))return setErr("Escribe tu correo primero");
    setBusy(true);
    try{ await api.forgotPassword(u.trim()); setFp(2); setMsg("Te enviamos un código a tu correo. Revísalo (y la carpeta de spam)."); }
    catch(e){ setErr(e.message||"No se pudo enviar el código"); }
    setBusy(false);
  };
  const confirmar=async()=>{
    setErr("");
    if(!code.trim())return setErr("Escribe el código que recibiste");
    if(np.length<8)return setErr("La contraseña debe tener al menos 8 caracteres");
    if(np!==np2)return setErr("Las contraseñas no coinciden");
    setBusy(true);
    try{ await api.confirmForgotPassword(u.trim(),code,np); setFp(0);setMsg("Contraseña actualizada. Ya puedes iniciar sesión.");setCode("");setNp("");setNp2("");setP(""); }
    catch(e){ setErr(e.message||"No se pudo cambiar la contraseña"); }
    setBusy(false);

  const volverLogin=()=>{setFp(0);setErr("");setMsg("");setCode("");setNp("");setNp2("");};
  return(

      <div style={{fontSize:13,color:"#888",marginBottom:24}}>Sistema de Gestión</div>
      <div style={{width:"100%",maxWidth:340}}>
        <div className="card">
          {needNew ? <>
            <div style={{fontSize:14,fontWeight:700,color:"#222",marginBottom:6}}>Establece tu nueva contraseña</div>
            <div style={{fontSize:11,color:"#888",marginBottom:12}}>Es tu primer ingreso. Define una contraseña (mín. 8 caracteres, con minúsculas y números).</div>
            <label>Nueva contraseña</label><input type="password" value={np} onChange={e=>setNp(e.target.value)} placeholder="••••••"/>
            <label>Confirmar contraseña</label><input type="password" value={np2} onChange={e=>setNp2(e.target.value)} placeholder="••••••" onKeyDown={e=>e.key==="Enter"&&setNew()}/>
            {err&&<div className="eb" style={{marginTop:8}}>{err}</div>}
            <button className="bp" onClick={setNew} disabled={busy||!np||!np2} style={{marginTop:14}}>{busy?"Guardando…":"Guardar y entrar"}</button>
          </> : fp===1 ? <>
            <div style={{fontSize:14,fontWeight:700,color:"#222",marginBottom:6}}>Recuperar contraseña</div>

          </> : <>
            <label>Correo</label><input type="text" value={u} onChange={e=>setU(e.target.value)} placeholder="usuario@gpa.com.mx" autoCapitalize="off"/>

            <div style={{textAlign:"center",marginTop:10}}><a onClick={()=>{setErr("");setMsg("");setFp(1);}} style={{fontSize:12,color:C.blue,cursor:"pointer"}}>¿Olvidaste tu contraseña?</a></div>
          </>}
        </div>
        <div style={{fontSize:11,color:"#aaa",textAlign:"center",marginTop:8}}>Credenciales asignadas por administrador</div>
      </div>
    </div>
  );
}

// ─── APP PRINCIPAL ──────────────────────────────────────────────────
function App(){
  const[session,setSession]=useState(api.isAuth?api.session:null);
  const[cat,setCat]=useState(null);
  const[data,setData]=useState({combustible:[],checklist:[],montacargas:[]});
  const[loading,setLoading]=useState(false);
  const[module,setModule]=useState("combustible");
  const[toast,setToast]=useState(null);
  const[alerta,setAlerta]=useState(null);const[alertaOff,setAlertaOff]=useState(false);const alertaFormRef=useRef(null);
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(null),3000);};

  const cargarTodo=async()=>{
    setLoading(true);
    try{
      // Los catálogos son esenciales; cárgalos primero.
      const c=await api.catalogos();
      setCat(c);
      // Los historiales de cada módulo se cargan por separado: si la cuenta no
      // tiene acceso a alguno (403), NO debe tumbar toda la app (queda vacío).
      const[sol,cl,mc]=await Promise.all([
        api.listar("combustible").catch(()=>[]),
        api.listar("checklist").catch(()=>[]),
        api.listar("montacargas").catch(()=>[]),
      ]);
      setData({combustible:sol,checklist:cl,montacargas:mc});
    }catch(e){showToast("⚠️ "+e.message);}
    setLoading(false);
  };
  useEffect(()=>{if(session)cargarTodo();},[session]);

  const refrescar=async tipo=>{try{const items=await api.listar(tipo);setData(d=>({...d,[tipo]:items}));}catch(e){showToast("⚠️ "+e.message);}};
  const refrescarCat=async()=>{try{setCat(await api.catalogos());}catch(e){showToast("⚠️ "+e.message);}};
  const login=async(email,pass)=>{const r=await api.login(email,pass);if(r&&r.challenge)return r;setAlertaOff(false);alertaFormRef.current=null;setSession(api.session);};
  const setNewPassword=async(np)=>{await api.completeNewPassword(np);setSession(api.session);};
  const logout=()=>{api.logout();setSession(null);setCat(null);setAlerta(null);setAlertaOff(false);alertaFormRef.current=null;};

  // Aviso de cumplimiento al iniciar sesión (solo responsables con visibilidad de
  // sucursal/global: admin, analista, supervisor). Los operadores reciben el aviso
  // por correo en la Fase 2 (SES), pues su acceso a datos es solo el propio.
  useEffect(()=>{
    if(!cat||!session||!["admin","analista","supervisor"].includes(session.rol)){setAlerta(null);return;}
    const resp=(cat.responsables||[]).find(r=>r.email===session.email);
    if(!resp){setAlerta(null);return;}
    const hoy=new Date();
    const sucU=(session.sucursales&&session.sucursales.length)?session.sucursales:null;
    // corporativo = todo su acceso; de sucursal = solo sus sucursales
    const sucScope=sucU||cat.sucursales;
    // Solo módulos a los que la cuenta tiene acceso (evita falsos por 403→vacío)
    const puedeMk=k=>{if(!session.modulos||!session.modulos.length)return true;const map={combustible:["combustible"],reparto:["mtto","checklist"],montacargas:["mtto","montacargas"],sucursales:["mtto","sucursales"],seguridad:["seguridad"]};return (map[k]||[k]).some(n=>session.modulos.includes(n));};
    const formMk=[...new Set((cat.plantillas||[]).map(p=>p.modulo).filter(mk=>mk&&mk!=="responsivas"))];
    const modKeys=["combustible","reparto","montacargas",...formMk].filter(puedeMk);
    // El aviso cuenta lo VENCIDO (fuera de plazo); los pendientes aún en tiempo no alarman.
    const contar=fd=>segModulos({cat,combustible:data.combustible,checklist:data.checklist,montacargas:data.montacargas,formData:fd||{},sucs:sucScope,modKeys,hoy})
      .reduce((n,m)=>n+((m.cargar||!m.resumen)?0:m.resumen.vencido),0);
    setAlerta({nombre:session.nombre,tipo:resp.tipo,n:contar(alertaFormRef.current)});
    if(alertaFormRef.current===null){(async()=>{const fd={};for(const p of (cat.plantillas||[]).filter(x=>x.modulo&&x.modulo!=="responsivas"&&x.activo!==false)){try{fd[p.clave]=await api.listarFormulario(p.clave);}catch(e){fd[p.clave]=[];}}alertaFormRef.current=fd;setAlerta(a=>a?{...a,n:contar(fd)}:a);})();}
  },[cat,session,data]);

  if(!session)return<Login onLogin={login} onSetNewPassword={setNewPassword}/>;
  const rol=session.rol;
  const sucursalesUser=(session.sucursales&&session.sucursales.length)?session.sucursales:null; // null = todas
  const userMods=(session.modulos&&session.modulos.length)?session.modulos:null;                 // null = todos

  // Plantillas activas por clave de módulo (motor de formularios dinámicos)
  const plantillasDe=clave=>(cat?.plantillas||[]).filter(p=>p.modulo===clave&&p.activo!==false);
  const BUILTIN_IDS=["combustible","mtto","seguridad","admin","sucursales","seguimiento"];
  // Módulos dinámicos creados como dato (Admin → Módulos); inertes si no hay ninguno
  const dynMods=(cat?.modulos||[]).filter(mo=>mo.activo!==false&&!BUILTIN_IDS.includes(mo.clave))
    .map(mo=>({id:mo.clave,label:mo.nombre||mo.clave,icon:ICON_DOC,dyn:true}));
  const opModules=[
    {id:"combustible",label:"Combustible",icon:"M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"},
    {id:"mtto",label:"Mtto",icon:"M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437 1.745-1.437"},
    {id:"seguridad",label:"Seguridad",icon:"M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"},
    ...dynMods,
  ].filter(mo=>!userMods||userMods.includes(mo.id)||(mo.id==="mtto"&&(userMods.includes("checklist")||userMods.includes("montacargas"))));
  const modules=[
    ...opModules,
    ...((rol==="admin"||rol==="analista")?[{id:"seguimiento",label:"Seguimiento",icon:CHART_ICON}]:[]),
    ...(rol==="admin"?[{id:"admin",label:"Admin",icon:"M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z"}]:[]),
  ];
  const mod=modules.find(x=>x.id===module)?module:(modules[0]&&modules[0].id);
  const dynActivo=dynMods.find(x=>x.id===mod);

  return(
    <div className="wrap">
      <style>{GCS}</style>
      {toast&&<div className="toast">{toast}</div>}
      <div className="hdr">
        <div className="hdr-l">
          <div className="logo"><img src="logo.png" alt="GPA" style={{width:"100%",height:"100%",objectFit:"contain"}}/></div>
          <div>
            <div style={{fontSize:13,fontWeight:700}}>Sistema de Gestión</div>
            <div style={{fontSize:10,opacity:.75}}>{session.nombre} · <span className={"bdg "+rolBadge(rol)} style={{fontSize:9,padding:"1px 6px"}}>{rolLabel(rol)}</span></div>
          </div>
        </div>
        <button onClick={logout} style={{background:"rgba(255,255,255,.15)",border:"none",color:"#fff",borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer"}}>Salir</button>
      </div>
      <div className="pg">
        {!cat&&loading&&<div className="spin"/>}
        {cat&&alerta&&alerta.n>0&&!alertaOff&&<div className="wb" style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
          <span>⚠️ {alerta.nombre?alerta.nombre.split(" ")[0]+", ":""}tu área tiene <b>{alerta.n}</b> formulario(s) vencido(s) (fuera de plazo).{(rol==="admin"||rol==="analista")?" Revísalos en 📊 Seguimiento.":""}</span>
          <button className="bs" style={{padding:"4px 10px",fontSize:11,whiteSpace:"nowrap"}} onClick={()=>setAlertaOff(true)}>Entendido</button>
        </div>}
        {cat&&<>
          {mod==="combustible"&&<ModCombustible cat={cat} items={data.combustible} rol={rol} sucursalesUser={sucursalesUser} session={session} refrescar={()=>refrescar("combustible")} showToast={showToast}/>}
          {mod==="mtto"&&<ModMtto cat={cat} data={data} rol={rol} sucursalesUser={sucursalesUser} session={session} refrescar={refrescar} showToast={showToast}/>}
          {mod==="seguridad"&&<ModDinamico cat={cat} modulo="seguridad" modLabel="Seguridad Industrial" plantillas={plantillasDe("seguridad")} rol={rol} sucursalesUser={sucursalesUser} session={session} showToast={showToast}/>}
          {dynActivo&&<ModDinamico cat={cat} modulo={dynActivo.id} modLabel={dynActivo.label} plantillas={plantillasDe(dynActivo.id)} rol={rol} sucursalesUser={sucursalesUser} session={session} showToast={showToast}/>}
          {mod==="seguimiento"&&(rol==="admin"||rol==="analista")&&<ModSeguimiento cat={cat} data={data} rol={rol} sucursalesUser={sucursalesUser} userMods={userMods} session={session} refrescar={refrescar} showToast={showToast}/>}
          {mod==="admin"&&rol==="admin"&&<ModAdmin cat={cat} refrescarCat={refrescarCat} showToast={showToast}/>}
        </>}
      </div>
      <nav className="nav">
        {modules.map(m=>(
          <button key={m.id} className={mod===m.id?"act":""} onClick={()=>setModule(m.id)}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d={m.icon}/></svg>
            {m.label}
          </button>
        ))}
      </nav>
    </div>
  );
}

// ─── MÓDULO MTTO (unifica Reparto + Montacargas) ─────────────────────
function ModMtto({cat,data,rol,sucursalesUser,session,refrescar,showToast}){
  const[sub,setSub]=useState("reparto");
  return(
    <div>
      <div style={{fontSize:15,fontWeight:700,color:"#222",marginBottom:10}}>Mantenimiento</div>
      <div className="tr" style={{overflowX:"auto"}}>
        <button className={"trb"+(sub==="reparto"?" act":"")} onClick={()=>setSub("reparto")}>🚚 Reparto</button>
        <button className={"trb"+(sub==="montacargas"?" act":"")} onClick={()=>setSub("montacargas")}>🏗️ Montacargas</button>
        <button className={"trb"+(sub==="sucursales"?" act":"")} onClick={()=>setSub("sucursales")}>🏢 Sucursales</button>
      </div>
      {sub==="reparto"&&<ModChecklist cat={cat} items={data.checklist} rol={rol} sucursalesUser={sucursalesUser} session={session} refrescar={()=>refrescar("checklist")} showToast={showToast}/>}
      {sub==="montacargas"&&<ModMontacargas cat={cat} items={data.montacargas} rol={rol} sucursalesUser={sucursalesUser} session={session} refrescar={()=>refrescar("montacargas")} showToast={showToast}/>}
      {sub==="sucursales"&&<ModDinamico cat={cat} modulo="sucursales" modLabel="Formularios de Sucursales" plantillas={(cat?.plantillas||[]).filter(p=>p.modulo==="sucursales"&&p.activo!==false)} rol={rol} sucursalesUser={sucursalesUser} session={session} showToast={showToast}/>}
    </div>
  );
}

// ═══ MOTOR DE FORMULARIOS DINÁMICOS ══════════════════════════════════
// Renderiza módulos/plantillas creados como DATO (sin desplegar). Reusa los
// tipos de campo de CLForm/MCForm, FotoCampo, useSig, FiltroFechas y el PDF.
const ICON_DOC="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z";
const SINO_OPTS=["Sí","No"];
const TIPOS_CAMPO=["select","si_no","text","textarea","number","date","taco","vehiculo","photo","fotos","damage_list","opna","escala","aviso"];
const SEV_BADGE={ok:"OK",warn:"Atención",bad:"Fuera de servicio"};
const SEV_VAL={ok:2,warn:1,bad:0};
// Evalúa la condición "campo:valor" de un ítem contra las respuestas actuales
const condOK=(item,getA)=>{if(!item.cond)return true;const i=String(item.cond).indexOf(":");if(i<0)return true;const cid=item.cond.slice(0,i),cv=item.cond.slice(i+1);return String(getA(cid)??"")===cv;};

// Un campo del formulario dinámico (mismo vocabulario de tipos que los checklists)
function CampoForm({item,getA,setA,availVeh}){
  const v=getA(item.id);const t=item.type;
  if(t==="aviso"){
    return(<div className="aviso">{item.label&&<div className="aviso-t">{item.label}</div>}<div className="aviso-b">{item.texto||item.opts?.join("\n")||""}</div></div>);
  }
  if(t==="escala"){
    const nota=getA(item.id+"__nota");const foto=getA(item.id+"__foto");const opts=item.opts||[];
    const sel=(v!=null&&v!=="")?opts[v]:null;const esBad=!!(sel&&sel.sev==="bad");
    return(<div className="es-item">
      <div className="es-h">{item.label}{item.req&&<span style={{color:C.red}}> *</span>}</div>
      {opts.map((o,i)=>{const sev=o.sev||"ok";const selo=String(v)===String(i);return(
        <div key={i} className={"es-opt"+(selo?" sel-"+sev:"")} onClick={()=>setA(item.id,i)}>
          <div className="es-rad"><div className="es-dot"/></div>
          <span className="es-txt">{o.t}</span>
          <span className={"es-bdg eb-"+sev}>{SEV_BADGE[sev]}</span>
        </div>);})}
      {esBad&&<div className="prb">
        <div style={{fontSize:11,fontWeight:700,color:C.red,marginBottom:6}}>📷 Evidencia del daño (opcional):</div>
        <div className="pb">{!foto&&<><div style={{fontSize:18}}>📷</div><div style={{fontSize:11,marginTop:2}}>Foto del daño</div></>}{foto&&<img src={foto} alt="evidencia"/>}<input type="file" accept="image/*" capture="environment" onChange={e=>readFile(e,d=>setA(item.id+"__foto",d))}/></div>
        {foto&&<button type="button" className="bs" style={{width:"100%",marginTop:4,fontSize:11}} onClick={()=>setA(item.id+"__foto",null)}>Cambiar foto</button>}
        <input type="text" value={nota||""} placeholder="Describe el daño (opcional)" style={{marginTop:6}} onChange={e=>setA(item.id+"__nota",e.target.value)}/>
      </div>}
      {!esBad&&item.nota&&<div className="es-nota"><input type="text" value={nota||""} placeholder="Nota opcional" onChange={e=>setA(item.id+"__nota",e.target.value)}/></div>}
    </div>);
  }
  if(t==="opna"){
    const foto=getA(item.id+"__foto"),com=getA(item.id+"__com");
    return(<div className="ic">
      <div style={{fontSize:12,color:"#333",marginBottom:8,lineHeight:1.4}}>{item.label}{item.req&&<span style={{color:C.red}}> *</span>}</div>
      <div className="rr">{["O","P","N/A"].map(opt=><button key={opt} type="button" className={`rb${v===opt?" "+(opt==="O"?"O":opt==="P"?"P":"NA"):""}`} onClick={()=>setA(item.id,opt)}>{opt}</button>)}</div>
      {v==="P"&&<div className="prb">
        <div style={{fontSize:11,fontWeight:700,color:C.red,marginBottom:6}}>⚠️ Problema — requerido:</div>
        <div className="pb">{!foto&&<><div style={{fontSize:18}}>📷</div><div style={{fontSize:11,marginTop:2}}>Foto del problema</div></>}{foto&&<img src={foto} alt="p"/>}<input type="file" accept="image/*" capture="environment" onChange={e=>readFile(e,d=>setA(item.id+"__foto",d))}/></div>
        {foto&&<button type="button" className="bs" style={{width:"100%",marginTop:4,fontSize:11}} onClick={()=>setA(item.id+"__foto",null)}>Cambiar foto</button>}
        <label style={{marginTop:8}}>Descripción del problema</label>
        <textarea rows={2} value={com||""} onChange={e=>setA(item.id+"__com",e.target.value)} placeholder="Describe el problema..."/>
      </div>}
    </div>);
  }
  return(<div style={{marginBottom:10}}>
    <label>{item.label}{item.req&&<span style={{color:C.red}}> *</span>}</label>
    {t==="select"&&<select value={v||""} onChange={e=>setA(item.id,e.target.value)}><option value="">— Selecciona —</option>{(item.opts||[]).map(o=><option key={o}>{o}</option>)}</select>}
    {t==="si_no"&&<select value={v||""} onChange={e=>setA(item.id,e.target.value)}><option value="">— Selecciona —</option>{SINO_OPTS.map(o=><option key={o}>{o}</option>)}</select>}
    {t==="text"&&<input type="text" value={v||""} onChange={e=>setA(item.id,e.target.value)}/>}
    {t==="textarea"&&<textarea rows={3} value={v||""} onChange={e=>setA(item.id,e.target.value)}/>}
    {t==="number"&&<input type="number" value={v||""} onChange={e=>setA(item.id,e.target.value)}/>}
    {t==="date"&&<input type="date" value={v||""} onChange={e=>setA(item.id,e.target.value)}/>}
    {t==="taco"&&<div className="tcg">{TACO_OPTS.map(n=><button key={n} type="button" className={"tcb"+(v===n?" sel":"")} onClick={()=>setA(item.id,n)}>{n}</button>)}</div>}
    {t==="vehiculo"&&<select value={v||""} onChange={e=>setA(item.id,e.target.value)}><option value="">— Selecciona —</option>{(availVeh||[]).map(u=><option key={u.id} value={u.id}>#{u.economico} · {u.placas}</option>)}</select>}
    {t==="photo"&&<div><div className="pb">{!v&&<><div style={{fontSize:20}}>📷</div><div style={{fontSize:11,marginTop:2}}>Toca para capturar</div></>}{v&&<img src={v} alt={item.label}/>}<input type="file" accept="image/*" capture="environment" onChange={e=>readFile(e,d=>setA(item.id,d))}/></div>{v&&<button type="button" className="bs" style={{marginTop:4,width:"100%",fontSize:11}} onClick={()=>setA(item.id,null)}>Cambiar</button>}</div>}
    {t==="fotos"&&<div><div className="fg">{(v||[]).map((src,i)=><div key={i} className="ft"><img src={src} alt={"foto "+(i+1)}/><button type="button" className="fx" onClick={()=>setA(item.id,(v||[]).filter((_,j)=>j!==i))}>×</button></div>)}</div><label className="bs" style={{display:"block",textAlign:"center",cursor:"pointer",position:"relative",overflow:"hidden",marginTop:6}}>+ Agregar foto<input type="file" accept="image/*" capture="environment" onChange={e=>readFile(e,d=>setA(item.id,[...(v||[]),d]))} style={{position:"absolute",inset:0,opacity:0,cursor:"pointer"}}/></label></div>}
    {t==="damage_list"&&<DmgList value={v||[]} onChange={w=>setA(item.id,w)}/>}
    {!TIPOS_CAMPO.includes(t)&&<div className="wb" style={{marginTop:4}}>Tipo de campo no soportado aún: «{t}». Se ignorará al guardar.</div>}
  </div>);
}

// Formulario dinámico multipaso (1 sección = 1 paso) construido desde la plantilla
function FormDinamico({plantilla,cat,rol,sucursalesUser,session,onDone,showToast}){
  const yo=cat.users.find(u=>u.mail===session.email)||null;
  const secs=plantilla.secciones||[];
  const availVeh=cat.vehicles.filter(v=>v.activo&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(v.sucursal)));
  const sucOpts=(sucursalesUser&&!["admin","analista"].includes(rol))?sucursalesUser:cat.sucursales;
  const[suc,setSuc]=useState(sucOpts[0]||session.sucursal||"");
  const[ans,setAns]=useState({});const[obs,setObs]=useState("");const[proxServ,setProxServ]=useState("");const[sig,setSig]=useState(null);
  const[step,setStep]=useState(0);const[busy,setBusy]=useState(false);
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  const reqFirma=plantilla.requiereFirma!==false;
  const total=secs.length+2;const isLast=step===total-1;const curSec=step>0&&step<total-1?secs[step-1]:null;
  const setA=(id,v)=>setAns(a=>({...a,[id]:v}));const getA=id=>ans[id];
  // Validación de completitud: toda pregunta visible debe responderse (fotos/notas opcionales)
  const[marcar,setMarcar]=useState(false);
  const REQ=["select","si_no","escala","opna","number","date","taco","vehiculo","text"];
  const vacio=it=>{const v=ans[it.id];return v==null||v==="";};
  const faltaItem=it=>condOK(it,getA)&&REQ.includes(it.type)&&!it.opcional&&vacio(it);
  const faltanSec=its=>(its||[]).filter(faltaItem);
  // Resultado tipo semáforo a partir de los campos «escala» (réplica del checklist)
  const escalaItems=secs.flatMap(s=>(s.items||[]).filter(it=>it.type==="escala"));
  const calcResultado=()=>{
    if(!escalaItems.length)return null;
    let bad=0,warn=0,answered=0,sum=0;
    escalaItems.forEach(it=>{const idx=ans[it.id];if(idx==null||idx==="")return;answered++;const o=(it.opts||[])[idx]||{};const sev=o.sev||"ok";if(sev==="bad")bad++;else if(sev==="warn")warn++;sum+=(o.val!=null?o.val:SEV_VAL[sev]);});
    const completo=answered===escalaItems.length;
    const nivel=!completo?"":bad>0?"fuera":warn>0?"atencion":"optimo";
    const lbl=nivel==="fuera"?"Fuera de servicio":nivel==="atencion"?"Requiere atención":nivel==="optimo"?"Óptimo / operativo":"Completa todos los puntos para ver el resultado";
    return{bad,warn,answered,total:escalaItems.length,sum,max:escalaItems.length*2,completo,nivel,lbl};
  };
  const res=calcResultado();
  const hoy=ymd(new Date());  // fecha local de hoy (para validar próximo servicio)
  const submit=async()=>{
    if(busy)return;
    if(!suc){setStep(0);return showToast("⚠️ Falta la sucursal");}
    for(let i=0;i<secs.length;i++){const f=faltanSec(secs[i].items);if(f.length){setStep(i+1);setMarcar(true);return showToast("⚠️ Faltan "+f.length+" respuesta(s) en «"+secs[i].title+"». Complétalas para enviar.");}}

    if(reqFirma&&!sig)return showToast("⚠️ Falta la firma");

      if(res){datos.resultado=res.lbl;datos.resultadoNivel=res.nivel;datos.puntaje=res.sum;datos.puntajeMax=res.max;}
      const subido=await api.subirEvidencias("formulario",datos);
      await api.crearFormulario(plantilla.clave,subido);
      showToast("✓ Formulario enviado");onDone&&onDone();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:13,fontWeight:700,color:C.blue}}>{plantilla.nombre}</span><span style={{fontSize:11,color:"#888"}}>Paso {step+1}/{total}</span></div>
      <div className="sb">{Array.from({length:total}).map((_,i)=><div key={i} className="sd" style={{background:step>=i?C.blue:"#e0e0e0"}}/>)}</div>
      {step===0&&<div>
        <div className="card"><div className="ct">Datos Generales</div>
          <label>Sucursal</label><select value={suc} onChange={e=>setSuc(e.target.value)}><option value="">— Selecciona —</option>{sucOpts.map(s=><option key={s}>{s}</option>)}</select>
          <label>Responsable</label><input type="text" value={yo?.nombre||session.nombre} disabled style={{background:"#f5f5f5",color:"#888"}}/>
        </div>
        <button className="bp" disabled={!suc} onClick={()=>setStep(1)}>Siguiente →</button>
      </div>}
      {curSec&&<div>
        {marcar&&faltanSec(curSec.items).length>0&&<div className="eb" style={{marginBottom:8}}>⚠️ Faltan {faltanSec(curSec.items).length} pregunta(s) por responder (marcadas en rojo).</div>}
        <div className="card"><div className="ct">{curSec.title}</div>
          {(curSec.items||[]).map(item=>condOK(item,getA)?<div key={item.id} style={marcar&&faltaItem(item)?{outline:"2px solid "+C.red,outlineOffset:2,borderRadius:8}:null}><CampoForm item={item} getA={getA} setA={setA} availVeh={availVeh}/></div>:null)}
        </div>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>{setMarcar(false);setStep(s=>s-1);}}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0}} onClick={()=>{const f=faltanSec(curSec.items);if(f.length){setMarcar(true);return showToast("⚠️ Faltan "+f.length+" pregunta(s) por responder en esta sección");}setMarcar(false);setStep(s=>s+1);}}>Siguiente →</button></div>
      </div>}
      {isLast&&<div>
        {res&&<div className={"score-bar"+(res.nivel?" "+res.nivel:"")}><div className="score-lbl">{res.lbl}</div><div className="score-det">{res.completo?`Puntaje ${res.sum}/${res.max}${res.bad?` · ${res.bad} fuera de servicio`:""}${res.warn?` · ${res.warn} en atención`:""}`:`Faltan ${res.total-res.answered} de ${res.total} puntos`}</div></div>}
        <div className="card"><div className="ct">Fecha de próximo servicio</div><input type="date" min={hoy} value={proxServ} onChange={e=>setProxServ(e.target.value)}/>{proxServ&&proxServ<hoy&&<div className="eb" style={{marginTop:6}}>La fecha no puede ser anterior a hoy.</div>}</div>
        <div className="card"><div className="ct">Observaciones</div><textarea rows={3} value={obs} onChange={e=>setObs(e.target.value)} placeholder="Comentarios (si aplica)"/></div>
        {reqFirma&&<div className="card"><div className="ct">Firma</div>
          <canvas ref={sigRef} className="sig" width={340} height={120} onMouseDown={sigH.start} onMouseMove={sigH.move} onMouseUp={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}} onTouchStart={sigH.start} onTouchMove={sigH.move} onTouchEnd={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}}/>

        </div>}
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(s=>s-1)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0}} disabled={busy||(reqFirma&&!sig)} onClick={submit}>{busy?"Enviando…":"Enviar"}</button></div>
      </div>}
    </div>
  );
}

// Respuesta de un ítem como texto legible (para CSV por registro)
function respuestaTexto(item,reg){
  const a=reg.answers||{};const v=a[item.id];const t=item.type;
  if(t==="escala"){if(v==null||v==="")return "";const o=(item.opts||[])[v]||{};const nota=a[item.id+"__nota"];const foto=a[item.id+"__foto"];return (o.t||"")+(nota?" — "+nota:"")+(foto?" (con foto de evidencia)":"");}
  if(t==="opna"){if(v==null||v==="")return "";const com=a[item.id+"__com"];return v+(com?" — "+com:"");}
  if(t==="fotos")return (v&&v.length)?v.length+" foto(s)":"";
  if(t==="damage_list")return (v&&v.length)?v.length+" daño(s): "+v.map(d=>d.desc||"sin descripción").join("; "):"";
  if(t==="photo")return v?"foto adjunta":"";
  if(t==="taco")return (v!=null&&v!=="")?"Nivel "+v:"";
  return v==null?"":String(v);
}
// Descarga UN registro dinámico como CSV (metadatos + cada campo con su respuesta)
function csvRegistroForm(plantilla,reg){
  const nombre=reg.plantillaNombre||(plantilla&&plantilla.nombre)||reg.plantillaClave||"formulario";
  const filas=[
    ["Datos","Formulario",nombre],
    ["Datos","Código",(plantilla&&plantilla.codigo)||""],
    ["Datos","Fecha",fdt(reg.fecha)],
    ["Datos","Sucursal",reg.sucursal||""],
    ["Datos","Responsable",reg.responsable||reg.solicitante||""],
    ["Datos","Estado",reg.status||""],
  ];
  if(reg.resultado)filas.push(["Datos","Resultado",reg.resultado+(reg.puntaje!=null?" ("+reg.puntaje+"/"+reg.puntajeMax+")":"")]);
  if(reg.autorizadoPor)filas.push(["Datos","Autorizó",reg.autorizadoPor]);
  ((plantilla&&plantilla.secciones)||[]).forEach(sec=>(sec.items||[]).forEach(item=>{
    filas.push([sec.title||"",item.label||item.id,respuestaTexto(item,reg)]);
  }));
  if(reg.proximoServicio)filas.push(["Datos","Fecha de próximo servicio",reg.proximoServicio]);
  if(reg.obs)filas.push(["","Observaciones",reg.obs]);
  const fname=(plantilla&&plantilla.clave||"form")+"_"+(reg.id||"reg")+"_"+ymd(reg.fecha);
  csvDownload(fname,["Sección","Campo","Respuesta"],filas);
}

// CSV de UN registro recorriendo el detalle en pantalla (.pdf-area). Sirve para
// todos los módulos (combustible, reparto, montacargas y formularios dinámicos).
function csvDetalle(){
  const area=document.querySelector(".pdf-area");if(!area)return;
  const titulo=area.dataset.pdftitle||"registro";const suc=area.dataset.pdfsucursal||"";
  const INL=["SPAN","B","A","STRONG","EM","SMALL","I"];let sccn="";const filas=[];
  const walk=node=>{for(const el of node.children){
    if(el.classList&&el.classList.contains("no-print"))continue;
    if(el.classList&&el.classList.contains("ct")){sccn=(el.textContent||"").trim();continue;}
    if(el.classList&&el.classList.contains("dr")){const sp=el.querySelectorAll("span");if(sp.length>=2)filas.push([sccn,(sp[0].textContent||"").trim(),(sp[sp.length-1].textContent||"").trim()]);continue;}
    const kids=[...el.children];
    if(kids.length>=2&&kids.every(c=>INL.includes(c.tagName))){filas.push([sccn,(kids[0].textContent||"").trim(),kids.slice(1).map(s=>(s.textContent||"").trim()).join(" ")]);continue;}
    if(kids.length)walk(el);
  }};
  walk(area);
  filas.unshift(["Datos","Formato",titulo]);if(suc)filas.splice(1,0,["Datos","Sucursal",suc]);
  csvDownload(titulo.replace(/[^a-zA-Z0-9]+/g,"_")+"_"+new Date().toISOString().slice(0,10),["Sección","Campo","Valor"],filas);
}

// Historial de registros de una plantilla (filtro de fecha + CSV)
function FormHistory({plantilla,items,loading,onSelect}){
  const[rDesde,setRDesde]=useState("");const[rHasta,setRHasta]=useState("");const[zip,setZip]=useState(null);
  const list=(items||[]).filter(r=>(!rDesde||ymd(r.fecha)>=rDesde)&&(!rHasta||ymd(r.fecha)<=rHasta)).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  const csv=()=>csvDownload("form_"+plantilla.clave,["Fecha","Sucursal","Responsable","Estado","Resultado","Puntaje","Próximo servicio"],list.map(r=>[fdt(r.fecha),r.sucursal,r.responsable||r.solicitante,r.status,r.resultado||"",r.puntaje!=null?r.puntaje+"/"+r.puntajeMax:"",r.proximoServicio||""]));
  const descargarZip=async()=>{
    if(!list.length||zip)return;
    setZip({i:0,total:list.length});
    try{await zipPdfsFormularios(plantilla,list,(i,total)=>setZip({i,total}));}
    catch(e){alert("No se pudo generar el ZIP: "+e.message);}
    setZip(null);
  };
  if(loading)return<div className="spin"/>;
  return(
    <div>
      <FiltroFechas desde={rDesde} hasta={rHasta} setDesde={setRDesde} setHasta={setRHasta} onCSV={csv} n={list.length}/>
      {list.length>0&&<button className="bs" style={{width:"100%",marginBottom:10}} disabled={!!zip} onClick={descargarZip}>{zip?`Generando PDFs… ${zip.i}/${zip.total}`:`⬇ Todos en PDF (ZIP) · ${list.length}`}</button>}
      {list.length===0&&<div className="empty">No hay registros</div>}
      <div className="card">{list.map(r=><div key={r.id} className="li" onClick={()=>onSelect(r)}><div className="lit"><span className="lim">{r.sucursal||"—"}</span><span className={"bdg "+bcMC(r.status)}>{r.status}</span></div><div className="lis">{r.responsable||r.solicitante||"—"}{r.resultado?<span className={"bdg eb-"+(r.resultadoNivel==="fuera"?"bad":r.resultadoNivel==="atencion"?"warn":"ok")} style={{marginLeft:6}}>{r.resultado}</span>:null}</div><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span className="lis">{fdt(r.fecha)}</span><button className="bs" style={{fontSize:11,padding:"3px 9px"}} onClick={e=>{e.stopPropagation();csvRegistroForm(plantilla,r);}}>⬇ CSV</button></div></div>)}</div>
    </div>
  );
}

    </div>
  );
}

function SolForm({cat,items,session,rol,sucursalesUser,refrescar,showToast,onDone}){

  const[km,setKm]=useState(D.km||"");const[tank,setTank]=useState(D.tank||0.25);const[obs,setObs]=useState(D.obs||"");

      {step===1&&<>

      </>}

          <div className="ct">Firma del Solicitante</div>

          <button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>sigH.clear(setSig)}>Limpiar</button>

function SolHistory({items,rol,onSelect}){

  const csv=()=>csvDownload("solicitudes_combustible",["Fecha","Tipo","Unidad","Placas","Sucursal","Responsable","Combustible","Litros","Precio/L","Monto","Estado","Ubicacion"],list.map(s=>[fdt(s.fecha),s.formato==="reporte"?"Reporte":"Solicitud",s.economico,s.placas,s.sucursal,s.responsable,s.combustible,s.litros,s.precioLitro||s.precio,s.monto,s.status,s.ubicacion?.direccion||""]));

      </>}
      {canChange&&<div className="card no-print"><div className="ct">Cambiar Estado</div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{["Pendiente","Aprobada","Rechazada"].map(st=><button key={st} disabled={busy} style={{flex:1,padding:8,borderRadius:6,border:`1px solid ${st==="Aprobada"?C.green:st==="Rechazada"?C.red:"#ccc"}`,background:sol.status===st?(st==="Aprobada"?C.greenLt:st==="Rechazada"?C.redLt:"#f5f5f5"):"#fff",color:st==="Aprobada"?C.green:st==="Rechazada"?C.red:"#555",cursor:"pointer",fontSize:12,fontWeight:600}} onClick={()=>change(st)}>{st}</button>)}</div></div>}
    </div>
  );
}

function CLForm({tipo,cat,items,session,rol,sucursalesUser,refrescar,showToast,onDone}){
  const sections=tipo==="semanal"?SEMANAL_SEC:MENSUAL_SEC;
  const yo=cat.users.find(u=>u.mail===session.email)||null;
  const availVeh=cat.vehicles.filter(v=>v.activo&&v.combustible!=="Gas LP"&&v.combustible!=="Electrico"&&catVeh(v)==="reparto"&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(v.sucursal)));
  const availUsr=cat.users.filter(u=>u.activo&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(u.sucursal)));
  const[veh,setVeh]=useState(availVeh[0]?String(availVeh[0].id):"");
  const[usr,setUsr]=useState(yo?String(yo.id):availUsr[0]?String(availUsr[0].id):"");
  const[km,setKm]=useState("");const[fotoKm,setFotoKm]=useState(null);const[ans,setAns]=useState({});const[sig,setSig]=useState(null);const[obs,setObs]=useState("");const[step,setStep]=useState(0);const[busy,setBusy]=useState(false);
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  const vehicle=cat.vehicles.find(v=>String(v.id)===String(veh));const user=cat.users.find(u=>String(u.id)===String(usr));
  const total=sections.length+2;const isLast=step===total-1;const curSec=step>0&&step<total-1?sections[step-1]:null;
  const setA=(id,v)=>setAns(a=>({...a,[id]:v}));const getA=id=>ans[id];
  const visible=item=>{if(!item.cond)return true;const[cid,cv]=item.cond.split(":");return String(getA(cid))===cv;};
  const[marcar,setMarcar]=useState(false);
  // Obligatorio responder las preguntas de revisión (select/taco); fotos y datos de texto opcionales
  const faltaCL=item=>visible(item)&&["select","taco"].includes(item.type)&&((getA(item.id)??"")==="");
  const faltanCLSec=its=>(its||[]).filter(faltaCL);
  const submit=async()=>{
    if(busy)return;
    if(!vehicle||!user||!km||!fotoKm){setStep(0);return showToast("⚠️ Faltan datos generales (vehículo, responsable, km y foto).");}
    for(let i=0;i<sections.length;i++){const f=faltanCLSec(sections[i].items);if(f.length){setStep(i+1);setMarcar(true);return showToast("⚠️ Faltan "+f.length+" respuesta(s) en «"+sections[i].title+"». Complétalas para enviar.");}}
    if(!sig)return showToast("⚠️ Falta la firma");
    setBusy(true);
    try{
      const datos={tipo,vehicleId:vehicle.id,placas:vehicle.placas,subMarca:vehicle.subMarca,sucursal:vehicle.sucursal,economico:vehicle.economico,userId:user.id,responsable:user.nombre,km:parseFloat(km),fotoKm,answers:ans,obs,firma:sig,status:"Aprobado"};
      const subido=await api.subirEvidencias("checklist",datos);
      await api.crear("checklist",subido);
      showToast("✓ Checklist enviado");await refrescar();onDone();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:13,fontWeight:700,color:tipo==="semanal"?C.blue:C.green}}>{tipo==="semanal"?"Checklist Semanal":"Checklist Mensual"}</span><span style={{fontSize:11,color:"#888"}}>Paso {step+1}/{total}</span></div>
      <div className="sb">{Array.from({length:total}).map((_,i)=><div key={i} className="sd" style={{background:step>=i?(tipo==="semanal"?C.blue:C.green):"#e0e0e0"}}/>)}</div>
      {step===0&&<div>
        <div className="card"><div className="ct">Datos Generales</div>
          <label>Vehículo</label><select value={veh} onChange={e=>setVeh(e.target.value)}><option value="">— Selecciona —</option>{availVeh.map(v=><option key={v.id} value={v.id}>#{v.economico} · {v.placas}</option>)}</select>
          <label>Responsable que verifica</label><select value={usr} onChange={e=>setUsr(e.target.value)}><option value="">— Selecciona —</option>{availUsr.map(u=><option key={u.id} value={u.id}>{u.nombre}</option>)}</select>
          <label>Kilometraje del día</label><input type="number" value={km} onChange={e=>setKm(e.target.value)} placeholder="Ej. 97710"/>
          <label>Foto del kilometraje</label>
          <div className="pb">{!fotoKm&&<><div style={{fontSize:22}}>📷</div><div style={{marginTop:3}}>Toca para capturar</div></>}{fotoKm&&<img src={fotoKm} alt="km"/>}<input type="file" accept="image/*" capture="environment" onChange={e=>readFile(e,setFotoKm)}/></div>
          {fotoKm&&<button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>setFotoKm(null)}>Cambiar foto</button>}
        </div>
        <button className="bp" disabled={!veh||!usr||!km||!fotoKm} onClick={()=>setStep(1)} style={{background:tipo==="semanal"?C.blue:C.green}}>Siguiente →</button>
      </div>}
      {curSec&&<div>
        {marcar&&faltanCLSec(curSec.items).length>0&&<div className="eb" style={{marginBottom:8}}>⚠️ Faltan {faltanCLSec(curSec.items).length} respuesta(s) por completar (marcadas en rojo).</div>}
        <div className="card"><div className="ct">{curSec.title}</div>
          {curSec.items.map(item=>{
            if(!visible(item))return null;const v=getA(item.id);
            return(

function DmgList({value,onChange}){

function MCForm({tipo,cat,mc,registros,session,sucursalesUser,refrescar,showToast,onDone}){
  const items=tipo==="gas"?ITEMS_GAS:ITEMS_ELEC;
  const yo=cat.users.find(u=>u.mail===session.email)||null;
  const availMC=mc.filter(v=>!sucursalesUser||sucursalesUser.includes(v.sucursal));
  const[eq,setEq]=useState(availMC[0]?String(availMC[0].id):"");
  const[estatus,setEstatus]=useState("Activo");const[dia,setDia]=useState(new Date().toISOString().split("T")[0]);
  const[horas,setHoras]=useState("");
  // Número de semana ISO calculado automáticamente a partir de la fecha de revisión
  const isoSemana=s=>{if(!s)return"";const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+((w1.getDay()+6)%7))/7);};
  const semana=isoSemana(dia);
  const[resps,setResps]=useState({});const[fotos,setFotos]=useState({});const[coments,setComents]=useState({});
  const[obs,setObs]=useState("");const[sig,setSig]=useState(null);const[step,setStep]=useState(0);const[busy,setBusy]=useState(false);const[marcar,setMarcar]=useState(false);
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  const vehicle=cat.vehicles.find(v=>String(v.id)===String(eq));
  // Horas de trabajo: no menor al último ni más de 100 h por encima del último registro
  const lastHoras=(registros||[]).filter(r=>String(r.vehicleId)===String(eq)).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]?.horas??null;
  const horasN=parseFloat(horas);
  const horasErr=horas!==""&&lastHoras!=null?(horasN<lastHoras?`No puede ser menor al último: ${lastHoras} h`:horasN-lastHoras>100?`No puede exceder 100 h del último (${lastHoras} h)`:null):null;
  const CHUNK=10;const chunks=[];for(let i=0;i<items.length;i+=CHUNK)chunks.push(items.slice(i,i+CHUNK));
  const total=chunks.length+2;const isLast=step===total-1;const curChunk=step>0&&step<total-1?chunks[step-1]:null;const off=(step-1)*CHUNK;
  const setR=(i,v)=>setResps(r=>({...r,[i]:v}));const setF=(i,v)=>setFotos(f=>({...f,[i]:v}));const setC=(i,v)=>setComents(c=>({...c,[i]:v}));
  const probs=Object.entries(resps).filter(([,v])=>v==="P");
  const todosResp=items.every((_,i)=>resps[i]);  // todas las preguntas O/P/N/A respondidas
  const canSubmit=!!(eq&&sig&&(estatus!=="Activo"||(todosResp&&probs.every(([i])=>fotos[i]&&coments[i]))));
  const submit=async()=>{
    if(busy)return;
    if(estatus==="Activo"&&!todosResp){
      const i=items.findIndex((_,k)=>!resps[k]);setMarcar(true);setStep(Math.floor(i/CHUNK)+1);
      return showToast("⚠️ Faltan puntos por responder en el chequeo. Complétalos para enviar.");
    }
    if(!canSubmit)return showToast("⚠️ Faltan datos (revisa equipo, firma y fotos de los problemas).");
    setBusy(true);
    try{
      const datos={tipo,username:yo?.nombre||session.nombre,vehicleId:vehicle?.id,placas:vehicle?.placas,subMarca:vehicle?.subMarca,sucursal:vehicle?.sucursal,economico:vehicle?.economico,estatus,dia,semana,horas:parseFloat(horas)||0,resps,fotos,coments,obs,firma:sig,status:"Aprobado",autorizadoPor:"Envío automático"};
      const subido=await api.subirEvidencias("montacargas",datos);
      await api.crear("montacargas",subido);
      showToast("✓ Checklist enviado");await refrescar();onDone();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  const color=tipo==="gas"?C.amber:C.blue;
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:13,fontWeight:700,color}}>{tipo==="gas"?"⛽ Gas/Gasolina":"⚡ Eléctrico"} — Diario</span><span style={{fontSize:11,color:"#888"}}>Paso {step+1}/{total}</span></div>
      <div className="sb">{Array.from({length:total}).map((_,i)=><div key={i} className="sd" style={{background:step>=i?color:"#e0e0e0"}}/>)}</div>
      {step===0&&<div>
        <div className="card"><div className="ct">Información General</div>
          <label>Montacargas</label><select value={eq} onChange={e=>setEq(e.target.value)}><option value="">— Selecciona —</option>{availMC.map(v=><option key={v.id} value={v.id}>#{v.economico} · {v.placas} · {v.subMarca}</option>)}</select>
          {vehicle&&<div style={{marginTop:6,fontSize:12}}><div className="dr"><span>Sucursal</span><span>{vehicle.sucursal}</span></div><div className="dr"><span>Tipo</span><span>{vehicle.combustible}</span></div></div>}
          <label>Estatus del equipo</label><select value={estatus} onChange={e=>setEstatus(e.target.value)}>{ESTATUS_MC.map(o=><option key={o}>{o}</option>)}</select>
          <label>Fecha de revisión</label><input type="date" value={dia} onChange={e=>setDia(e.target.value)}/>
          <div className="r2"><div><label>Semana No. (automática)</label><input type="text" value={semana?"Semana "+semana:""} disabled style={{background:"#f5f5f5",color:"#666"}}/></div><div><label>Horas de trabajo</label><input type="number" value={horas} onChange={e=>setHoras(e.target.value)} placeholder="Ej. 1250"/></div></div>
          {lastHoras!=null&&<div style={{fontSize:11,color:"#888",marginTop:3}}>Último registro: {lastHoras} h</div>}
          {horasErr&&<div className="eb">{horasErr}</div>}
          <label>Quien revisa</label><input type="text" value={yo?.nombre||session.nombre} disabled style={{background:"#f5f5f5",color:"#aaa"}}/>
        </div>
        {estatus!=="Activo"&&<div className="wb">⚠️ Equipo inactivo — solo se registran datos generales y firma.</div>}
        <button className="bp" disabled={!eq||!dia||!!horasErr} onClick={()=>setStep(1)} style={{background:color}}>Siguiente →</button>
      </div>}
      {curChunk&&estatus==="Activo"&&<div>
        {marcar&&curChunk.some((_,idx)=>!resps[off+idx])&&<div className="eb" style={{marginBottom:8}}>⚠️ Faltan {curChunk.filter((_,idx)=>!resps[off+idx]).length} punto(s) por responder (marcados en rojo).</div>}
        <div className="card"><div className="ct">Chequeo Visual — #{off+1} al #{off+curChunk.length}</div>
          {curChunk.map((item,idx)=>{const i=off+idx;const r=resps[i];return(

                {fotos[i]&&<button className="bs" style={{width:"100%",marginTop:4,fontSize:11}} onClick={()=>setF(i,null)}>Cambiar foto</button>}
                <label style={{marginTop:8}}>Descripción del problema</label>
                <textarea rows={2} value={coments[i]||""} onChange={e=>setC(i,e.target.value)} placeholder="Describe el problema..."/>
              </div>}
            </div>
          );})}
        </div>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>{setMarcar(false);setStep(s=>s-1);}}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0,background:color}} onClick={()=>{const f=curChunk.filter((_,idx)=>!resps[off+idx]).length;if(f){setMarcar(true);return showToast("⚠️ Faltan "+f+" punto(s) por responder en esta sección");}setMarcar(false);setStep(s=>s+1);}}>Siguiente →</button></div>
      </div>}
      {curChunk&&estatus!=="Activo"&&<div><div style={{textAlign:"center",padding:"20px 0",color:"#888",fontSize:13}}>Equipo inactivo — chequeo omitido.</div><div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(s=>s-1)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0,background:color}} onClick={()=>setStep(total-1)}>Ir a firma →</button></div></div>}
      {isLast&&<div>

        <div className="card"><div className="ct">Firma de quien revisa</div>
          <canvas ref={sigRef} className="sig" width={340} height={120} onMouseDown={sigH.start} onMouseMove={sigH.move} onMouseUp={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}} onTouchStart={sigH.start} onTouchMove={sigH.move} onTouchEnd={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}}/>
          <button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>sigH.clear(setSig)}>Limpiar</button>

const CHART_ICON="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z";
const EST_LBL={cumplido:"Cumplido",pendiente:"Pendiente",vencido:"Vencido"};
const EST_BDG={cumplido:"dok",pendiente:"dpe",vencido:"drj"};
const EST_COL={cumplido:C.green,pendiente:C.amber,vencido:C.red};
const EST_BG={cumplido:C.greenLt,pendiente:C.amberLt,vencido:C.redLt};

const PERIOD_LBL={semanal:"Semanal",mensual:"Mensual",bimestral:"Bimestral",trimestral:"Trimestral",semestral:"Semestral",anual:"Anual"};

// ── fecha (local) ──
const segAdd=(dt,n)=>{const x=new Date(dt);x.setDate(x.getDate()+n);x.setHours(12,0,0,0);return x;};
const segLunes=dt=>{const x=new Date(dt);const g=x.getDay();x.setDate(x.getDate()+(g===0?-6:1-g));x.setHours(12,0,0,0);return x;};
const segHabil=dt=>{const x=new Date(dt);const g=x.getDay();if(g===6)x.setDate(x.getDate()+2);else if(g===0)x.setDate(x.getDate()+1);x.setHours(12,0,0,0);return x;};
const segCap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const segMesLbl=dt=>segCap(dt.toLocaleDateString("es-MX",{month:"long",year:"numeric"}));
// estado por plazo (comparación de cadenas Y-M-D, ordenables)
const segEstado=(hay,limiteStr,hoyStr)=>hay?"cumplido":(hoyStr>limiteStr?"vencido":"pendiente");
// período vigente de un formulario dinámico según su periodicidad
const segPeriodoForm=(periodicidad,hoy)=>{
  if(periodicidad==="semanal"){const lun=segLunes(hoy),dom=segAdd(lun,6);
    return {ini:ymd(lun),fin:ymd(dom),limite:ymd(lun),label:"Semana "+lun.toLocaleDateString("es-MX",{day:"2-digit",month:"short"})+" – "+dom.toLocaleDateString("es-MX",{day:"2-digit",month:"short"})};}
  const N={mensual:1,bimestral:2,trimestral:3,semestral:6,anual:12}[periodicidad]||1;
  const y=hoy.getFullYear(),mIni=Math.floor(hoy.getMonth()/N)*N;
  const ini=new Date(y,mIni,1,12),fin=new Date(y,mIni+N,0,12),limite=segHabil(new Date(y,mIni,5,12));
  const label=N===1?segMesLbl(ini):(segCap(ini.toLocaleDateString("es-MX",{month:"short"}))+"–"+segMesLbl(fin));
  return {ini:ymd(ini),fin:ymd(fin),limite:ymd(limite),label};
};
// unidades (vehículos) activas de una categoría, dentro del alcance de sucursales
const segUnidades=(cat,tipo,sucs)=>(cat.vehicles||[]).filter(v=>{
  if(!v.activo)return false;
  if(sucs&&!sucs.includes(v.sucursal))return false;
  if(tipo==="combustible")return v.combustible!=="Electrico";
  if(tipo==="reparto")return catVeh(v)==="reparto"&&v.combustible!=="Gas LP"&&v.combustible!=="Electrico";
  if(tipo==="montacargas")return catVeh(v)==="montacargas";
  return false;
});
// último registro de una unidad en un día (dedup: cuenta 1)
const segUltDia=(regs,vid,ds)=>{const g=(regs||[]).filter(r=>String(r.vehicleId)===String(vid)&&ymd(r.fecha)===ds);return g.length?g.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]:null;};
// último registro que cumple pred dentro de un rango [ini,fin] (dedup por período)
const segUltRango=(regs,pred,ini,fin)=>{const g=(regs||[]).filter(r=>{const d=ymd(r.fecha);return d>=ini&&d<=fin&&pred(r);});return g.length?g.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]:null;};

// Calcula el cumplimiento de todos los módulos seleccionados.
function segModulos({cat,combustible,checklist,montacargas,formData,sucs,modKeys,hoy}){
  const hoyStr=ymd(hoy);const out=[];const inc=k=>!modKeys||modKeys.includes(k);const ahora=hoy.getTime();
  // Combustible: (1) Solicitudes L/X/V por unidad, límite 10:00 (hora local/centro de México);
  //             (2) Reportes de carga: cada solicitud APROBADA (asignación) exige un reporte en 18 h.
  if(inc("combustible")){
    const units=segUnidades(cat,"combustible",sucs),lun=segLunes(hoy),dom=segAdd(lun,6);
    const dias=[0,2,4].map(o=>segAdd(lun,o)).filter(d=>ymd(d)<=hoyStr);
    const cols=dias.map(d=>({key:ymd(d),label:["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"][(d.getDay()+6)%7]+" "+d.getDate(),esHoy:ymd(d)===hoyStr}));
    let cu=0,pe=0,ve=0;const problemas=[];
    const esSol=r=>r.formato!=="reporte";
    // (1) Solicitudes — límite 10:00 del día esperado
    const filasSol=units.map(v=>{const celdas=cols.map(c=>{
      const lim10=new Date(c.key+"T10:00:00").getTime();
      const regsDia=(combustible||[]).filter(r=>esSol(r)&&String(r.vehicleId)===String(v.id)&&ymd(r.fecha)===c.key).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
      const onTime=regsDia.find(r=>new Date(r.fecha).getTime()<=lim10);
      const reg=onTime||regsDia[0]||null;
      // Registrada tarde (después de 10:00) SÍ cuenta como cumplida; se marca "tarde" y es
      // clic-able para autorizar. Solo vence si no hay ninguna solicitud y ya pasaron las 10:00.
      let est="pendiente",tarde=false;
      if(onTime)est="cumplido";else if(reg){est="cumplido";tarde=true;}else if(ahora>lim10)est="vencido";
      est==="cumplido"?cu++:est==="vencido"?ve++:pe++;
      return {estado:est,reg,esHoy:c.esHoy,tarde};
    });return {id:v.id,label:"#"+(v.economico||v.id)+(v.placas?" · "+v.placas:""),sub:v.sucursal,celdas};});
    // (2) Reportes de carga por asignación (solicitud aprobada) — límite 18 h desde la aprobación
    const H18=18*3600*1000;const tAp=r=>new Date(r.fechaAut||r.fecha).getTime();
    const asigns=(combustible||[]).filter(r=>esSol(r)&&r.status==="Aprobada"&&(!sucs||sucs.includes(r.sucursal)));
    const reportes=(combustible||[]).filter(r=>r.formato==="reporte");
    const porVeh={};asigns.forEach(a=>{(porVeh[a.vehicleId]=porVeh[a.vehicleId]||[]).push(a);});
    Object.values(porVeh).forEach(arr=>arr.sort((a,b)=>tAp(a)-tAp(b)));
    const enSem=t=>{const d=ymd(new Date(t));return d>=ymd(lun)&&d<=ymd(dom);};
    const filasRep=[];
    Object.keys(porVeh).forEach(vid=>{const arr=porVeh[vid];const v=(cat.vehicles||[]).find(x=>String(x.id)===String(vid))||{};
      arr.forEach((a,i)=>{const ini=tAp(a);if(!enSem(ini))return;const fin=i+1<arr.length?tAp(arr[i+1]):Infinity;
        const rep=reportes.filter(r=>String(r.vehicleId)===String(vid)).map(r=>({r,t:new Date(r.fecha).getTime()})).filter(x=>x.t>=ini&&x.t<fin).sort((a,b)=>a.t-b.t)[0];
        const lim=ini+H18;const est=rep?"cumplido":(ahora>lim?"vencido":"pendiente");
        est==="cumplido"?cu++:est==="vencido"?ve++:pe++;
        filasRep.push({unidad:"#"+(v.economico||vid)+(v.placas?" · "+v.placas:""),sub:v.sucursal||a.sucursal,asignLbl:fdt(a.fechaAut||a.fecha),limiteLbl:fdt(new Date(lim)),estado:est,reg:rep?rep.r:a});
      });});
    // Problemas: solicitudes/reportes rechazados en la semana
    (combustible||[]).filter(r=>r.status==="Rechazada"&&(!sucs||sucs.includes(r.sucursal))&&ymd(r.fecha)>=ymd(lun)&&ymd(r.fecha)<=ymd(dom)).forEach(r=>problemas.push({titulo:"#"+(r.economico||r.vehicleId)+" · "+(r.formato==="reporte"?"Reporte de carga":"Solicitud"),sub:"Rechazada · "+(r.sucursal||"")+" · "+fdate(r.fecha),reg:r,tipo:"combustible"}));
    out.push({key:"combustible",label:"Combustible",grupo:"combustible",periodoLbl:"Solicitudes L/X/V (límite 10:00) + reportes por asignación (18 h)",sol:{cols,filas:filasSol},rep:{filas:filasRep},resumen:{cumplido:cu,pendiente:pe,vencido:ve,total:cu+pe+ve},problemas,conProblemas:true});
  }
  // Reparto: semanal + mensual por unidad (SIN bloque de problemas)
  if(inc("reparto")){
    const units=segUnidades(cat,"reparto",sucs),lun=segLunes(hoy),dom=segAdd(lun,6);
    const iniW=ymd(lun),finW=ymd(dom),limW=ymd(lun);
    const y=hoy.getFullYear(),mes=hoy.getMonth();
    const iniM=ymd(new Date(y,mes,1,12)),finM=ymd(new Date(y,mes+1,0,12)),limM=ymd(segHabil(new Date(y,mes,5,12)));
    const cols=[{key:"sem",label:"Semanal"},{key:"men",label:"Mensual"}];
    let cu=0,pe=0,ve=0;
    const filas=units.map(v=>{const rSem=segUltRango(checklist,r=>String(r.vehicleId)===String(v.id)&&r.tipo==="semanal",iniW,finW);const rMen=segUltRango(checklist,r=>String(r.vehicleId)===String(v.id)&&r.tipo==="mensual",iniM,finM);const eSem=segEstado(!!rSem,limW,hoyStr),eMen=segEstado(!!rMen,limM,hoyStr);[eSem,eMen].forEach(e=>e==="cumplido"?cu++:e==="vencido"?ve++:pe++);return {id:v.id,label:"#"+(v.economico||v.id)+(v.placas?" · "+v.placas:""),sub:v.sucursal,celdas:[{estado:eSem,reg:rSem},{estado:eMen,reg:rMen}]};});
    out.push({key:"reparto",label:"Reparto",grupo:"veh",periodoLbl:"Semana + mes en curso",cols,filas,resumen:{cumplido:cu,pendiente:pe,vencido:ve,total:cu+pe+ve},problemas:[],conProblemas:false});
  }
  // Montacargas: diario por unidad (tira de 7 días; sólo hoy cuenta al %)
  if(inc("montacargas")){
    const units=segUnidades(cat,"montacargas",sucs),dias=[];for(let i=6;i>=0;i--)dias.push(segAdd(hoy,-i));
    const cols=dias.map(d=>({key:ymd(d),label:["Do","Lu","Ma","Mi","Ju","Vi","Sá"][d.getDay()]+" "+d.getDate(),esHoy:ymd(d)===hoyStr}));

      return {id:v.id,label:"#"+(v.economico||v.id)+(v.placas?" · "+v.placas:""),sub:v.sucursal,celdas};});
    out.push({key:"montacargas",label:"Montacargas",grupo:"veh",periodoLbl:"Diario · hoy (+7 días de contexto)",cols,filas,resumen:{cumplido:cu,pendiente:pe,vencido:ve,total:cu+pe+ve},problemas,conProblemas:true,soloHoyCuenta:true});
  }
  // Módulos de formularios dinámicos (sucursales, seguridad, dinámicos) — excepto responsivas
  const formMods=[];(cat.plantillas||[]).forEach(p=>{if(p.modulo&&p.modulo!=="responsivas"&&!formMods.includes(p.modulo))formMods.push(p.modulo);});
  const ORD=["sucursales","seguridad"];formMods.sort((a,b)=>{const ia=ORD.indexOf(a),ib=ORD.indexOf(b);return (ia<0?9:ia)-(ib<0?9:ib)||a.localeCompare(b);});
  formMods.forEach(mk=>{
    if(!inc(mk))return;
    const label=SEG_MOD_LBL[mk]||((cat.modulos||[]).find(mo=>mo.clave===mk)||{}).nombre||mk;
    const plts=(cat.plantillas||[]).filter(p=>p.modulo===mk&&p.activo!==false);
    const cargado=plts.length===0||plts.every(p=>formData[p.clave]!==undefined);
    if(!cargado){out.push({key:mk,label,grupo:"form",cargar:true,plantillas:plts,problemas:[],conProblemas:true});return;}
    let cu=0,pe=0,ve=0;const problemas=[];
    const filas=plts.map(p=>{const per=segPeriodoForm(p.periodicidad||"mensual",hoy);const regs=formData[p.clave]||[];
      const celdas=sucs.map(s=>{const reg=segUltRango(regs,r=>(r.sucursal||"")===s,per.ini,per.fin);const est=segEstado(!!reg,per.limite,hoyStr);est==="cumplido"?cu++:est==="vencido"?ve++:pe++;if(reg&&(reg.resultadoNivel==="fuera"||reg.resultadoNivel==="atencion"))problemas.push({titulo:p.nombre+" · "+s,sub:(reg.resultado||(reg.resultadoNivel==="fuera"?"Fuera de servicio":"Requiere atención"))+" · "+per.label,reg,plantilla:p,tipo:"form"});return {suc:s,estado:est,reg};});
      return {plantilla:p,periodoLbl:PERIOD_LBL[p.periodicidad||"mensual"]+" · "+per.label,celdas};});
    out.push({key:mk,label,grupo:"form",periodoLbl:plts.length+" formulario(s) · por sucursal",cols:sucs.map(s=>({key:s,label:s})),filas,resumen:{cumplido:cu,pendiente:pe,vencido:ve,total:cu+pe+ve},problemas,conProblemas:true});
  });
  return out;
}
// Celdas faltantes (pendiente/vencido) de un módulo, para exportar "qué falta"
function segFaltantes(m){const out=[];
  if(m.grupo==="combustible"){
    (m.sol.filas||[]).forEach(f=>f.celdas.forEach((c,i)=>{if(c.estado!=="cumplido")out.push({q:"Solicitud "+f.label+" — "+((m.sol.cols[i]||{}).label||""),estado:c.estado});}));

function segPDF(mods,meta,logo){
  const JS=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;if(!JS){window.print();return;}
  const doc=new JS({unit:"mm",format:"a4"}),PW=210,PH=297,M=12,CW=PW-2*M;let y=M;
  const ensure=h=>{if(y+h>PH-M){doc.addPage();y=M;}};
  const line=(t,o)=>{o=o||{};const sz=o.size||10;doc.setFont("helvetica",o.bold?"bold":"normal");doc.setFontSize(sz);doc.setTextColor.apply(doc,o.color||[40,40,40]);const ls=doc.splitTextToSize(t,o.w||CW);for(const l of ls){ensure(sz*0.5+1);doc.text(l,o.x||M,y);y+=sz*0.42+1.8;}};
  if(logo){try{const lp=doc.getImageProperties(logo);const lh=14,lw=Math.min(lp.width*(lh/lp.height),22);doc.addImage(logo,"PNG",M,y,lw,lh);}catch(e){}}
  doc.setFont("helvetica","bold");doc.setFontSize(14);doc.setTextColor(24,95,165);doc.text("Tablero de Seguimiento",M+24,y+6);
  doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(90);doc.text("General de Productos para el Agua · "+meta.fechaLbl+" · Sucursal: "+meta.sucursal,M+24,y+11);
  y+=18;doc.setDrawColor(24,95,165);doc.setLineWidth(0.6);doc.line(M,y,PW-M,y);y+=6;
  mods.forEach(m=>{if(m.cargar)return;const r=m.resumen||{};
    ensure(12);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(24,95,165);doc.text(m.label,M,y);y+=1;doc.setDrawColor(225);doc.setLineWidth(0.2);doc.line(M,y,PW-M,y);y+=4;
    line("Cumplimiento "+segPct(r)+"%  ("+r.cumplido+"/"+r.total+")   ·   pendientes "+r.pendiente+"   ·   vencidos "+r.vencido,{size:9,color:[80,80,80]});
    line(m.periodoLbl||"",{size:8,color:[140,140,140]});
    const falt=segFaltantes(m);
    if(falt.length){line("Falta capturar ("+falt.length+"):",{size:9,bold:true,color:[133,79,11]});falt.slice(0,40).forEach(f=>line("•  "+f.q+"  ["+EST_LBL[f.estado]+"]",{size:8.5,x:M+3,w:CW-3,color:f.estado==="vencido"?[163,45,45]:[133,79,11]}));if(falt.length>40)line("… y "+(falt.length-40)+" más",{size:8,x:M+3,color:[150,150,150]});}
    else line("✓ Todo capturado en el período.",{size:9,color:[46,107,48]});
    if(m.conProblemas&&m.problemas.length){line("Qué está mal ("+m.problemas.length+"):",{size:9,bold:true,color:[163,45,45]});m.problemas.slice(0,40).forEach(p=>line("•  "+p.titulo+" — "+p.sub,{size:8.5,x:M+3,w:CW-3,color:[163,45,45]}));}
    y+=4;
  });
  try{doc.save("tablero_seguimiento_"+meta.fecha+".pdf");}catch(e){try{window.open(doc.output("bloburl"),"_blank");}catch(e2){window.print();}}
}

  const selectSuc=<select value={fSuc} onChange={e=>setFSuc(e.target.value)}>{(!sucursalesUser||sucursalesUser.length>1)&&<option value="__todas">Todas {sucursalesUser?"(mías)":""}</option>}{sucAll.map(s=><option key={s} value={s}>{s}</option>)}</select>;

  if(esPC)return(
