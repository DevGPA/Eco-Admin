function SolHistory({items,rol,onSelect}){
  const[f,setF]=useState("Todos");const[rDesde,setRDesde]=useState("");const[rHasta,setRHasta]=useState("");const[fUni,setFUni]=useState("");const[fSuc,setFSuc]=useState("");
  // Archivo histórico bajo demanda: si el filtro pide fechas más viejas que la
  // ventana por defecto del servidor, se consulta ese rango al backend.
  const[ext,setExt]=useState(null);const[extBusy,setExtBusy]=useState(false);
  useEffect(()=>{let vivo=true;if(fueraDeVentana(rDesde,rHasta)){setExtBusy(true);api.listar("combustible",rangoArchivo(rDesde,rHasta)).then(r=>{if(vivo)setExt(r);}).catch(()=>{if(vivo)setExt(null);}).finally(()=>{if(vivo)setExtBusy(false);});}else{setExt(null);setExtBusy(false);}return()=>{vivo=false;};},[rDesde,rHasta]);
  const src=ext||items;
  const list=src.filter(s=>(f==="Todos"||s.status===f)&&(!fSuc||(s.sucursal||"")===fSuc)&&(!fUni||String(s.vehicleId)===fUni)&&(!rDesde||ymd(s.fecha)>=rDesde)&&(!rHasta||ymd(s.fecha)<=rHasta)).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  // CSV COMPLETO: todos los datos capturados en solicitud y reporte (fotos/firma como conteo/Sí-No).
  const nivelTxt=v=>{const o=TANK_OPTS.find(t=>t.val===v);return o?o.label:(v==null?"":v);};
  const nFotos=s=>((s.fotos&&s.fotos.length)?s.fotos.length:(s.photo?1:0))+[s.fotoAntes,s.fotoDespues,s.fotoBomba,s.fotoTicket,s.fotoPersona].filter(Boolean).length;
  const csv=()=>csvDownload("solicitudes_combustible",
    ["Folio","Folio solicitud","Fecha","Tipo","Unidad","Placas","Sub-marca","Sucursal","Área responsable","Responsable","Correo","Combustible","Producto","Precio catálogo/L","Tanque (L)","Kilometraje","Nivel antes","¿Se llenó el tanque?","Litros","Precio/L capturado","Monto","Estado","Autorizó","Fecha autorización","Comentario autorización","Observaciones","Ubicación","Fotos","Firma","Reasignado de","Editado"],
    list.map(s=>[folioDe(s),s.folioSolicitud||"",fdt(s.fecha),s.formato==="reporte"?"Reporte":"Solicitud",s.economico,s.placas,s.subMarca||"",s.sucursal,s.areaResponsable||"",s.responsable,s.mail||"",s.combustible,s.producto||"",s.precio??"",s.tanque??"",s.km??"",s.formato==="reporte"?"":nivelTxt(s.tankBefore),s.lleno||"",s.litros??"",s.precioLitro??"",s.monto??"",s.status,s.autorizadoPor||"",s.fechaAut?fdt(s.fechaAut):"",s.comentarioAut||"",s.obs||"",s.ubicacion?.direccion||"",nFotos(s),s.firma?"Sí":"No",s.reasignacion?("#"+(s.reasignacion.de?.economico||s.reasignacion.de?.vehicleId||"")):(s.reasignadoDe?("#"+(s.reasignadoDe.economico||s.reasignadoDe.vehicleId||"")):""),edTxt(s)]));
  return(
    <div>
      <div className="tr">{["Todos","Pendiente","Por corregir","Aprobada","Rechazada","Anulado"].map(x=><button key={x} className={"trb"+(f===x?" act":"")} onClick={()=>setF(x)}>{x}</button>)}</div>
      <FiltroFechas desde={rDesde} hasta={rHasta} setDesde={setRDesde} setHasta={setRHasta} onCSV={csv} n={list.length} unidades={unidadesDe(fSuc?src.filter(x=>(x.sucursal||"")===fSuc):src)} unidad={fUni} setUnidad={setFUni} sucursales={sucursalesDe(src)} sucursal={fSuc} setSucursal={x=>{setFSuc(x);setFUni("");}}/>
      {extBusy&&<div className="empty">Consultando archivo histórico…</div>}
      {ext&&!extBusy&&<div style={{fontSize:11,color:"#888",marginBottom:8}}>📚 Archivo histórico del servidor ({src.length} registros del rango)</div>}
      {list.length===0&&!extBusy&&<div className="empty">No hay solicitudes</div>}
      <div className="card">{list.map(s=><div key={s.id} className="li" onClick={()=>onSelect(s)}><div className="lit"><span className="lim">{s.placas} · #{s.economico}</span><span className={"bdg "+bcSol(s.status)}>{s.status}</span></div><div className="lis">{s.formato==="reporte"?"📋 Reporte":"📝 Solicitud"} · {s.responsable} · {s.sucursal}</div><div className="lis">{fdate(s.fecha)} · {s.litros}L · <span style={{color:C.blue,fontWeight:600}}>${s.monto?.toLocaleString()}</span></div></div>)}</div>
    </div>
  );
}

// Cambio de unidad de un registro (SOLO admin): corrige capturas hechas en la
// unidad equivocada. Crea un registro NUEVO en la unidad correcta (conservando
// datos y fecha) y deja el viejo ANULADO; ambos cruzan el puente a Fleet Command.
function ReasignarUnidad({tipoApi,reg,cat,rol,refrescar,showToast,onBack}){
  const[nv,setNv]=useState("");const[busy,setBusy]=useState(false);
  if(rol!=="admin"||!cat||reg.status==="Anulado")return null;
  const pool=cat.vehicles.filter(v=>esActivoV(v)&&String(v.id)!==String(reg.vehicleId)&&(tipoApi==="SOL"?!esElectrico(v):tipoApi==="CL"?catVeh(v)==="reparto":catVeh(v)==="montacargas"));
  const aplicar=async()=>{
    if(!nv||busy)return;
    const dest=cat.vehicles.find(v=>String(v.id)===String(nv));
    if(!window.confirm("¿Reasignar este registro de la unidad #"+(reg.economico||reg.vehicleId)+" a la #"+((dest&&dest.economico)||nv)+"?\n\nSe creará un registro NUEVO en la unidad correcta (con los mismos datos y fecha) y este quedará ANULADO. El cambio se refleja en todas las bases (incl. Fleet Command)."))return;
    setBusy(true);
    try{await api.adminReasignarUnidad(tipoApi,reg.id,nv);showToast("✓ Reasignado: registro nuevo en la unidad #"+((dest&&dest.economico)||nv)+"; el anterior quedó anulado.");refrescar&&await refrescar();onBack&&onBack();}
    catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  return(
    <div className="card no-print">
      <div className="ct">Cambiar unidad (corrección de admin)</div>
      {reg.reasignadoDe&&<div className="wb" style={{marginBottom:8}}>↪ Este registro proviene de una reasignación: antes era la unidad #{reg.reasignadoDe.economico||reg.reasignadoDe.vehicleId} · por {reg.reasignadoDe.por} · {fdt(reg.reasignadoDe.en)}</div>}
      {reg.reasignacion&&<div className="wb" style={{marginBottom:8}}>↪ Reasignado: antes era la unidad #{reg.reasignacion.de?.economico||reg.reasignacion.de?.vehicleId} · por {reg.reasignacion.por} · {fdt(reg.reasignacion.en)}</div>}
      <div style={{fontSize:11,color:"#888",marginBottom:8}}>Si este registro se capturó en la unidad equivocada, muévelo a la correcta. Se crea un registro NUEVO en la unidad correcta y este queda ANULADO; el historial, el tablero y Fleet Command se actualizan.</div>
      <div style={{display:"flex",gap:8}}>
        <select value={nv} onChange={e=>setNv(e.target.value)} style={{flex:1}}><option value="">— Unidad correcta —</option>{pool.map(v=><option key={v.id} value={v.id}>#{v.economico} · {v.placas} · {v.sucursal}</option>)}</select>
        <button className="bd" disabled={!nv||busy} onClick={aplicar} style={{whiteSpace:"nowrap"}}>{busy?"Aplicando…":"Reasignar"}</button>
      </div>
    </div>
  );
}

// ─── «Por corregir»: campos corregibles por tipo de registro ──────────
const CAMPOS_CORR_SOL=[
  {id:"km",label:"Kilometraje",tipo:"num"},
  {id:"tankBefore",label:"Nivel de tanque",tipo:"nivel"},
  {id:"fotos",label:"Fotos de evidencia",tipo:"fotos"},
  {id:"firma",label:"Firma",tipo:"firma"},
  {id:"obs",label:"Observaciones",tipo:"texto"},
];
const CAMPOS_CORR_REP=[
  {id:"km",label:"Kilometraje",tipo:"num"},
  {id:"litros",label:"Litros cargados",tipo:"num"},
  {id:"precioLitro",label:"Precio por litro ($)",tipo:"num"},
  {id:"lleno",label:"¿Se llenó el tanque?",tipo:"sino"},
  {id:"fotoAntes",label:"Foto km/medidor ANTES",tipo:"foto"},
  {id:"fotoDespues",label:"Foto medidor al FINALIZAR",tipo:"foto"},
  {id:"fotoBomba",label:"Foto de la bomba",tipo:"foto"},
  {id:"fotoPersona",label:"Foto de quien cargó",tipo:"foto"},
  {id:"fotoTicket",label:"Foto del ticket",tipo:"foto"},
  {id:"obs",label:"Observaciones",tipo:"texto"},
];
const camposCorrDe=sol=>sol.formato==="reporte"?CAMPOS_CORR_REP:CAMPOS_CORR_SOL;

// Editor de corrección: solo los campos que el autorizador marcó; al enviar el
// registro vuelve a «Pendiente». Lo usa quien capturó (o un admin).
function CorregirCombustible({sol,session,rol,cat,refrescar,showToast,onBack}){
  const campos=(sol.camposCorregir||[]).map(String);
  const defs=camposCorrDe(sol).filter(c=>campos.includes(c.id));
  const puedo=rol==="admin"||(session&&sol.accountId===session.email);
  // Las fotos/firma existentes llegan como URLs prefirmadas (no claves S3): NO se
  // pre-cargan (se guardarían URLs que expiran). Se exige recaptura del campo marcado.
  const[val,setVal]=useState(()=>{const o={};defs.forEach(c=>{o[c.id]=(c.tipo==="fotos")?[]:(c.tipo==="foto"||c.tipo==="firma")?null:(sol[c.id]!==undefined?sol[c.id]:(c.tipo==="sino"?"Si":c.tipo==="nivel"?0.25:""));});return o;});
  const[busy,setBusy]=useState(false);const[forzar,setForzar]=useState(false);
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  if(!puedo||!defs.length)return null;
  const vehicle=(cat?.vehicles||[]).find(v=>String(v.id)===String(sol.vehicleId));
  const tanqueCap=vehicle?parseFloat(vehicle.tanque)||0:parseFloat(sol.tanque)||0;
  const set=(id,v)=>setVal(o=>({...o,[id]:v}));
  // Cada campo marcado debe quedar con valor (las fotos/firma, recapturadas).
  const completo=defs.every(c=>{const v=val[c.id];if(c.tipo==="fotos")return (v||[]).length>0;if(c.tipo==="foto"||c.tipo==="firma")return !!v;if(c.tipo==="texto")return true;return v!==""&&v!=null;});
  const submit=async()=>{
    if(busy||!completo)return;setBusy(true);
    try{
      const datos={};defs.forEach(c=>{datos[c.id]=val[c.id];});
      const subido=await api.subirEvidencias("combustible",datos);
      await api.corregir(sol.id,subido,forzar);
      showToast("✓ Corrección enviada. Queda Pendiente de autorización.");
      await refrescar();onBack&&onBack();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  return(<div className="card no-print" style={{border:`1px solid #5E35B1`}}>
    <div className="ct" style={{color:"#5E35B1"}}>Corregir registro (campos marcados)</div>
    {sol.comentarioAut&&<div className="wb">📝 Indicación: {sol.comentarioAut}</div>}
    {defs.map(c=><div key={c.id} style={{marginBottom:10}}>
      <label>{c.label}</label>
      {c.tipo==="num"&&<input type="number" value={val[c.id]} onChange={e=>set(c.id,e.target.value)}/>}
      {c.tipo==="texto"&&<textarea rows={2} value={val[c.id]} onChange={e=>set(c.id,e.target.value)}/>}
      {c.tipo==="sino"&&<div className="rr">{["Si","No"].map(o=><button key={o} className={"rb"+(val[c.id]===o?" O":"")} onClick={()=>set(c.id,o)}>{o}</button>)}</div>}
      {c.tipo==="nivel"&&<div className="tg">{TANK_OPTS.map(o=><button key={o.val} className={"tb"+(val[c.id]===o.val?" sel":"")} onClick={()=>set(c.id,o.val)}>{o.label}</button>)}</div>}
      {c.tipo==="foto"&&<FotoCampo val={val[c.id]} set={v=>set(c.id,v)} label={c.label}/>}
      {c.tipo==="fotos"&&<div>
        {(val[c.id]||[]).length>0&&<div className="fg" style={{marginBottom:8}}>{(val[c.id]||[]).map((src,i)=><div key={i} className="ft"><img src={src} alt={"evidencia "+(i+1)}/><button className="fx" onClick={()=>set(c.id,(val[c.id]||[]).filter((_,j)=>j!==i))}>×</button></div>)}</div>}
        <div className="pb"><div style={{fontSize:22}}>📷</div><div style={{marginTop:3}}>{(val[c.id]||[]).length?"Agregar otra foto":"Toca para capturar"}</div><input type="file" accept="image/*" capture="environment" onChange={e=>{readFile(e,d=>set(c.id,[...(val[c.id]||[]),d]));e.target.value="";}}/></div>
      </div>}
      {c.tipo==="firma"&&<div>
        <canvas ref={sigRef} className="sig" width={340} height={130} onMouseDown={sigH.start} onMouseMove={sigH.move} onMouseUp={()=>{sigH.end();set(c.id,sigRef.current?.toDataURL());}} onTouchStart={sigH.start} onTouchMove={sigH.move} onTouchEnd={()=>{sigH.end();set(c.id,sigRef.current?.toDataURL());}}/>
        <button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>sigH.clear(v=>set(c.id,v))}>Limpiar</button>
      </div>}
      {c.id==="litros"&&tanqueCap>0&&<div style={{fontSize:11,color:"#888",marginTop:3}}>Máx. {tanqueCap} L (capacidad del tanque)</div>}
      {c.id==="precioLitro"&&<div style={{fontSize:11,color:"#888",marginTop:3}}>Máx. $100 por litro</div>}
    </div>)}
    {rol==="admin"&&defs.some(c=>c.id==="km")&&<label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:C.red,marginBottom:6}}><input type="checkbox" checked={forzar} onChange={e=>setForzar(e.target.checked)} style={{width:"auto"}}/>Forzar km fuera de rango (corrección de admin)</label>}
    {defs.some(c=>c.tipo==="foto"||c.tipo==="fotos"||c.tipo==="firma")&&<div style={{fontSize:11,color:"#888",marginBottom:6}}>Las fotos y la firma marcadas deben volver a capturarse.</div>}
    <button className="bp" disabled={busy||!completo} onClick={submit}>{busy?"Enviando…":"Enviar corrección"}</button>
  </div>);
}

// Sello de edición: constancia visible (y en el PDF) de que un admin corrigió el
// registro. El detalle completo de cada cambio vive en `ediciones`.
function SelloEdicion({reg}){
  const eds=(reg&&reg.ediciones)||[];if(!eds.length)return null;
  const u=eds[eds.length-1];
  return(<div className="card" style={{borderLeft:"3px solid "+C.amber}}>
    <div className="ct" style={{color:C.amber}}>✎ Registro editado</div>

    {eds.length>1&&<div className="dr"><span>Ediciones totales</span><span>{eds.length}</span></div>}

// ─── Edición de un registro por un ADMIN (con rastro) ────────────────────────
// Sirve para los cuatro tipos: combustible (SOL), reparto (CL), montacargas (MC) y
// formularios dinámicos (FRM#clave). Conserva el ESTADO del registro y NO permite
// tocar la unidad (eso es «Cambiar unidad») ni la fecha del evento.
// Solo se envían los campos que el admin realmente modificó; las fotos que no se
// reemplazan no viajan, así que conservan su clave en el almacén (una URL firmada
// nunca sustituye a la clave). En arreglos de fotos, las que se conservan se marcan
// «__keep:i» y el servidor las resuelve contra el registro original.
const EDIT_TOP={
  CL:[{id:"km",label:"Kilometraje",tipo:"num"},{id:"fotoKm",label:"Foto de kilometraje",tipo:"foto"},{id:"obs",label:"Observaciones",tipo:"texto"}],
  MC:[{id:"estatus",label:"Estatus del equipo",tipo:"select",opts:ESTATUS_MC},{id:"horas",label:"Horas de trabajo",tipo:"num"},{id:"dia",label:"Fecha de revisión",tipo:"fecha"},{id:"obs",label:"Observaciones",tipo:"texto"}],
  FRM:[{id:"obs",label:"Observaciones",tipo:"texto"},{id:"proximoServicio",label:"Próximo servicio",tipo:"fecha"}],
};
const TIPO_EVID_EDIT={SOL:"combustible",CL:"checklist",MC:"montacargas"};

function EditarRegistro({tipoApi,reg,rol,cat,plantilla,secs,refrescar,showToast,onBack}){
  const[abierto,setAbierto]=useState(false);
  const[d,setD]=useState({});
  const[busy,setBusy]=useState(false);
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  if(rol!=="admin")return null;
  const esFRM=String(tipoApi).startsWith("FRM");
  const base=esFRM?"FRM":tipoApi;
  const tops=base==="SOL"?camposCorrDe(reg):(EDIT_TOP[base]||[]);
  const secciones=secs||(esFRM?((plantilla&&plantilla.secciones)||[]):[]);
  const itemsMC=base==="MC"?(reg.tipo==="gas"?ITEMS_GAS:ITEMS_ELEC):[];
  const set=(ruta,v)=>setD(o=>({...o,[ruta]:v}));
  const val=(ruta,orig)=>d[ruta]!==undefined?d[ruta]:orig;
  const nCambios=Object.keys(d).length;

  const campo=(ruta,def,actual)=>{
    const v=val(ruta,actual);
    if(def.tipo==="num")return <input type="number" step="any" value={v??""} onChange={e=>set(ruta,e.target.value===""?"":parseFloat(e.target.value))}/>;
    if(def.tipo==="texto")return <textarea rows={2} value={v??""} onChange={e=>set(ruta,e.target.value)}/>;
    if(def.tipo==="fecha")return <input type="date" value={v??""} onChange={e=>set(ruta,e.target.value)}/>;
    if(def.tipo==="select")return <select value={v??""} onChange={e=>set(ruta,e.target.value)}><option value="">— Selecciona —</option>{(def.opts||[]).map(o=><option key={o}>{o}</option>)}</select>;
    if(def.tipo==="sino")return <div className="rr">{["Si","No"].map(o=><button key={o} type="button" className={"rb"+(v===o?" O":"")} onClick={()=>set(ruta,o)}>{o}</button>)}</div>;
    if(def.tipo==="nivel")return <div className="tg">{TANK_OPTS.map(o=><button key={o.val} type="button" className={"tb"+(v===o.val?" sel":"")} onClick={()=>set(ruta,o.val)}>{o.label}</button>)}</div>;
    if(def.tipo==="foto")return <FotoCampo val={v} set={x=>set(ruta,x)} label="Toca para reemplazar la foto"/>;
    if(def.tipo==="fotos"){
      // Se normaliza a marcas «__keep:i» desde el primer toque: así ni al quitar ni al
      // agregar se envía una URL firmada en lugar de la clave del almacén.
      const lista=d[ruta]!==undefined?d[ruta]:((reg[def.id]||[]).map((_,i)=>"__keep:"+i));
      return(<div>
        {lista.length>0&&<div className="fg" style={{marginBottom:8}}>{lista.map((src,i)=><div key={i} className="ft"><img src={String(src).indexOf("__keep:")===0?(reg[def.id]||[])[Number(String(src).slice(7))]:src} alt={"foto "+(i+1)}/><button className="fx" onClick={()=>set(ruta,lista.filter((_,j)=>j!==i))}>×</button></div>)}</div>}
        <div className="pb"><div style={{fontSize:20}}>📷</div><div style={{marginTop:3}}>Agregar foto</div><input type="file" accept="image/*" capture="environment" onChange={e=>{readFile(e,x=>set(ruta,[...lista,x]));e.target.value="";}}/></div>
      </div>);
    }
    if(def.tipo==="firma")return(<div>
      {typeof v==="string"&&v.indexOf("data:")===0?<img src={v} style={{width:"100%",borderRadius:8,background:"#f9f9f9"}} alt="firma nueva"/>:null}
      <canvas ref={sigRef} className="sig" width={340} height={130} onMouseDown={sigH.start} onMouseMove={sigH.move} onMouseUp={()=>{sigH.end();set(ruta,sigRef.current?.toDataURL());}} onTouchStart={sigH.start} onTouchMove={sigH.move} onTouchEnd={()=>{sigH.end();set(ruta,sigRef.current?.toDataURL());}}/>
      <button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>sigH.clear(x=>set(ruta,x))}>Limpiar</button>
    </div>);
    return <input type="text" value={v??""} onChange={e=>set(ruta,e.target.value)}/>;
  };

  const guardar=async()=>{
    if(!nCambios||busy)return;
    if(!window.confirm("¿Guardar "+nCambios+" cambio(s) en este registro?\n\nEl estado no cambia y queda registrada la edición (quién, cuándo y qué cambió)."))return;
    setBusy(true);
    try{
      const subidos=await api.subirEvidencias(esFRM?"formulario":TIPO_EVID_EDIT[base],d);
      const detalle=Object.keys(subidos).map(k=>{const et=etiqueta(k);return et?et:k;});
      await api.adminEditarRegistro(tipoApi,reg.id,subidos,detalle);
      showToast("✓ Registro editado ("+nCambios+" campo(s))");
      setD({});setAbierto(false);
      refrescar&&await refrescar();onBack&&onBack();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  // Etiqueta legible de una ruta, para el rastro de la edición
  const etiqueta=ruta=>{
    const t=tops.find(x=>x.id===ruta);if(t)return t.label;
    if(ruta.indexOf("answers.")===0){const id=ruta.slice(8);
      for(const sec of secciones)for(const it of (sec.items||[]))if(it.id===id)return (sec.title?sec.title+" · ":"")+it.label;
      return id;}
    const mm=/^(resps|fotos|coments)\.(\d+)$/.exec(ruta);
    if(mm)return "#"+(Number(mm[2])+1)+" "+(itemsMC[Number(mm[2])]||"").slice(0,60)+(mm[1]==="fotos"?" (foto)":mm[1]==="coments"?" (comentario)":"");
    return ruta;
  };

  const eds=reg.ediciones||[];
  return(<div className="card no-print" style={{border:"1px solid "+C.amber}}>
    <div className="ct" style={{color:C.amber}}>Editar registro (corrección de admin)</div>
    {eds.length>0&&<div className="wb" style={{marginBottom:8}}>✎ Editado {eds.length} vez(ces). Última: <b>{eds[eds.length-1].por}</b> · {fdt(eds[eds.length-1].en)}{eds[eds.length-1].detalle?" · "+[].concat(eds[eds.length-1].detalle).join(", "):""}</div>}
    {!abierto?<>
      <div style={{fontSize:11,color:"#888",marginBottom:8}}>Corrige datos mal capturados sin perder el registro. No cambia el estado, no toca la unidad ni la fecha, y queda constancia de la edición.</div>
      <button className="bs" style={{width:"100%",borderColor:C.amber,color:C.amber}} onClick={()=>setAbierto(true)}>✎ Editar este registro</button>
    </>:<>
      {tops.map(def=><div key={def.id} style={{marginBottom:10}}><label>{def.label}</label>{campo(def.id,def,reg[def.id])}</div>)}
      {secciones.map(sec=><div key={sec.id||sec.title} style={{marginTop:10}}>
        <div style={{fontSize:11,fontWeight:700,color:C.blue,textTransform:"uppercase",marginBottom:6}}>{sec.title}</div>
        {(sec.items||[]).map(item=><CampoForm key={item.id} item={item}
          getA={id=>val("answers."+id,(reg.answers||{})[id])}
          setA={(id,v)=>set("answers."+id,v)}
          availVeh={(cat&&cat.vehicles)||[]}/>)}
      </div>)}
      {base==="MC"&&<div style={{marginTop:10}}>
        <div style={{fontSize:11,fontWeight:700,color:C.blue,textTransform:"uppercase",marginBottom:6}}>Chequeo visual ({itemsMC.length} puntos)</div>
        {itemsMC.map((txt,i)=>{const r=val("resps."+i,(reg.resps||{})[i]);return(
          <div key={i} style={{borderTop:".5px solid #f0f0f0",padding:"6px 0"}}>
            <div style={{fontSize:11.5,color:"#555",lineHeight:1.35,marginBottom:4}}>#{i+1} {txt}</div>
            <div className="rr">{["O","P","N/A"].map(o=><button key={o} type="button" className={"rb"+(r===o?" "+(o==="O"?"O":o==="P"?"P":"NA"):"")} onClick={()=>set("resps."+i,o)}>{o}</button>)}</div>
            {r==="P"&&<div style={{marginTop:6}}>
              <FotoCampo val={val("fotos."+i,(reg.fotos||{})[i])} set={x=>set("fotos."+i,x)} label="Foto del problema"/>
              <textarea rows={2} placeholder="Descripción del problema" value={val("coments."+i,(reg.coments||{})[i])||""} onChange={e=>set("coments."+i,e.target.value)}/>
            </div>}
          </div>);})}
      </div>}
      <div style={{fontSize:11,color:"#888",margin:"8px 0"}}>Se guardarán <b>{nCambios}</b> campo(s) modificado(s). Lo que no toques queda igual.</div>
      <div style={{display:"flex",gap:8}}>
        <button className="bs" onClick={()=>{setD({});setAbierto(false);}}>Cancelar</button>
        <button className="bd" style={{flex:1,background:C.amber,borderColor:C.amber}} disabled={busy||!nCambios} onClick={guardar}>{busy?"Guardando…":"Guardar cambios ("+nCambios+")"}</button>
      </div>
    </>}
  </div>);
}

function CLForm({tipo,cat,items,session,rol,sucursalesUser,refrescar,showToast,onDone}){
  const sections=tipo==="semanal"?SEMANAL_SEC:MENSUAL_SEC;
  // El responsable es SIEMPRE el titular de la cuenta que capturó (unificado con Cuentas).
  const yo={id:session.email,nombre:session.nombre||session.email,mail:session.email};
  // Checklist de reparto: por CATEGORÍA de la unidad (no por combustible — los
  // eléctricos de reparto también se inspeccionan). Gas LP se excluye porque es
  // combustible de montacargas.
  const availVeh=cat.vehicles.filter(v=>esActivoV(v)&&catVeh(v)==="reparto"&&(!sucursalesUser||rol==="admin"||rol==="analista"||sucursalesUser.includes(v.sucursal)));
  // Preselección: la última unidad que ESTE usuario capturó en este módulo.
  const ultUsada=(items||[]).filter(r=>(r.accountId||r.mail)===session.email).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]?.vehicleId;
  const[veh,setVeh]=useState(ultUsada&&availVeh.some(v=>String(v.id)===String(ultUsada))?String(ultUsada):(availVeh[0]?String(availVeh[0].id):""));
  const[km,setKm]=useState("");const[fotoKm,setFotoKm]=useState(null);const[ans,setAns]=useState({});const[sig,setSig]=useState(null);const[obs,setObs]=useState("");const[step,setStep]=useState(0);const[busy,setBusy]=useState(false);const[forzarKm,setForzarKm]=useState(false);
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  const vehicle=cat.vehicles.find(v=>String(v.id)===String(veh));const user={id:session.email,nombre:session.nombre||session.email};
  // Kilometraje: contra el último km REAL de la unidad (odómetro compartido SOL+CL, del backend).
  const lastKm=vehicle&&vehicle.ultimoKm!=null?vehicle.ultimoKm:null;
  const maxDeltaKm=vehicle&&(esGasLP(vehicle)||esElectrico(vehicle))?100:1000;
  const kmN=parseFloat(km);const kmErr=km&&lastKm!=null?(kmN<lastKm?`No puede ser menor al último: ${lastKm.toLocaleString()} km`:kmN-lastKm>maxDeltaKm?`No puede exceder ${maxDeltaKm.toLocaleString()} km del último (${lastKm.toLocaleString()} km)`:null):null;
  const puedeForzar=rol==="admin";const kmBloq=kmErr&&!(puedeForzar&&forzarKm);
  const total=sections.length+2;const isLast=step===total-1;const curSec=step>0&&step<total-1?sections[step-1]:null;
  const setA=(id,v)=>setAns(a=>({...a,[id]:v}));const getA=id=>ans[id];
  const visible=item=>{if(!item.cond)return true;const[cid,cv]=item.cond.split(":");return String(getA(cid))===cv;};
  const[marcar,setMarcar]=useState(false);
  // Obligatorio responder las preguntas de revisión (select/taco); fotos y datos de texto opcionales

function MCForm({tipo,cat,mc,registros,session,rol,sucursalesUser,refrescar,showToast,onDone}){
  const items=tipo==="gas"?ITEMS_GAS:ITEMS_ELEC;
  // El responsable es SIEMPRE el titular de la cuenta que capturó (unificado con Cuentas).
  const yo={id:session.email,nombre:session.nombre||session.email,mail:session.email};
  const availMC=mc.filter(v=>!sucursalesUser||sucursalesUser.includes(v.sucursal));
  // Preselección: el último equipo que ESTE usuario capturó en este módulo.
  const ultUsado=(registros||[]).filter(r=>(r.accountId||r.mail)===session.email).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]?.vehicleId;
  const[eq,setEq]=useState(ultUsado&&availMC.some(v=>String(v.id)===String(ultUsado))?String(ultUsado):(availMC[0]?String(availMC[0].id):""));
  const[estatus,setEstatus]=useState("Activo");const[dia,setDia]=useState(new Date().toISOString().split("T")[0]);
  const[horas,setHoras]=useState("");const[forzarHoras,setForzarHoras]=useState(false);
  // Número de semana ISO calculado automáticamente a partir de la fecha de revisión
  const isoSemana=s=>{if(!s)return"";const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+((w1.getDay()+6)%7))/7);};
  const semana=isoSemana(dia);
  const[resps,setResps]=useState({});const[fotos,setFotos]=useState({});const[coments,setComents]=useState({});
  const[obs,setObs]=useState("");const[sig,setSig]=useState(null);const[step,setStep]=useState(0);const[busy,setBusy]=useState(false);const[marcar,setMarcar]=useState(false);
  const sigRef=useRef(null);const sigH=useSig(sigRef);
  const vehicle=cat.vehicles.find(v=>String(v.id)===String(eq));
  // Horas de trabajo: contra las últimas horas REALES de la unidad (del backend, no
  // solo lo que capturó este usuario). No menor al último ni más de 100 h por encima.
  const lastHoras=vehicle&&vehicle.ultimasHoras!=null?vehicle.ultimasHoras:null;
  const horasN=parseFloat(horas);
  const horasErr=horas!==""&&lastHoras!=null?(horasN<lastHoras?`No puede ser menor al último: ${lastHoras} h`:horasN-lastHoras>100?`No puede exceder 100 h del último (${lastHoras} h)`:null):null;
  const puedeForzar=rol==="admin";const horasBloq=horasErr&&!(puedeForzar&&forzarHoras);
  const CHUNK=10;const chunks=[];for(let i=0;i<items.length;i+=CHUNK)chunks.push(items.slice(i,i+CHUNK));
  const total=chunks.length+2;const isLast=step===total-1;const curChunk=step>0&&step<total-1?chunks[step-1]:null;const off=(step-1)*CHUNK;
  const setR=(i,v)=>setResps(r=>({...r,[i]:v}));const setF=(i,v)=>setFotos(f=>({...f,[i]:v}));const setC=(i,v)=>setComents(c=>({...c,[i]:v}));
  const probs=Object.entries(resps).filter(([,v])=>v==="P");
  const todosResp=items.every((_,i)=>resps[i]);  // todas las preguntas O/P/N/A respondidas
  const canSubmit=!!(eq&&sig&&parseFloat(horas)>0&&!horasBloq&&(estatus!=="Activo"||(todosResp&&probs.every(([i])=>fotos[i]&&coments[i]))));
  const submit=async()=>{
    if(busy)return;
    if(estatus==="Activo"&&!todosResp){
      const i=items.findIndex((_,k)=>!resps[k]);setMarcar(true);setStep(Math.floor(i/CHUNK)+1);
      return showToast("⚠️ Faltan puntos por responder en el chequeo. Complétalos para enviar.");
    }
    if(!canSubmit)return showToast("⚠️ Faltan datos (revisa equipo, horas de trabajo, firma y fotos de los problemas).");
    setBusy(true);
    try{
      const datos={tipo,username:yo?.nombre||session.nombre,vehicleId:vehicle?.id,placas:vehicle?.placas,subMarca:vehicle?.subMarca,sucursal:vehicle?.sucursal,economico:vehicle?.economico,estatus,dia,semana,horas:parseFloat(horas),resps,fotos,coments,obs,firma:sig,status:"Aprobado",autorizadoPor:"Envío automático",...(puedeForzar&&forzarHoras&&horasErr?{forzar:true}:{})};
      const subido=await api.subirEvidencias("montacargas",datos);
      await api.crear("montacargas",subido);
      showToast("✓ Checklist enviado");await refrescar();onDone();
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  const color=tipo==="gas"?C.amber:C.blue;
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:13,fontWeight:700,color}}>{tipo==="gas"?"⛽ Gas/Gasolina":"⚡ Eléctrico"} — Diario</span><span style={{fontSize:11,color:"#888"}}>Paso {step+1}/{total}</span></div>
      <div className="sb">{Array.from({length:total}).map((_,i)=><div key={i} className="sd" style={{background:step>=i?color:"#e0e0e0"}}/>)}</div>
      {step===0&&<div>
        <div className="card"><div className="ct">Información General</div>
          <label>Montacargas</label><select value={eq} onChange={e=>setEq(e.target.value)}><option value="">— Selecciona —</option>{availMC.map(v=><option key={v.id} value={v.id}>#{v.economico} · {v.placas} · {v.subMarca}</option>)}</select>
          {vehicle&&<div style={{marginTop:6,fontSize:12}}><div className="dr"><span>Sucursal</span><span>{vehicle.sucursal}</span></div><div className="dr"><span>Tipo</span><span>{vehicle.combustible}</span></div></div>}
          <label>Estatus del equipo</label><select value={estatus} onChange={e=>setEstatus(e.target.value)}>{ESTATUS_MC.map(o=><option key={o}>{o}</option>)}</select>
          <label>Fecha de revisión</label><input type="date" value={dia} onChange={e=>setDia(e.target.value)}/>
          <div className="r2"><div><label>Semana No. (automática)</label><input type="text" value={semana?"Semana "+semana:""} disabled style={{background:"#f5f5f5",color:"#666"}}/></div><div><label>Horas de trabajo <span style={{color:C.red}}>*</span></label><input type="number" value={horas} onChange={e=>setHoras(e.target.value)} placeholder="Ej. 1250"/></div></div>
          {lastHoras!=null&&<div style={{fontSize:11,color:"#888",marginTop:3}}>Último registro: {lastHoras} h</div>}
          {horasErr&&<div className="eb">{horasErr}</div>}
          {horasErr&&puedeForzar&&<label style={{display:"flex",alignItems:"center",gap:6,fontSize:12,marginTop:6,color:C.red}}><input type="checkbox" checked={forzarHoras} onChange={e=>setForzarHoras(e.target.checked)} style={{width:"auto"}}/>Forzar captura fuera de rango (corrección de admin)</label>}
          <label>Quien revisa</label><input type="text" value={yo?.nombre||session.nombre} disabled style={{background:"#f5f5f5",color:"#aaa"}}/>
        </div>
        {estatus!=="Activo"&&<div className="wb">⚠️ Equipo inactivo — solo se registran datos generales y firma.</div>}
        <button className="bp" disabled={!eq||!dia||!(parseFloat(horas)>0)||!!horasBloq} onClick={()=>setStep(1)} style={{background:color}}>Siguiente →</button>
      </div>}
      {curChunk&&estatus==="Activo"&&<div>
        {marcar&&curChunk.some((_,idx)=>!resps[off+idx])&&<div className="eb" style={{marginBottom:8}}>⚠️ Faltan {curChunk.filter((_,idx)=>!resps[off+idx]).length} punto(s) por responder (marcados en rojo).</div>}
        <div className="card"><div className="ct">Chequeo Visual — #{off+1} al #{off+curChunk.length}</div>
          {curChunk.map((item,idx)=>{const i=off+idx;const r=resps[i];return(
            <div key={i} className="ic" style={marcar&&!r?{outline:"2px solid "+C.red,outlineOffset:1}:null}>
              <div style={{fontSize:11,fontWeight:700,color,marginBottom:4}}>#{i+1}</div>
              <div style={{fontSize:12,color:"#333",marginBottom:8,lineHeight:1.4}}>{item}</div>
              <div className="rr">{["O","P","N/A"].map(opt=><button key={opt} className={`rb${r===opt?" "+(opt==="O"?"O":opt==="P"?"P":"NA"):""}`} onClick={()=>setR(i,opt)}>{opt}</button>)}</div>
              {r==="P"&&<div className="prb">
                <div style={{fontSize:11,fontWeight:700,color:C.red,marginBottom:6}}>⚠️ Problema — requerido:</div>
                <div className="pb">{!fotos[i]&&<><div style={{fontSize:18}}>📷</div><div style={{fontSize:11,marginTop:2}}>Foto del problema</div></>}{fotos[i]&&<img src={fotos[i]} alt="p"/>}<input type="file" accept="image/*" capture="environment" onChange={e=>readFile(e,d=>setF(i,d))}/></div>
                {fotos[i]&&<button className="bs" style={{width:"100%",marginTop:4,fontSize:11}} onClick={()=>setF(i,null)}>Cambiar foto</button>}
                <label style={{marginTop:8}}>Descripción del problema</label>
                <textarea rows={2} value={coments[i]||""} onChange={e=>setC(i,e.target.value)} placeholder="Describe el problema..."/>
              </div>}
            </div>
          );})}
        </div>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>{setMarcar(false);setStep(s=>s-1);}}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0,background:color}} onClick={()=>{const f=curChunk.filter((_,idx)=>!resps[off+idx]).length;if(f){setMarcar(true);return showToast("⚠️ Faltan "+f+" punto(s) por responder en esta sección");}setMarcar(false);setStep(s=>s+1);}}>Siguiente →</button></div>
      </div>}
      {curChunk&&estatus!=="Activo"&&<div><div style={{textAlign:"center",padding:"20px 0",color:"#888",fontSize:13}}>Equipo inactivo — chequeo omitido.</div><div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(s=>s-1)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0,background:color}} onClick={()=>setStep(total-1)}>Ir a firma →</button></div></div>}
      {isLast&&<div>
        {probs.length>0&&<div style={{background:C.redLt,borderRadius:8,padding:"10px 14px",marginBottom:12,fontSize:12,color:C.red}}><b>⚠️ {probs.length} problema(s) detectado(s)</b>{probs.map(([i])=><div key={i}>• #{parseInt(i)+1}: {coments[i]||"Sin descripción"}</div>)}</div>}
        <div className="card"><div className="ct">Observaciones</div><textarea rows={3} value={obs} onChange={e=>setObs(e.target.value)} placeholder="Comentarios adicionales..."/></div>
        <div className="card"><div className="ct">Firma de quien revisa</div>
          <canvas ref={sigRef} className="sig" width={340} height={120} onMouseDown={sigH.start} onMouseMove={sigH.move} onMouseUp={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}} onTouchStart={sigH.start} onTouchMove={sigH.move} onTouchEnd={()=>{sigH.end();setSig(sigRef.current?.toDataURL());}}/>
          <button className="bs" style={{marginTop:6,width:"100%"}} onClick={()=>sigH.clear(setSig)}>Limpiar</button>
          <div style={{marginTop:8,fontSize:12,textAlign:"center"}}><b>{yo?.nombre||session.nombre}</b><br/><span style={{fontSize:11,color:"#888"}}>Notif: {cat.config?.emailRiesgos||"riesgos"}</span></div>
        </div>
        <div style={{display:"flex",gap:8}}><button className="bs" onClick={()=>setStep(s=>s-1)}>← Atrás</button><button className="bp" style={{flex:1,marginTop:0,background:color}} disabled={!canSubmit||busy} onClick={submit}>{busy?"Enviando…":"Enviar checklist"}</button></div>
      </div>}
    </div>
  );
}

// Columnas de RESULTADOS para el CSV de montacargas. Las respuestas se guardan por
// ÍNDICE (resps[i]) y las listas de gas y eléctrico son distintas, así que la columna
// se identifica por el TEXTO de la pregunta (unión de ambas listas, sin repetir).
const MC_PUNTOS=(()=>{const out=[],vistos=new Set();
  [...ITEMS_GAS,...ITEMS_ELEC].forEach(q=>{if(vistos.has(q))return;vistos.add(q);out.push(q);});
  return out;})();
// Respuestas de un registro de montacargas indexadas por texto de pregunta
const mcRespPorTexto=r=>{const its=r.tipo==="gas"?ITEMS_GAS:ITEMS_ELEC;const m={};
  its.forEach((q,i)=>{const v=(r.resps||{})[i];if(v!=null&&v!=="")m[q]=v;});return m;};
const mcProblemas=r=>{const its=r.tipo==="gas"?ITEMS_GAS:ITEMS_ELEC;const out=[];
  its.forEach((q,i)=>{if((r.resps||{})[i]==="P")out.push(q+((r.coments||{})[i]?" ("+r.coments[i]+")":""));});
  return out;};

function MCHistory({items,onSelect}){
  const[f,setF]=useState("Todos");const[rDesde,setRDesde]=useState("");const[rHasta,setRHasta]=useState("");const[fUni,setFUni]=useState("");const[fSuc,setFSuc]=useState("");
  const[ext,setExt]=useState(null);const[extBusy,setExtBusy]=useState(false);
  useEffect(()=>{let vivo=true;if(fueraDeVentana(rDesde,rHasta)){setExtBusy(true);api.listar("montacargas",rangoArchivo(rDesde,rHasta)).then(r=>{if(vivo)setExt(r);}).catch(()=>{if(vivo)setExt(null);}).finally(()=>{if(vivo)setExtBusy(false);});}else{setExt(null);setExtBusy(false);}return()=>{vivo=false;};},[rDesde,rHasta]);
  const src=ext||items;
  const list=src.filter(r=>(f==="Todos"||r.status===f||r.tipo===f)&&(!fSuc||(r.sucursal||"")===fSuc)&&(!fUni||String(r.vehicleId)===fUni)&&(!rDesde||ymd(r.fecha)>=rDesde)&&(!rHasta||ymd(r.fecha)<=rHasta)).sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
  // CSV = TABLA DE RESULTADOS: una fila por checklist y una columna por punto (O/P/N-A).
  const csv=()=>csvDownload("checklist_montacargas",
    ["Folio","Fecha","Tipo","Unidad","Placas","Sucursal","Estatus","Semana","Horas","Estado","Problemas","Detalle problemas","Editado",
      ...MC_PUNTOS],
    list.map(r=>{const m=mcRespPorTexto(r),pr=mcProblemas(r);
      return [folioDe(r),fdt(r.fecha),r.tipo,r.economico,r.placas,r.sucursal,r.estatus,r.semana,r.horas,r.status,pr.length,pr.join(" | "),edTxt(r),
        ...MC_PUNTOS.map(q=>m[q]||"")];}));
  return(
    <div>
      <div className="tr">{["Todos","Pendiente","Aprobado","Rechazado","gas","electrico"].map(x=><button key={x} className={"trb"+(f===x?" act":"")} onClick={()=>setF(x)}>{x==="gas"?"Gas":x==="electrico"?"Eléctrico":x}</button>)}</div>
      <FiltroFechas desde={rDesde} hasta={rHasta} setDesde={setRDesde} setHasta={setRHasta} onCSV={csv} n={list.length} unidades={unidadesDe(fSuc?src.filter(x=>(x.sucursal||"")===fSuc):src)} unidad={fUni} setUnidad={setFUni} sucursales={sucursalesDe(src)} sucursal={fSuc} setSucursal={x=>{setFSuc(x);setFUni("");}}/>
      {extBusy&&<div className="empty">Consultando archivo histórico…</div>}
      {ext&&!extBusy&&<div style={{fontSize:11,color:"#888",marginBottom:8}}>📚 Archivo histórico del servidor ({src.length} registros del rango)</div>}
      {list.length===0&&!extBusy&&<div className="empty">No hay registros</div>}
      <div className="card">{list.map(r=>{const p=Object.values(r.resps||{}).filter(v=>v==="P").length;return(<div key={r.id} className="li" onClick={()=>onSelect(r)}><div className="lit"><span className="lim">{r.placas} · #{r.economico}</span><span className={"bdg "+bcMC(r.status)}>{r.status}</span></div><div className="lis">{r.tipo==="gas"?"⛽ Gas/Gasolina":"⚡ Eléctrico"} · {r.sucursal}</div><div className="lis">{fdate(r.fecha)} · Sem {r.semana||"—"}{p>0&&<span style={{color:C.red,fontWeight:600}}> · {p} problema(s)</span>}</div></div>);})}</div>
    </div>
  );
}

// ─── Metas de seguimiento: cuántos formularios (sin unidad) se esperan por
//     sucursal y con qué período. Tabla editable (solo admin). El Tablero de
//     Seguimiento la lee como base del cumplimiento (X de N). ───────────────
function MetasSeguimiento({cat,refrescarCat,showToast}){
  const sucursales=cat?.sucursales||[];
  const plts=(cat?.plantillas||[]).filter(p=>p.modulo&&p.modulo!=="responsivas"&&p.activo!==false)
    .sort((a,b)=>String(a.modulo).localeCompare(String(b.modulo))||String(a.nombre||a.clave).localeCompare(String(b.nombre||b.clave)));
  const init=()=>{const o={};plts.forEach(p=>{o[p.clave]={periodicidad:p.periodicidad||"mensual",metas:{...(p.metas||{})}};});return o;};
  const[ed,setEd]=useState(init);const[busy,setBusy]=useState(false);
  useEffect(()=>{setEd(init());},[cat?.plantillas]);   // resincroniza tras guardar/refrescar
  const setMeta=(clave,suc,v)=>{const n=v===""?"":Math.max(0,parseInt(v,10)||0);setEd(s=>({...s,[clave]:{...s[clave],metas:{...s[clave].metas,[suc]:n}}}));};
  const setPer=(clave,v)=>setEd(s=>({...s,[clave]:{...s[clave],periodicidad:v}}));
  const dirty=p=>{const e=ed[p.clave];if(!e)return false;if((e.periodicidad||"mensual")!==(p.periodicidad||"mensual"))return true;const om=p.metas||{};const ks=new Set([...Object.keys(om),...Object.keys(e.metas||{})]);for(const k of ks){if(Number(om[k]||0)!==Number(e.metas[k]||0))return true;}return false;};
  const cambiados=plts.filter(dirty);
  const guardar=async()=>{
    if(!cambiados.length||busy)return;setBusy(true);
    try{
      for(const p of cambiados){const e=ed[p.clave];const metas={};Object.entries(e.metas||{}).forEach(([s,n])=>{const x=parseInt(n,10);if(x>0)metas[s]=x;});
        await api.adminPlantilla({...p,periodicidad:e.periodicidad,metas});}
      await refrescarCat();showToast("✓ Metas guardadas ("+cambiados.length+" formulario(s))");
    }catch(e){showToast("⚠️ "+e.message);}
    setBusy(false);
  };
  if(!plts.length)return <div className="card"><div className="empty">Aún no hay formularios (Sucursales/Seguridad/dinámicos). Créalos en Admin → Formularios.</div></div>;
  const PER=[["semanal","Semanal"],["mensual","Mensual"],["bimestral","Bimestral"],["trimestral","Trimestral"],["semestral","Semestral"],["anual","Anual"]];
  return (<div className="seg-root">
    <div className="card"><div className="ct">Metas de seguimiento — formularios por sucursal</div>
      <div style={{fontSize:12,color:"#666",lineHeight:1.5}}>Define <b>cuántos</b> registros de cada formulario se esperan por sucursal y con qué <b>período</b>. El Tablero de Seguimiento los mide como <b>X de N</b>. Deja <b>0</b> (o vacío) donde el formulario <b>no aplica</b>. Edítalas al agregar o quitar equipos. Si un formulario no tiene ninguna meta, se espera 1 por sucursal (como hasta ahora).</div>
    </div>
    <div className="card" style={{overflowX:"auto"}}>
      <table style={{borderCollapse:"collapse",fontSize:12}}>
        <thead><tr>
          <th style={{textAlign:"left",position:"sticky",left:0,background:"#fff",padding:"6px 8px",borderBottom:"1px solid #ddd"}}>Formulario</th>
          <th style={{padding:"6px 8px",borderBottom:"1px solid #ddd"}}>Período</th>
          {sucursales.map(s=><th key={s} style={{padding:"6px 8px",whiteSpace:"nowrap",borderBottom:"1px solid #ddd"}}>{s}</th>)}
        </tr></thead>
        <tbody>
          {plts.map(p=>{const e=ed[p.clave]||{periodicidad:"mensual",metas:{}};const dt=dirty(p);const bg=dt?"#FFFDF0":"#fff";return(
            <tr key={p.clave} style={{borderTop:"1px solid #eee"}}>
              <td style={{padding:"6px 8px",position:"sticky",left:0,background:bg}}><div style={{fontWeight:600}}>{p.nombre||p.clave}</div><div style={{fontSize:10,color:"#999"}}>{SEG_MOD_LBL[p.modulo]||p.modulo}</div></td>
              <td style={{padding:"6px 8px",background:bg}}><select value={e.periodicidad} onChange={ev=>setPer(p.clave,ev.target.value)} style={{width:"auto",padding:"3px 6px",fontSize:12}}>{PER.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></td>
              {sucursales.map(s=><td key={s} style={{padding:"4px 6px",textAlign:"center",background:bg}}><input type="number" min="0" step="1" value={e.metas[s]??""} onChange={ev=>setMeta(p.clave,s,ev.target.value)} placeholder="0" style={{width:52,textAlign:"center",padding:"3px 4px"}}/></td>)}
            </tr>);})}
        </tbody>
      </table>
    </div>
    <button className="bp" disabled={busy||!cambiados.length} onClick={guardar}>{busy?"Guardando…":cambiados.length?("Guardar cambios ("+cambiados.length+")"):"Sin cambios por guardar"}</button>
  </div>);
}

// ─── MÓDULO ADMIN ────────────────────────────────────────────────────
function ModAdmin({cat,refrescarCat,showToast}){
  const[sec,setSec]=useState("vehicles");

  };

// ── fecha (local) ──
const segAdd=(dt,n)=>new Date(new Date(dt).getTime()+n*86400000);
const segLunes=dt=>{const g=mxDow(dt);return segAdd(dt,g===0?-6:1-g);};
const segHabil=dt=>{const g=mxDow(dt);return g===6?segAdd(dt,2):g===0?segAdd(dt,1):new Date(dt);};
const segCap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const segMesLbl=dt=>segCap(dt.toLocaleDateString("es-MX",{month:"long",year:"numeric",timeZone:MX_TZ}));
// estado por plazo (comparación de cadenas Y-M-D, ordenables)
const segEstado=(hay,limiteStr,hoyStr)=>hay?"cumplido":(hoyStr>limiteStr?"vencido":"pendiente");
// período vigente de un formulario dinámico según su periodicidad
const segPeriodoForm=(periodicidad,hoy)=>{
  if(periodicidad==="semanal"){const lun=segLunes(hoy),dom=segAdd(lun,6);
    return {ini:ymd(lun),fin:ymd(dom),limite:ymd(lun),label:"Semana "+lun.toLocaleDateString("es-MX",{day:"2-digit",month:"short",timeZone:MX_TZ})+" – "+dom.toLocaleDateString("es-MX",{day:"2-digit",month:"short",timeZone:MX_TZ})};}
  const N={mensual:1,bimestral:2,trimestral:3,semestral:6,anual:12}[periodicidad]||1;
  const [Y,Mh]=ymd(hoy).split("-").map(Number);const mIni=Math.floor((Mh-1)/N)*N; // mes inicial del bloque (0-based)
  const ini=mxDia(Y,mIni+1,1),fin=mxDia(Y,mIni+N+1,0),limite=segHabil(mxDia(Y,mIni+1,5));
  const label=N===1?segMesLbl(ini):(segCap(ini.toLocaleDateString("es-MX",{month:"short",timeZone:MX_TZ}))+"–"+segMesLbl(fin));
  return {ini:ymd(ini),fin:ymd(fin),limite:ymd(limite),label};
};
// unidades (vehículos) activas de una categoría, dentro del alcance de sucursales
const segUnidades=(cat,tipo,sucs)=>(cat.vehicles||[]).filter(v=>{
  if(!esActivoV(v))return false;                 // inactivos NUNCA cuentan
  if(sucs&&!sucs.includes(v.sucursal))return false;
  if(tipo==="combustible")return !esElectrico(v); // eléctricos no cargan combustible
  // Reparto: SOLO por categoría (una unidad de reparto puede ser gasolina, diésel,
  // eléctrica o Gas LP). Un Gas LP sin categoría explícita se auto-clasifica como montacargas.
  if(tipo==="reparto")return catVeh(v)==="reparto";  // por CATEGORÍA (una unidad de reparto puede ser eléctrica o Gas LP)
  if(tipo==="montacargas")return catVeh(v)==="montacargas";
  return false;
});
// último registro de una unidad en un día (dedup: cuenta 1)
const segUltDia=(regs,vid,ds)=>{const g=(regs||[]).filter(r=>String(r.vehicleId)===String(vid)&&ymd(r.fecha)===ds);return g.length?g.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]:null;};
// último registro que cumple pred dentro de un rango [ini,fin] (dedup por período)
const segUltRango=(regs,pred,ini,fin)=>{const g=(regs||[]).filter(r=>{const d=ymd(r.fecha);return d>=ini&&d<=fin&&pred(r);});return g.length?g.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha))[0]:null;};

// Calcula el cumplimiento de todos los módulos seleccionados.
function segModulos({cat,combustible,checklist,montacargas,formData,sucs,modKeys,hoy}){
  // Los registros ANULADOS (reasignados a otra unidad) no cuentan en NINGÚN módulo:
  // se reemplazan por el registro nuevo en la unidad correcta.
  const _viv=r=>!r||r.status!=="Anulado";
  combustible=(combustible||[]).filter(_viv);checklist=(checklist||[]).filter(_viv);montacargas=(montacargas||[]).filter(_viv);
  const hoyStr=ymd(hoy);const out=[];const inc=k=>!modKeys||modKeys.includes(k);const ahora=hoy.getTime();
  // Fecha de inicio (go-live/reset): no se exige nada cuyo día o plazo sea ANTERIOR a ella.
  const inicio=(cat.config&&cat.config.fechaInicio)||null;
  // Estado considerando la fecha de inicio (go-live): si el plazo original cayó
  // ANTES del inicio pero el período SIGUE en curso, se exige como PENDIENTE
  // (ámbar, sin vencer); si el período ya terminó, queda "No aplica".
  const estIni=(hay,limite,fin)=>{if(hay)return"cumplido";if(inicio&&limite<inicio)return hoyStr<=fin?"pendiente":"na";return hoyStr>limite?"vencido":"pendiente";};
  // Combustible: (1) Solicitudes L/X/V por unidad, límite 10:00 (hora local/centro de México);
  //             (2) Reportes de carga: cada solicitud APROBADA (asignación) exige un reporte en 18 h.
  if(inc("combustible")){
    const units=segUnidades(cat,"combustible",sucs),lun=segLunes(hoy),dom=segAdd(lun,6);
    const dias=[0,2,4].map(o=>segAdd(lun,o)).filter(d=>ymd(d)<=hoyStr&&(!inicio||ymd(d)>=inicio));
    const cols=dias.map(d=>{const ds=ymd(d);return {key:ds,label:["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"][(mxDow(d)+6)%7]+" "+Number(ds.slice(8,10)),esHoy:ds===hoyStr};});
    let cu=0,pe=0,ve=0;const problemas=[];
    const esSol=r=>r.formato!=="reporte";
    // (1) Solicitudes — límite 10:00 (hora de México) del día esperado
    const filasSol=units.map(v=>{const celdas=cols.map(c=>{
      const lim10=mxHora(c.key,10).getTime();
      const regsDia=(combustible||[]).filter(r=>esSol(r)&&String(r.vehicleId)===String(v.id)&&ymd(r.fecha)===c.key).sort((a,b)=>new Date(a.fecha)-new Date(b.fecha));
      const onTime=regsDia.find(r=>new Date(r.fecha).getTime()<=lim10);
      const reg=onTime||regsDia[0]||null;
      // Registrada tarde (después de 10:00) SÍ cuenta como cumplida; se marca "tarde" y es
      // clic-able para autorizar. Solo vence si no hay ninguna solicitud y ya pasaron las 10:00.
      let est="pendiente",tarde=false;
      if(onTime)est="cumplido";else if(reg){est="cumplido";tarde=true;}else if(ahora>lim10)est="vencido";
      est==="cumplido"?cu++:est==="vencido"?ve++:pe++;
      return {estado:est,reg,esHoy:c.esHoy,tarde};
    });return {id:v.id,label:"#"+(v.economico||v.id)+(v.placas?" · "+v.placas:""),sub:v.sucursal,celdas};});
    // (2) Reportes de carga por asignación (solicitud aprobada) — límite 18 h desde la aprobación
    const H18=18*3600*1000;const tAp=r=>new Date(r.fechaAut||r.fecha).getTime();
    const unitIds=new Set(units.map(v=>String(v.id)));
    const asigns=(combustible||[]).filter(r=>esSol(r)&&r.status==="Aprobada"&&unitIds.has(String(r.vehicleId)));
    const reportes=(combustible||[]).filter(r=>r.formato==="reporte");
    const porVeh={};asigns.forEach(a=>{(porVeh[a.vehicleId]=porVeh[a.vehicleId]||[]).push(a);});
    Object.values(porVeh).forEach(arr=>arr.sort((a,b)=>tAp(a)-tAp(b)));
    const enSem=t=>{const d=ymd(new Date(t));return d>=ymd(lun)&&d<=ymd(dom);};
    const filasRep=[];
    Object.keys(porVeh).forEach(vid=>{const arr=porVeh[vid];const v=(cat.vehicles||[]).find(x=>String(x.id)===String(vid))||{};
      arr.forEach((a,i)=>{const ini=tAp(a);if(!enSem(ini))return;const fin=i+1<arr.length?tAp(arr[i+1]):Infinity;
        const rep=reportes.filter(r=>String(r.vehicleId)===String(vid)).map(r=>({r,t:new Date(r.fecha).getTime()})).filter(x=>x.t>=ini&&x.t<fin).sort((a,b)=>a.t-b.t)[0];
        const lim=ini+H18;const est=rep?"cumplido":(ahora>lim?"vencido":"pendiente");
        est==="cumplido"?cu++:est==="vencido"?ve++:pe++;
        filasRep.push({unidad:"#"+(v.economico||vid)+(v.placas?" · "+v.placas:""),sub:v.sucursal||a.sucursal,asignLbl:fdt(a.fechaAut||a.fecha),limiteLbl:fdt(new Date(lim)),estado:est,reg:rep?rep.r:a});
      });});
    // Problemas: solicitudes/reportes rechazados en la semana
    (combustible||[]).filter(r=>r.status==="Rechazada"&&(!sucs||sucs.includes(r.sucursal))&&ymd(r.fecha)>=ymd(lun)&&ymd(r.fecha)<=ymd(dom)).forEach(r=>problemas.push({titulo:"#"+(r.economico||r.vehicleId)+" · "+(r.formato==="reporte"?"Reporte de carga":"Solicitud"),sub:"Rechazada · "+(r.sucursal||"")+" · "+fdate(r.fecha),reg:r,tipo:"combustible"}));
    out.push({key:"combustible",label:"Combustible",grupo:"combustible",periodoLbl:"Solicitudes L/X/V (límite 10:00) + reportes por asignación (18 h)",sol:{cols,filas:filasSol},rep:{filas:filasRep},resumen:{cumplido:cu,pendiente:pe,vencido:ve,total:cu+pe+ve},problemas,conProblemas:true});
  }
  // Reparto: semanal + mensual por unidad (SIN bloque de problemas)
  if(inc("reparto")){
    const units=segUnidades(cat,"reparto",sucs),lun=segLunes(hoy),dom=segAdd(lun,6);
    const iniW=ymd(lun),finW=ymd(dom),limW=ymd(lun);
    const [Y,Mh]=ymd(hoy).split("-").map(Number);
    const iniM=ymd(mxDia(Y,Mh,1)),finM=ymd(mxDia(Y,Mh+1,0)),limM=ymd(segHabil(mxDia(Y,Mh,5)));

  formMods.forEach(mk=>{if(!inc(mk))return;const label=SEG_MOD_LBL[mk]||((cat.modulos||[]).find(mo=>mo.clave===mk)||{}).nombre||mk;const plts=(cat.plantillas||[]).filter(p=>p.modulo===mk&&p.activo!==false);

    if(falt.length){line("Falta capturar ("+falt.length+"):",{size:9,bold:true,color:[133,79,11]});falt.slice(0,40).forEach(f=>line("•  "+f.q+"  ["+EST_LBL[f.estado]+"]",{size:8.5,x:M+3,w:CW-3,color:f.estado==="vencido"?[163,45,45]:[133,79,11]}));if(falt.length>40)line("… y "+(falt.length-40)+" más",{size:8,x:M+3,color:[150,150,150]});}
    else line("✓ Todo capturado en el período.",{size:9,color:[46,107,48]});
    if(m.conProblemas&&m.problemas.length){line("Qué está mal ("+m.problemas.length+"):",{size:9,bold:true,color:[163,45,45]});m.problemas.slice(0,40).forEach(p=>line("•  "+p.titulo+" — "+p.sub,{size:8.5,x:M+3,w:CW-3,color:[163,45,45]}));}
    y+=4;
  });
  try{doc.save("tablero_seguimiento_"+meta.fecha+".pdf");}catch(e){try{window.open(doc.output("bloburl"),"_blank");}catch(e2){window.print();}}
}

// Celda de estado (cuadro con ícono) para las matrices del tablero
function SegCelda({estado,onClick,dim}){
  return<span onClick={onClick} title={EST_LBL[estado]} style={{display:"inline-flex",alignItems:"center",justifyContent:"center",width:26,height:22,borderRadius:5,fontSize:12,fontWeight:700,background:EST_BG[estado],color:EST_COL[estado],border:"1px solid "+EST_COL[estado],opacity:dim?0.4:1,cursor:onClick?"pointer":"default"}}>{EST_ICON[estado]}</span>;
}

function ModSeguimiento({cat,data,rol,sucursalesUser,userMods,session,refrescar,showToast}){
  const hoyRef=useRef(new Date());const hoy=hoyRef.current;
  const refrescarTipo=t=>refrescar?refrescar(t):Promise.resolve();
  const sucAll=sucursalesUser||cat.sucursales;
  const[fSuc,setFSuc]=useState("__todas");
  const sucs=fSuc==="__todas"?sucAll:[fSuc];
  const puede=k=>{if(!userMods)return true;const map={combustible:["combustible"],reparto:["mtto","checklist"],montacargas:["mtto","montacargas"],sucursales:["mtto","sucursales"],seguridad:["seguridad"]};return (map[k]||[k]).some(n=>userMods.includes(n));};
  const formModKeys=[...new Set((cat.plantillas||[]).map(p=>p.modulo).filter(mk=>mk&&mk!=="responsivas"))];
  const allMods=["combustible","reparto","montacargas",...formModKeys].filter(puede);
  const[selMods,setSelMods]=useState(allMods);
  const[formData,setFormData]=useState({});
  const[cargando,setCargando]=useState({});
  const[exp,setExp]=useState({combustible:true,reparto:true,montacargas:true});
  const[detalle,setDetalle]=useState(null);
  const[bajando,setBajando]=useState(false);
  const[desde,setDesde]=useState("");const[hasta,setHasta]=useState("");
  const rango=(desde||hasta)?{desde,hasta}:null;  // rango activo = modo "consulta por fechas"
  // En PC/laptop se despliega el tablero ancho (estilo dashboard); en celular queda como está.
  const[esPC,setEsPC]=useState(()=>typeof window!=="undefined"&&!!(window.matchMedia&&window.matchMedia("(min-width:1000px)").matches));
  useEffect(()=>{if(!window.matchMedia)return;const mq=window.matchMedia("(min-width:1000px)");const h=e=>setEsPC(e.matches);mq.addEventListener?mq.addEventListener("change",h):mq.addListener(h);return()=>{mq.removeEventListener?mq.removeEventListener("change",h):mq.removeListener(h);};},[]);
  const esForm=mk=>formModKeys.includes(mk);
  const pltsDe=mk=>(cat.plantillas||[]).filter(p=>p.modulo===mk&&p.activo!==false);
  const cargarModuloUI=async mk=>{setCargando(s=>({...s,[mk]:true}));const res={};for(const p of pltsDe(mk)){if(formData[p.clave]===undefined){try{res[p.clave]=await api.listarFormulario(p.clave,{desde:SEG_FORM_INICIO()});}catch(e){res[p.clave]=[];}}}setFormData(s=>({...s,...res}));setCargando(s=>({...s,[mk]:false}));};
  const cargarTodos=async()=>{let acc={...formData};for(const mk of formModKeys){if(!puede(mk))continue;for(const p of pltsDe(mk)){if(acc[p.clave]===undefined){try{acc[p.clave]=await api.listarFormulario(p.clave,{desde:SEG_FORM_INICIO()});}catch(e){acc[p.clave]=[];}}}}setFormData(acc);return acc;};
  // Carga paralela de todos los formularios (para el dashboard de PC, que muestra todo expandido)
  const cargarTodosPar=async()=>{const claves=[];formModKeys.forEach(mk=>{if(!puede(mk))return;pltsDe(mk).forEach(p=>{if(formData[p.clave]===undefined)claves.push(p.clave);});});if(!claves.length)return;setCargando(s=>({...s,__all:true}));const res=await Promise.all(claves.map(cl=>api.listarFormulario(cl,{desde:SEG_FORM_INICIO()}).then(r=>[cl,r]).catch(()=>[cl,[]])));const upd={};res.forEach(([cl,r])=>upd[cl]=r);setFormData(s=>({...s,...upd}));setCargando(s=>({...s,__all:false}));};
  useEffect(()=>{if(esPC)cargarTodosPar();/* eslint-disable-next-line */},[esPC]);
  // Consulta por rango del ARCHIVO HISTÓRICO: si "Desde" es más viejo que la
  // ventana por defecto, se cargan del servidor combustible/checklist/montacargas
  // y cada plantilla de formularios para ese rango (extData). El período vigente
  // (sin rango) usa `data`/`formData` de la ventana, sin ir al servidor.
  const[extData,setExtData]=useState(null);const[extBusy,setExtBusy]=useState(false);
  useEffect(()=>{let vivo=true;
    if(fueraDeVentana(desde,hasta)){
      setExtBusy(true);
      (async()=>{
        const r=rangoArchivo(desde,hasta);
        const[comb,chk,mc]=await Promise.all([
          api.listar("combustible",r).catch(()=>[]),
          api.listar("checklist",r).catch(()=>[]),
          api.listar("montacargas",r).catch(()=>[]),
        ]);
        const claves=[];formModKeys.forEach(mk=>{if(!puede(mk))return;pltsDe(mk).forEach(p=>claves.push(p.clave));});
        const fdres=await Promise.all(claves.map(cl=>api.listarFormulario(cl,r).then(x=>[cl,x]).catch(()=>[cl,[]])));
        const fd={};fdres.forEach(([cl,x])=>fd[cl]=x);
        if(vivo)setExtData({combustible:comb,checklist:chk,montacargas:mc,formData:fd});
      })().catch(()=>{if(vivo)setExtData(null);}).finally(()=>{if(vivo)setExtBusy(false);});
    }else{setExtData(null);setExtBusy(false);}
    return()=>{vivo=false;};
  },[desde,hasta]);
  const toggleExp=mk=>{const abriendo=!exp[mk];setExp(s=>({...s,[mk]:abriendo}));if(abriendo&&esForm(mk)&&pltsDe(mk).some(p=>formData[p.clave]===undefined))cargarModuloUI(mk);};
  const toggleMod=mk=>setSelMods(s=>s.includes(mk)?s.filter(x=>x!==mk):[...s,mk]);
  const calcMods=(fd)=>{
    if(rango){
      // Rango viejo → datos del archivo histórico (extData); rango reciente → ventana.
      const D=extData||{combustible:data.combustible,checklist:data.checklist,montacargas:data.montacargas,formData:fd};
      return segModulosRango({cat,combustible:D.combustible,checklist:D.checklist,montacargas:D.montacargas,formData:D.formData||fd,sucs,modKeys:selMods,rango});
    }
    return segModulos({cat,combustible:data.combustible,checklist:data.checklist,montacargas:data.montacargas,formData:fd,sucs,modKeys:selMods,hoy});
  };
  const mods=useMemo(()=>calcMods(formData),[cat,data,formData,extData,fSuc,selMods,desde,hasta]);
  const meta={fecha:ymd(hoy),fechaLbl:hoy.toLocaleDateString("es-MX",{timeZone:MX_TZ}),sucursal:fSuc==="__todas"?"Todas":fSuc,rango:rango?((desde||"inicio")+" a "+(hasta||"hoy")):null};
  const exportar=async fmt=>{if(bajando)return;setBajando(true);showToast("Preparando descarga…");
    try{const fd=await cargarTodos();const full=calcMods(fd);
      if(fmt==="csv")segCSV(full,meta);else if(fmt==="html")segHTML(full,meta,await _logoData());else segPDF(full,meta,await _logoData());showToast("✓ Descarga lista");}
    catch(e){showToast("⚠️ "+e.message);}setBajando(false);};
  const totProblemas=mods.reduce((a,m)=>a+(m.conProblemas?(m.problemas||[]).length:0),0);
  const totVenc=mods.reduce((a,m)=>a+((m.resumen&&!m.cargar)?m.resumen.vencido:0),0);
  const totPend=mods.reduce((a,m)=>a+((m.resumen&&!m.cargar)?m.resumen.pendiente:0),0);
  const inicioCfg=(cat.config&&cat.config.fechaInicio)||null;  // día de inicio (reset/go-live)
  const pctCol=p=>p>=90?C.green:p>=60?C.amber:C.red;
  const modNombre=mk=>SEG_MOD_LBL[mk]||((cat.modulos||[]).find(mo=>mo.clave===mk)||{}).nombre||mk;
  // Tabla de una matriz unidad×columnas (reusada por combustible/veh en el dashboard de PC)
  const TablaVehPC=({cols,filas,soloHoy,tipoKey})=>(<div className="seg-tbl"><table><thead><tr><th className="u">Unidad</th>{cols.map(c=><th key={c.key} style={c.esHoy?{color:C.blue}:null}>{c.label}</th>)}</tr></thead><tbody>{filas.map(f=><tr key={f.id}><td className="u"><b>{f.label}</b>{f.sub&&<div className="sub2">{f.sub}</div>}</td>{f.celdas.map((c,i)=><td key={i}><SegCelda estado={c.estado} dim={soloHoy&&!c.esHoy} onClick={c.reg&&tipoKey?()=>setDetalle({reg:c.reg,tipo:tipoKey}):null}/>{c.tarde&&<div style={{fontSize:9,color:C.red,fontWeight:700}}>tarde</div>}</td>)}</tr>)}</tbody></table></div>);
  const ProblemasPC=({m})=>(m.conProblemas?(m.problemas.length===0?<div style={{fontSize:12,color:C.green,marginTop:10}}>✓ Sin problemas en el período.</div>:<div className="prb" style={{marginTop:12}}><div style={{fontSize:12,fontWeight:700,color:C.red,marginBottom:6}}>🚩 Qué está mal ({m.problemas.length})</div>{m.problemas.map((p,i)=><div key={i} onClick={()=>p.reg&&setDetalle({reg:p.reg,plantilla:p.plantilla,tipo:p.tipo})} style={{padding:"6px 0",borderTop:i?".5px dashed #f0c0c0":"none",cursor:p.reg?"pointer":"default",display:"flex",justifyContent:"space-between",gap:8}}><span><b style={{color:C.red}}>{p.titulo}</b> <span style={{fontSize:11,color:"#a06"}}>{p.sub}</span></span>{p.reg&&<span style={{fontSize:11,color:C.blue}}>Ver ›</span>}</div>)}</div>):<div style={{marginTop:10,fontSize:12,color:"#888",background:"#f7f9fc",border:"1px dashed #e2e8f0",borderRadius:8,padding:"8px 12px"}}>ℹ️ Los problemas de Reparto se consultan en su tablero dedicado.</div>);

  if(detalle){const{reg,plantilla,tipo}=detalle;const cerrar=()=>setDetalle(null);const noop=async()=>{};
    if(tipo==="form")return<FormDinamicoDetail reg={reg} plantilla={plantilla} canAuth={false} reqAut={false} onEstado={noop} showToast={showToast} onBack={cerrar}/>;
    if(tipo==="montacargas")return<MCDetail rec={reg} canAuth={false} cat={cat} rol={rol} refrescar={()=>refrescarTipo("montacargas")} showToast={showToast} onBack={cerrar}/>;
    if(tipo==="combustible")return<SolDetail sol={reg} rol={rol} session={session} cat={cat} refrescar={()=>refrescarTipo("combustible")} showToast={showToast} onBack={cerrar}/>;
    return<div><button className="bs" onClick={cerrar}>← Volver</button><div className="empty">Sin vista de detalle para este registro.</div></div>;
  }
  // Saltar a la sección de un módulo (clic en su tarjeta KPI / fila del resumen)
  const irAModulo=k=>{const el=document.getElementById("segmod-"+k);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});};
  const irAModuloM=k=>{if(!exp[k])toggleExp(k);setTimeout(()=>irAModulo(k),80);};
  const irAProblemas=()=>{const m1=mods.find(m=>m.conProblemas&&(m.problemas||[]).length);if(m1)irAModulo(m1.key);};

  // ── Filtros y chips de módulos (compartidos) ──
  const chipsMods=(cls)=>allMods.map(mk=><span key={mk} className={cls+(selMods.includes(mk)?" on":"")} onClick={()=>toggleMod(mk)}>{modNombre(mk)}{selMods.includes(mk)?" ✓":""}</span>);
  const selectSuc=<select value={fSuc} onChange={e=>setFSuc(e.target.value)}>{(!sucursalesUser||sucursalesUser.length>1)&&<option value="__todas">Todas {sucursalesUser?"(mías)":""}</option>}{sucAll.map(s=><option key={s} value={s}>{s}</option>)}</select>;

  // ═══ LAYOUT PC / LAPTOP (dashboard ancho, estilo mockup) ═══
  if(esPC)return(
    <div className="seg-root">
      <div className="seg-title">📊 Tablero de Seguimiento <span>· Cumplimiento por módulo · Hoy {meta.fechaLbl}{inicioCfg?" · medido desde "+inicioCfg:""}</span></div>
      <div className="seg-tools">
        <div className="seg-alert" style={{background:totVenc?C.redLt:C.greenLt,color:totVenc?C.red:C.green,border:"1px solid "+(totVenc?C.red:C.green)}}>{totVenc?`🔔 ${totVenc} vencido(s)`:"✓ Sin vencidos"}{totPend?` · ${totPend} pendiente(s)`:""}{totProblemas?` · ${totProblemas} problema(s)`:""}</div>
        <div style={{display:"flex",gap:8}}><button className="dlb" disabled={bajando} onClick={()=>exportar("html")}>⬇ HTML</button><button className="dlb" disabled={bajando} onClick={()=>exportar("pdf")}>⬇ PDF</button><button className="dlb" disabled={bajando} onClick={()=>exportar("csv")}>⬇ CSV</button></div>
      </div>
      <div className="seg-fbar">
        <div className="seg-frow"><span className="seg-fl">Sucursal</span>{selectSuc}{sucursalesUser&&<span className="seg-lock">🔒 Limitado a tu acceso</span>}<span className="seg-period">{rango?<>Rango <b>{desde||"inicio"} → {hasta||"hoy"}</b></>:<>Período vigente · Hoy <b>{meta.fechaLbl}</b></>}</span></div>
        <div className="seg-frow"><span className="seg-fl">Módulos</span>{chipsMods("seg-mc")}<span style={{fontSize:11,color:"#aaa"}}>(selección múltiple)</span></div>
        <div className="seg-frow"><span className="seg-fl">Fechas</span><input type="date" value={desde} onChange={e=>setDesde(e.target.value)} style={{width:"auto"}}/><span style={{color:"#888"}}>a</span><input type="date" value={hasta} onChange={e=>setHasta(e.target.value)} style={{width:"auto"}}/>{rango?<><span className="seg-lock" style={{background:C.amberLt,color:C.amber}}>Consulta por rango: ✓ hubo registro · ✗ faltó</span><a onClick={()=>{setDesde("");setHasta("");}} style={{color:C.blue,cursor:"pointer",fontSize:12,fontWeight:600}}>Volver al período vigente</a></>:<span style={{fontSize:11,color:"#aaa"}}>opcional — para consultar por fechas</span>}</div>
        {extBusy&&<div className="seg-frow" style={{color:C.blue,fontSize:12,fontWeight:600}}>📚 Consultando archivo histórico del servidor…</div>}
        {extData&&!extBusy&&<div className="seg-frow" style={{color:"#888",fontSize:12}}>📚 Rango cargado del archivo histórico del servidor.</div>}
      </div>
      {cargando.__all&&<div className="spin"/>}
      <div className="seg-kpis">
        {mods.map(m=>{const p=segPct(m.resumen);return<div key={m.key} className="seg-kpi clk" title={"Ir a "+m.label} onClick={()=>irAModulo(m.key)}><div className="seg-kl">{m.label}</div><div className="seg-kv" style={{color:m.cargar?"#bbb":pctCol(p)}}>{m.cargar?"…":p+"%"}</div><div className="seg-ks">{m.cargar?"cargando…":`${m.resumen.cumplido}/${m.resumen.total} cumplidos`}</div><div className="seg-kbar"><i style={{width:(m.cargar?0:p)+"%",background:pctCol(p)}}/></div></div>;})}
        <div className="seg-kpi clk" title="Ir al primer módulo con problemas" onClick={irAProblemas}><div className="seg-kl">Problemas</div><div className="seg-kv" style={{color:totProblemas?C.red:C.green}}>{totProblemas}</div><div className="seg-ks">sin contar Reparto</div><div className="seg-kbar"><i style={{width:(totProblemas?100:0)+"%",background:C.red}}/></div></div>
      </div>
      {selMods.length===0&&<div className="card"><div className="empty">Selecciona uno o más módulos.</div></div>}
      {mods.map(m=>(
        <div key={m.key} id={"segmod-"+m.key} className="seg-mod">
          <div className="seg-modh"><h2>{m.label}</h2><span className="seg-cad">{m.periodoLbl}</span>{!m.cargar&&<span className="seg-pct" style={{color:pctCol(segPct(m.resumen))}}>{segPct(m.resumen)}%</span>}</div>
          <div className="seg-modb">
            {m.cargar?<div className="spin"/>:<>
              {m.grupo==="combustible"&&<>
                <div className="seg-h3">Solicitudes · límite 10:00</div>
                {m.sol.filas.length?<TablaVehPC cols={m.sol.cols} filas={m.sol.filas} tipoKey="combustible"/>:<div style={{fontSize:12,color:"#888"}}>Sin unidades en el alcance.</div>}
                <div className="seg-h3">Reportes de carga · por asignación (18 h)</div>
                {m.rep.filas.length?<div className="seg-tbl"><table><thead><tr><th className="u">Unidad</th><th className="u">Asignación aprobada</th><th>Reporte</th></tr></thead><tbody>{m.rep.filas.map((f,i)=><tr key={i}><td className="u"><b>{f.unidad}</b>{f.sub&&<div className="sub2">{f.sub}</div>}</td><td className="u" style={{fontSize:11,color:"#888"}}>{f.asignLbl}</td><td><SegCelda estado={f.estado} onClick={f.reg?()=>setDetalle({reg:f.reg,tipo:"combustible"}):null}/></td></tr>)}</tbody></table></div>:<div style={{fontSize:12,color:"#888"}}>Sin asignaciones (solicitudes aprobadas) esta semana — no se pide reporte de carga.</div>}
              </>}
              {m.grupo==="veh"&&(m.filas.length?<TablaVehPC cols={m.cols} filas={m.filas} soloHoy={m.soloHoyCuenta} tipoKey={m.key==="montacargas"?"montacargas":null}/>:<div style={{fontSize:12,color:"#888"}}>Sin unidades en el alcance.</div>)}
              {m.grupo==="form"&&(m.filas.length?<div className="seg-tbl"><table><thead><tr><th className="u">Formulario</th>{sucs.map(s=><th key={s}>{s}</th>)}</tr></thead><tbody>{m.filas.map(f=><tr key={f.plantilla.clave}><td className="u"><b>{f.plantilla.nombre}</b><div className="sub2">{f.periodoLbl}</div></td>{f.celdas.map(c=><td key={c.suc} style={{textAlign:"center"}}><SegCelda estado={c.estado} onClick={c.reg?()=>setDetalle({reg:c.reg,plantilla:f.plantilla,tipo:"form"}):null}/>{c.meta>0&&<div style={{fontSize:9,color:"#888",marginTop:2}}>{c.hechos}/{c.meta}</div>}</td>)}</tr>)}</tbody></table></div>:<div style={{fontSize:12,color:"#888"}}>Sin formularios en el alcance.</div>)}
              <ProblemasPC m={m}/>
            </>}
          </div>
        </div>
      ))}
      <div style={{textAlign:"center",fontSize:11,color:"#aaa",marginTop:10}}>Verde = cumplido · Ámbar = pendiente (en plazo) · Rojo = vencido</div>
    </div>
  );

  return(
    <div className="seg-root">
      <div style={{fontSize:15,fontWeight:700,color:"#222",marginBottom:2}}>📊 Tablero de Seguimiento</div>
      <div style={{fontSize:11,color:"#888",marginBottom:12}}>Cumplimiento por módulo · Hoy {meta.fechaLbl}{inicioCfg?" · medido desde "+inicioCfg:""}</div>
      <div className="card">
        <label>Sucursal</label>
        <select value={fSuc} onChange={e=>setFSuc(e.target.value)}>{(!sucursalesUser||sucursalesUser.length>1)&&<option value="__todas">Todas {sucursalesUser?"(mías)":""}</option>}{sucAll.map(s=><option key={s} value={s}>{s}</option>)}</select>
        <label style={{marginTop:10}}>Módulos</label>
        <div className="tr">{allMods.map(mk=><button key={mk} type="button" className={"trb"+(selMods.includes(mk)?" act":"")} onClick={()=>toggleMod(mk)}>{SEG_MOD_LBL[mk]||((cat.modulos||[]).find(mo=>mo.clave===mk)||{}).nombre||mk}</button>)}</div>
        <label style={{marginTop:10}}>Consultar por fechas <span style={{color:"#aaa",fontWeight:400}}>(opcional)</span></label>
        <div className="r2"><div><input type="date" value={desde} onChange={e=>setDesde(e.target.value)}/></div><div><input type="date" value={hasta} onChange={e=>setHasta(e.target.value)}/></div></div>
        {rango&&<div className="wb" style={{marginTop:8}}>Consulta por rango: <b>✓</b> = hubo registro · <b>✗</b> = faltó. <a onClick={()=>{setDesde("");setHasta("");}} style={{color:C.blue,cursor:"pointer",fontWeight:600}}>Volver al período vigente</a></div>}
        <div style={{display:"flex",gap:6,marginTop:12,flexWrap:"wrap"}}>
          <button className="bs" disabled={bajando} onClick={()=>exportar("html")}>⬇ HTML</button>
          <button className="bs" disabled={bajando} onClick={()=>exportar("pdf")}>⬇ PDF</button>
          <button className="bs" disabled={bajando} onClick={()=>exportar("csv")}>⬇ CSV</button>
        </div>
        <div style={{fontSize:10,color:"#aaa",marginTop:6}}>Las descargas incluyen todos los formularios (se cargan al exportar).</div>
      </div>
      {/* Leyenda */}
      <div className="card" style={{padding:"8px 12px",display:"flex",gap:14,flexWrap:"wrap",fontSize:11,color:"#666"}}>
        <span><SegCelda estado="cumplido"/> Cumplido</span><span><SegCelda estado="pendiente"/> Pendiente (dentro del plazo)</span><span><SegCelda estado="vencido"/> Vencido</span>
      </div>
      {/* Resumen por módulo */}
      <div className="card"><div className="ct">Resumen del período</div>
        {selMods.length===0&&<div className="empty">Selecciona uno o más módulos.</div>}
        {mods.map(m=>{const r=m.resumen;return<div key={m.key} className="dr" style={{alignItems:"center",cursor:"pointer"}} title={"Ir a "+m.label} onClick={()=>irAModuloM(m.key)}><span style={{maxWidth:"48%",color:C.blue,fontWeight:600}}>{m.label} ›</span><span style={{display:"flex",gap:6,alignItems:"center"}}>{m.cargar?<span style={{fontSize:11,color:"#aaa"}}>sin cargar</span>:<><b style={{color:segPct(r)>=90?C.green:segPct(r)>=60?C.amber:C.red}}>{segPct(r)}%</b><span className="bdg dok" style={{fontSize:10}}>{r.cumplido}</span><span className="bdg dpe" style={{fontSize:10}}>{r.pendiente}</span><span className="bdg drj" style={{fontSize:10}}>{r.vencido}</span></>}</span></div>;})}
        {totProblemas>0&&<div style={{marginTop:8,fontSize:12,color:C.red,fontWeight:600}}>⚠️ {totProblemas} problema(s) detectado(s) en el período.</div>}
      </div>
      {/* Secciones por módulo */}
      {mods.map(m=>(
        <div key={m.key} id={"segmod-"+m.key} className="card">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}} onClick={()=>toggleExp(m.key)}>
            <div><div style={{fontSize:13,fontWeight:700,color:C.blue}}>{m.label}</div><div style={{fontSize:11,color:"#888"}}>{m.cargar?"Toca para cargar":(m.periodoLbl||"")}</div></div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>{!m.cargar&&<b style={{fontSize:13,color:segPct(m.resumen)>=90?C.green:segPct(m.resumen)>=60?C.amber:C.red}}>{segPct(m.resumen)}%</b>}<span style={{fontSize:16,color:"#aaa"}}>{exp[m.key]?"▾":"▸"}</span></div>
          </div>
          {exp[m.key]&&<div style={{marginTop:10}}>
            {cargando[m.key]&&<div className="spin"/>}
            {m.cargar&&!cargando[m.key]&&<button className="bs" style={{width:"100%"}} onClick={()=>cargarModuloUI(m.key)}>Cargar formularios de {m.label}</button>}
            {!m.cargar&&m.filas&&m.filas.length===0&&<div className="empty">Sin unidades/formularios en el alcance.</div>}
            {!m.cargar&&m.grupo==="veh"&&m.filas.length>0&&<div style={{overflowX:"auto"}}>
              <table style={{borderCollapse:"collapse",fontSize:12,width:"100%",minWidth:m.cols.length*44+120}}>
                <thead><tr style={{color:"#888"}}><th style={{textAlign:"left",padding:"4px 6px"}}>Unidad</th>{m.cols.map(c=><th key={c.key} style={{padding:"4px 4px",fontWeight:c.esHoy?700:500,color:c.esHoy?C.blue:"#888"}}>{c.label}</th>)}</tr></thead>
                <tbody>{m.filas.map(f=><tr key={f.id} style={{borderTop:".5px solid #f0f0f0"}}><td style={{padding:"5px 6px"}}><div style={{fontWeight:600}}>{f.label}</div><div style={{fontSize:10,color:"#aaa"}}>{f.sub}</div></td>{f.celdas.map((c,i)=>{const verDet=c.reg&&(m.key==="montacargas"||m.key==="combustible");return<td key={i} style={{textAlign:"center",padding:"4px 4px"}}><SegCelda estado={c.estado} dim={m.soloHoyCuenta&&!c.esHoy} onClick={verDet?()=>setDetalle({reg:c.reg,tipo:m.key}):null}/></td>;})}</tr>)}</tbody>
              </table>
            </div>}
            {!m.cargar&&m.grupo==="combustible"&&<div>
              <div style={{fontSize:11,fontWeight:700,color:C.blue,margin:"2px 0 4px"}}>Solicitudes · límite 10:00</div>
              {m.sol.filas.length===0?<div style={{fontSize:11,color:"#aaa"}}>Sin unidades en el alcance.</div>:
              <div style={{overflowX:"auto"}}><table style={{borderCollapse:"collapse",fontSize:12,width:"100%",minWidth:m.sol.cols.length*44+120}}>
                <thead><tr style={{color:"#888"}}><th style={{textAlign:"left",padding:"4px 6px"}}>Unidad</th>{m.sol.cols.map(c=><th key={c.key} style={{padding:"4px 4px",fontWeight:c.esHoy?700:500,color:c.esHoy?C.blue:"#888"}}>{c.label}</th>)}</tr></thead>
                <tbody>{m.sol.filas.map(f=><tr key={f.id} style={{borderTop:".5px solid #f0f0f0"}}><td style={{padding:"5px 6px"}}><div style={{fontWeight:600}}>{f.label}</div><div style={{fontSize:10,color:"#aaa"}}>{f.sub}</div></td>{f.celdas.map((c,i)=><td key={i} style={{textAlign:"center",padding:"4px 4px"}}><SegCelda estado={c.estado} onClick={c.reg?()=>setDetalle({reg:c.reg,tipo:"combustible"}):null}/>{c.tarde&&<div style={{fontSize:8,color:C.red,fontWeight:700}}>tarde</div>}</td>)}</tr>)}</tbody>
              </table></div>}
              <div style={{fontSize:11,fontWeight:700,color:C.blue,margin:"12px 0 4px"}}>Reportes de carga · por asignación (18 h)</div>
              {m.rep.filas.length===0?<div style={{fontSize:11,color:"#aaa"}}>Sin asignaciones (solicitudes aprobadas) esta semana — no se pide reporte.</div>:
              <div style={{overflowX:"auto"}}><table style={{borderCollapse:"collapse",fontSize:12,width:"100%",minWidth:320}}>
                <thead><tr style={{color:"#888"}}><th style={{textAlign:"left",padding:"4px 6px"}}>Unidad</th><th style={{textAlign:"left",padding:"4px 6px"}}>Asignación</th><th style={{padding:"4px 4px"}}>Reporte</th></tr></thead>
                <tbody>{m.rep.filas.map((f,i)=><tr key={i} style={{borderTop:".5px solid #f0f0f0"}}><td style={{padding:"5px 6px"}}><div style={{fontWeight:600}}>{f.unidad}</div><div style={{fontSize:10,color:"#aaa"}}>{f.sub}</div></td><td style={{padding:"5px 6px",fontSize:10,color:"#888"}}>{f.asignLbl}</td><td style={{textAlign:"center",padding:"4px 4px"}}><SegCelda estado={f.estado} onClick={f.reg?()=>setDetalle({reg:f.reg,tipo:"combustible"}):null}/></td></tr>)}</tbody>
              </table></div>}
            </div>}
            {!m.cargar&&m.grupo==="form"&&m.filas.length>0&&<div>{m.filas.map(f=><div key={f.plantilla.clave} style={{padding:"8px 0",borderTop:".5px solid #f0f0f0"}}><div style={{fontSize:12,fontWeight:600}}>{f.plantilla.nombre}</div><div style={{fontSize:10,color:"#aaa",marginBottom:4}}>{f.periodoLbl}</div><div style={{display:"flex",flexWrap:"wrap",gap:8}}>{f.celdas.map(c=><span key={c.suc} style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:11}}>{c.suc} <SegCelda estado={c.estado} onClick={c.reg?()=>setDetalle({reg:c.reg,plantilla:f.plantilla,tipo:"form"}):null}/>{c.meta>0&&<span style={{fontSize:9,color:"#888"}}>{c.hechos}/{c.meta}</span>}</span>)}</div></div>)}</div>}
            {/* Qué está mal */}
            {!m.cargar&&m.conProblemas&&<div style={{marginTop:10}}>
              {m.problemas.length===0?<div style={{fontSize:12,color:C.green}}>✓ Sin problemas en el período.</div>:
              <div className="prb"><div style={{fontSize:12,fontWeight:700,color:C.red,marginBottom:6}}>⚠️ Qué está mal ({m.problemas.length})</div>{m.problemas.map((p,i)=><div key={i} onClick={()=>p.reg&&setDetalle({reg:p.reg,plantilla:p.plantilla,tipo:p.tipo})} style={{padding:"6px 0",borderBottom:i<m.problemas.length-1?".5px dashed #f0c0c0":"none",cursor:p.reg?"pointer":"default"}}><div style={{fontSize:12,fontWeight:600,color:C.red}}>{p.titulo}</div><div style={{fontSize:11,color:"#a06"}}>{p.sub}</div></div>)}</div>}
            </div>}
            {!m.cargar&&!m.conProblemas&&<div style={{marginTop:8,fontSize:11,color:"#aaa"}}>Los problemas de Reparto se revisan en su propio tablero.</div>}
          </div>}
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
