# infrastructure/stack-gpa-fletes.yaml
# Stack completo Motor de Fletes GPA v2.4
# Incluye: Lambda · API Gateway · S3 · DynamoDB · IAM · SQS · SNS
# ─────────────────────────────────────────────────────────────────
# Deploy:
#   aws cloudformation deploy \
#     --template-file stack-gpa-fletes.yaml \
#     --stack-name gpa-fletes-prod \
#     --parameter-overrides Env=prod \
#     --capabilities CAPABILITY_NAMED_IAM
# ─────────────────────────────────────────────────────────────────

AWSTemplateFormatVersion: '2010-09-09'
Description: GPA Admin - Motor de Fletes v2.4 - Stack completo

# ═══════════════════════════════════════════════════════════════════
# PARÁMETROS
# ═══════════════════════════════════════════════════════════════════
Parameters:

  Env:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev
    Description: Ambiente de despliegue

  LambdaMemoryMB:
    Type: Number
    Default: 512
    AllowedValues: [256, 512, 1024, 2048]

  LambdaTimeoutSec:
    Type: Number
    Default: 30

  NotificacionesEmail:
    Type: String
    Default: ''
    Description: Email para alertas (opcional)


# ═══════════════════════════════════════════════════════════════════
# RECURSOS
# ═══════════════════════════════════════════════════════════════════
Resources:

  # ─────────────────────────────────────────────────────────────────
  # 1. DynamoDB — tabla gpa_fletes
  # ─────────────────────────────────────────────────────────────────
  GpaFletesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub gpa_fletes_${Env}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      DeletionProtectionEnabled: !If [IsProd, true, false]

      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: estado
          AttributeType: S
        - AttributeName: fechaEmision
          AttributeType: S
        - AttributeName: origenSucursal
          AttributeType: S
        - AttributeName: fletaRFC
          AttributeType: S
        - AttributeName: destinoEstado
          AttributeType: S

      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

      GlobalSecondaryIndexes:
        - IndexName: estado-fecha-idx
          KeySchema:
            - AttributeName: estado
              KeyType: HASH
            - AttributeName: fechaEmision
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

        - IndexName: origen-fecha-idx
          KeySchema:
            - AttributeName: origenSucursal
              KeyType: HASH
            - AttributeName: fechaEmision
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              [folioCP, codigoMotor, conceptoMotor, estado, fleteBaseUSD, montoBaseUSD]

        - IndexName: fletera-fecha-idx
          KeySchema:
            - AttributeName: fletaRFC
              KeyType: HASH
            - AttributeName: fechaEmision
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              [folioCP, estado, codigoMotor, conceptoMotor, destinoEstado]

        - IndexName: destino-fecha-idx
          KeySchema:
            - AttributeName: destinoEstado
              KeyType: HASH
            - AttributeName: fechaEmision
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY

      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ─────────────────────────────────────────────────────────────────
  # 2. S3 — bucket de documentos
  # ─────────────────────────────────────────────────────────────────
  GpaDocumentosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub gpa-documentos-${Env}-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # Mover procesados a IA después de 90 días
          - Id: MoverProcesadosIA
            Status: Enabled
            Prefix: procesados/
            Transitions:
              - TransitionInDays: 90
                StorageClass: STANDARD_IA
          # Expirar pendientes sin procesar después de 30 días
          - Id: ExpirarPendientes
            Status: Enabled
            Prefix: pendientes/
            ExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: pendientes/
                  - Name: suffix
                    Value: .pdf
            Function: !GetAtt GpaFletesFn.Arn

  # Permiso para que S3 invoque la Lambda
  S3InvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GpaFletesFn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt GpaDocumentosBucket.Arn
      SourceAccount: !Ref AWS::AccountId

  # ─────────────────────────────────────────────────────────────────
  # 3. SQS — cola de procesamiento asíncrono
  # ─────────────────────────────────────────────────────────────────
  GpaFletesQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub gpa-fletes-queue-${Env}
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400   # 1 día
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt GpaFletesDLQ.Arn
        maxReceiveCount: 3

  GpaFletesDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub gpa-fletes-dlq-${Env}
      MessageRetentionPeriod: 1209600  # 14 días

  # Trigger Lambda ← SQS
  SQSTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref GpaFletesFn
      EventSourceArn: !GetAtt GpaFletesQueue.Arn
      BatchSize: 10
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # ─────────────────────────────────────────────────────────────────
  # 4. SNS — alertas de errores y DLQ
  # ─────────────────────────────────────────────────────────────────
  GpaAlertasTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub gpa-alertas-${Env}

  GpaAlertasSubscription:
    Type: AWS::SNS::Subscription
    Condition: TieneEmail
    Properties:
      TopicArn: !Ref GpaAlertasTopic
      Protocol: email
      Endpoint: !Ref NotificacionesEmail

  # ─────────────────────────────────────────────────────────────────
  # 5. IAM — rol de ejecución Lambda
  # ─────────────────────────────────────────────────────────────────
  GpaLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub gpa-fletes-lambda-role-${Env}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GpaDynamoPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt GpaFletesTable.Arn
                  - !Sub ${GpaFletesTable.Arn}/index/*

        - PolicyName: GpaS3Policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:HeadObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt GpaDocumentosBucket.Arn
                  - !Sub ${GpaDocumentosBucket.Arn}/*

        - PolicyName: GpaSQSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:SendMessage
                Resource:
                  - !GetAtt GpaFletesQueue.Arn
                  - !GetAtt GpaFletesDLQ.Arn

        - PolicyName: GpaSNSPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref GpaAlertasTopic

  # ─────────────────────────────────────────────────────────────────
  # 6. Lambda — función principal
  # ─────────────────────────────────────────────────────────────────
  GpaFletesFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub gpa-motor-fletes-${Env}
      Description: Motor de fletes GPA v2.4 — evaluación, DynamoDB, S3
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt GpaLambdaRole.Arn
      MemorySize: !Ref LambdaMemoryMB
      Timeout: !Ref LambdaTimeoutSec
      Code:
        S3Bucket: !Sub gpa-deploy-${Env}-${AWS::AccountId}
        S3Key: lambda/gpa-motor-fletes.zip
      Environment:
        Variables:
          DYNAMO_TABLE:            !Ref GpaFletesTable
          S3_BUCKET:               !Ref GpaDocumentosBucket
          SQS_QUEUE_URL:           !Ref GpaFletesQueue
          SNS_ALERTAS_ARN:         !Ref GpaAlertasTopic
          ENV:                     !Ref Env
          # Parámetros del motor (sobreescribibles sin redespliegue)
          MONTO_MIN_GENERAL:       "350"
          MONTO_MIN_COSTAL:        "1000"
          MONTO_MIN_EQUIPO_COSTAL: "500"
          MONTO_MIN_ACCESORIOS:    "1000"
          PROP_MIN_ELEGIBLE:       "0.50"
          UMBRAL_FLETE_WARN:       "0.15"
          UMBRAL_FLETE_CRIT:       "0.30"
          UMBRAL_TARIFA_DISP:      "0.10"
          UMBRAL_CARGO_ENVIO:      "0.01"
          BACKORDER_ENABLED:       "true"
      Layers:
        - !Ref GpaDependenciasLayer
      Tags:
        Proyecto: GPA-Admin
        Motor:    v2.4
        Env:      !Ref Env

  # Alias prod apuntando a la versión más reciente
  GpaFletesFnAliasLive:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref GpaFletesFn
      FunctionVersion: $LATEST
      Name: live

  # ─────────────────────────────────────────────────────────────────
  # 7. Lambda Layer — dependencias Python
  # ─────────────────────────────────────────────────────────────────
  GpaDependenciasLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub gpa-dependencias-${Env}
      Description: boto3, pydantic — Motor GPA v2.4
      CompatibleRuntimes:
        - python3.12
      Content:
        S3Bucket: !Sub gpa-deploy-${Env}-${AWS::AccountId}
        S3Key: layers/gpa-dependencias.zip

  # ─────────────────────────────────────────────────────────────────
  # 8. API Gateway REST — endpoints del motor
  # ─────────────────────────────────────────────────────────────────
  GpaApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub gpa-motor-api-${Env}
      Description: API Motor de Fletes GPA v2.4
      EndpointConfiguration:
        Types: [REGIONAL]

  # Recurso /evaluar
  ApiRecursoEvaluar:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref GpaApi
      ParentId: !GetAtt GpaApi.RootResourceId
      PathPart: evaluar

  ApiMetodoEvaluar:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref GpaApi
      ResourceId: !Ref ApiRecursoEvaluar
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GpaFletesFn.Arn}/invocations

  # Recurso /monitor
  ApiRecursoMonitor:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref GpaApi
      ParentId: !GetAtt GpaApi.RootResourceId
      PathPart: monitor

  ApiMetodoMonitor:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref GpaApi
      ResourceId: !Ref ApiRecursoMonitor
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GpaFletesFn.Arn}/invocations

  # Recurso /kpis
  ApiRecursoKpis:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref GpaApi
      ParentId: !GetAtt GpaApi.RootResourceId
      PathPart: kpis

  ApiMetodoKpis:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref GpaApi
      ResourceId: !Ref ApiRecursoKpis
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GpaFletesFn.Arn}/invocations

  # Permiso API Gateway → Lambda
  ApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GpaFletesFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GpaApi}/*

  # Deploy de la API
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiMetodoEvaluar
      - ApiMetodoMonitor
      - ApiMetodoKpis
    Properties:
      RestApiId: !Ref GpaApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref GpaApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref Env
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20

  # ─────────────────────────────────────────────────────────────────
  # 9. CloudWatch Alarms
  # ─────────────────────────────────────────────────────────────────
  AlarmLambdaErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub gpa-lambda-errors-${Env}
      AlarmDescription: Errores en Lambda motor fletes
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref GpaFletesFn
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref GpaAlertasTopic

  AlarmDLQMessages:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub gpa-dlq-messages-${Env}
      AlarmDescription: Mensajes en DLQ (solicitudes fallidas)
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: !GetAtt GpaFletesDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref GpaAlertasTopic


# ═══════════════════════════════════════════════════════════════════
# CONDITIONS
# ═══════════════════════════════════════════════════════════════════
Conditions:
  IsProd:    !Equals [!Ref Env, prod]
  TieneEmail: !Not [!Equals [!Ref NotificacionesEmail, '']]


# ═══════════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════════
Outputs:

  ApiUrl:
    Description: URL base de la API del motor de fletes
    Value: !Sub https://${GpaApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}
    Export:
      Name: !Sub GpaMotorApiUrl-${Env}

  LambdaArn:
    Value: !GetAtt GpaFletesFn.Arn
    Export:
      Name: !Sub GpaMotorLambdaArn-${Env}

  TableName:
    Value: !Ref GpaFletesTable
    Export:
      Name: !Sub GpaFletesTable-${Env}

  BucketName:
    Value: !Ref GpaDocumentosBucket
    Export:
      Name: !Sub GpaDocumentosBucket-${Env}

  QueueUrl:
    Value: !Ref GpaFletesQueue
    Export:
      Name: !Sub GpaFletesQueueUrl-${Env}
