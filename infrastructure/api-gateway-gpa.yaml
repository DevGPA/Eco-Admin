# infrastructure/api-gateway-gpa.yaml
# API Gateway HTTP API v2 (más barato y rápido que REST API)
# Motor de Fletes GPA v2.4 — Exposición completa de Lambda
# ─────────────────────────────────────────────────────────────────
# Rutas expuestas:
#   POST  /evaluar              → evaluar solicitud (Capa 0–5)
#   POST  /aprobar              → aprobador 1 aprueba
#   POST  /rechazar             → aprobador 1 rechaza
#   POST  /escalar              → escalar a aprobador 2
#   GET   /monitor              → kanban + filtro fecha
#   GET   /kpis                 → KPIs del mes
#   GET   /solicitud/{id}       → detalle + historial
#   GET   /solicitudes          → listado paginado
#   GET   /auditor/fletera      → por RFC de fletera
#   GET   /auditor/sucursal     → por sucursal origen
#   GET   /auditor/destino      → por estado destino
#   GET   /health               → health check
# ─────────────────────────────────────────────────────────────────
# Deploy:
#   aws cloudformation deploy \
#     --template-file infrastructure/api-gateway-gpa.yaml \
#     --stack-name gpa-api-prod \
#     --parameter-overrides Env=prod LambdaArn=<arn> \
#     --capabilities CAPABILITY_NAMED_IAM
# ─────────────────────────────────────────────────────────────────

AWSTemplateFormatVersion: '2010-09-09'
Description: GPA Motor de Fletes v2.4 — API Gateway HTTP API

# ═══════════════════════════════════════════════════════════════════
# PARÁMETROS
# ═══════════════════════════════════════════════════════════════════
Parameters:

  Env:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev

  LambdaArn:
    Type: String
    Description: ARN de la Lambda gpa-motor-fletes-{env}

  ThrottlingBurst:
    Type: Number
    Default: 50
    Description: Solicitudes simultáneas máximas (burst)

  ThrottlingRate:
    Type: Number
    Default: 20
    Description: Solicitudes por segundo

  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Origen CORS permitido (usar dominio específico en prod)


# ═══════════════════════════════════════════════════════════════════
# RECURSOS
# ═══════════════════════════════════════════════════════════════════
Resources:

  # ─────────────────────────────────────────────────────────────────
  # HTTP API (v2) — más económico y con menos latencia que REST API
  # ─────────────────────────────────────────────────────────────────
  GpaHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub gpa-motor-fletes-${Env}
      Description: API Motor de Fletes GPA v2.4
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-GPA-UserId
          - X-GPA-Source
        MaxAge: 300

  # ─────────────────────────────────────────────────────────────────
  # Integración Lambda → proxy completo
  # ─────────────────────────────────────────────────────────────────
  LambdaIntegracion:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref GpaHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Ref LambdaArn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000

  # ─────────────────────────────────────────────────────────────────
  # RUTAS
  # ─────────────────────────────────────────────────────────────────

  # POST /evaluar — evaluación de solicitud de flete
  RutaEvaluar:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GpaHttpApi
      RouteKey: POST /evaluar
      Target: !Sub integrations/${LambdaIntegracion}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAutorizador

  # POST /aprobar — aprobador 1 aprueba solicitud
  RutaAprobar:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GpaHttpApi
      RouteKey: POST /aprobar
      Target: !Sub integrations/${LambdaIntegracion}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAutorizador

  # POST /rechazar — aprobador 1 rechaza solicitud
  RutaRechazar:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GpaHttpApi
      RouteKey: POST /rechazar
      Target: !Sub integrations/${LambdaIntegracion}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAutorizador

  # POST /escalar — escalar a aprobador 2
  RutaEscalar:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GpaHttpApi
      RouteKey: POST /escalar
      Target: !Sub integrations/${LambdaIntegracion}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAutorizador

  # GET /monitor — kanban del monitor
  RutaMonitor:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GpaHttpApi
      RouteKey: GET /monitor
      Target: !Sub integrations/${LambdaIntegracion}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAutorizador

  # GET /kpis — KPIs del mes para el dashboard
  RutaKpis:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GpaHttpApi
      RouteKey: GET /kpis
      Target: !Sub integrations/${LambdaIntegracion}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAutorizador

  # GET /solicitud/{id} — detalle de una solicitud + historial
  RutaSolicitud:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GpaHttpApi
      RouteKey: GET /solicitud/{id}
      Target: !Sub integrations/${LambdaIntegracion}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAutorizador

  # GET /solicitudes — listado paginado con filtros
  RutaSolicitudes:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GpaHttpApi
      RouteKey: GET /solicitudes
      Target: !Sub integrations/${LambdaIntegracion}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAutorizador

  # GET /auditor/fletera — solicitudes por RFC de fletera
  RutaAuditorFletera:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GpaHttpApi
      RouteKey: GET /auditor/fletera
      Target: !Sub integrations/${LambdaIntegracion}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAutorizador

  # GET /auditor/sucursal — solicitudes por sucursal de origen
  RutaAuditorSucursal:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GpaHttpApi
      RouteKey: GET /auditor/sucursal
      Target: !Sub integrations/${LambdaIntegracion}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAutorizador

  # GET /auditor/destino — solicitudes por estado destino
  RutaAuditorDestino:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GpaHttpApi
      RouteKey: GET /auditor/destino
      Target: !Sub integrations/${LambdaIntegracion}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAutorizador

  # GET /health — health check sin autenticación
  RutaHealth:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref GpaHttpApi
      RouteKey: GET /health
      Target: !Sub integrations/${LambdaIntegracion}
      AuthorizationType: NONE

  # ─────────────────────────────────────────────────────────────────
  # Stage con throttling y logging
  # ─────────────────────────────────────────────────────────────────
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref GpaHttpApi
      StageName: !Ref Env
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: !Ref ThrottlingBurst
        ThrottlingRateLimit:  !Ref ThrottlingRate
        DetailedMetricsEnabled: true
        LoggingLevel: INFO
        DataTraceEnabled: !If [IsDev, true, false]
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId",
           "ip":"$context.identity.sourceIp",
           "requestTime":"$context.requestTime",
           "httpMethod":"$context.httpMethod",
           "routeKey":"$context.routeKey",
           "status":"$context.status",
           "responseLength":"$context.responseLength",
           "integrationLatency":"$context.integrationLatency",
           "userId":"$context.authorizer.claims.email"}
      Tags:
        Proyecto: GPA-Admin
        Motor: v2.4
        Env: !Ref Env

  # ─────────────────────────────────────────────────────────────────
  # JWT Authorizer — Cognito o cualquier IDP compatible con JWT
  # ─────────────────────────────────────────────────────────────────
  JwtAutorizador:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref GpaHttpApi
      AuthorizerType: JWT
      Name: gpa-jwt-auth
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Sub gpa-motor-${Env}
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${GpaUserPool}

  # ─────────────────────────────────────────────────────────────────
  # Cognito User Pool — gestión de usuarios GPA
  # ─────────────────────────────────────────────────────────────────
  GpaUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub gpa-motor-users-${Env}
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      PasswordPolicy:
        MinimumLength: 10
        RequireUppercase: true
        RequireLowercase: true
        RequireNumbers: true
        RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: rol
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints:
            MinLength: '1'
            MaxLength: '50'
        - Name: sucursal
          AttributeDataType: String
          Mutable: true
          StringAttributeConstraints:
            MinLength: '1'
            MaxLength: '10'

  GpaUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub gpa-motor-client-${Env}
      UserPoolId: !Ref GpaUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      AccessTokenValidity: 8
      IdTokenValidity: 8
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours

  # Grupos de usuarios (roles)
  GrupoMotor:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: motor
      UserPoolId: !Ref GpaUserPool
      Description: Puede enviar solicitudes a evaluar

  GrupoAprobador1:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: aprobador1
      UserPoolId: !Ref GpaUserPool
      Description: Puede aprobar / rechazar / escalar solicitudes

  GrupoAprobador2:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: aprobador2
      UserPoolId: !Ref GpaUserPool
      Description: Puede aprobar escalamientos

  GrupoAuditor:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: auditor
      UserPoolId: !Ref GpaUserPool
      Description: Solo lectura — auditoría y reportes

  # ─────────────────────────────────────────────────────────────────
  # Permiso para que API Gateway invoque Lambda
  # ─────────────────────────────────────────────────────────────────
  LambdaPermiso:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${GpaHttpApi}/*

  # ─────────────────────────────────────────────────────────────────
  # CloudWatch Log Group para access logs
  # ─────────────────────────────────────────────────────────────────
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/gpa-motor-${Env}
      RetentionInDays: !If [IsProd, 90, 14]

  # ─────────────────────────────────────────────────────────────────
  # Custom Domain (opcional — descomentar cuando se tenga dominio)
  # ─────────────────────────────────────────────────────────────────
  # GpaDomainName:
  #   Type: AWS::ApiGatewayV2::DomainName
  #   Properties:
  #     DomainName: api-fletes.gpa.com.mx
  #     DomainNameConfigurations:
  #       - CertificateArn: arn:aws:acm:us-east-1:ACCOUNT:certificate/xxx
  #         EndpointType: REGIONAL
  #
  # GpaApiMapping:
  #   Type: AWS::ApiGatewayV2::ApiMapping
  #   Properties:
  #     ApiId: !Ref GpaHttpApi
  #     DomainName: !Ref GpaDomainName
  #     Stage: !Ref ApiStage


# ═══════════════════════════════════════════════════════════════════
# CONDITIONS
# ═══════════════════════════════════════════════════════════════════
Conditions:
  IsProd: !Equals [!Ref Env, prod]
  IsDev:  !Equals [!Ref Env, dev]


# ═══════════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════════
Outputs:

  ApiUrl:
    Description: URL base de la API GPA Motor de Fletes
    Value: !Sub https://${GpaHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}
    Export:
      Name: !Sub GpaApiUrl-${Env}

  ApiId:
    Value: !Ref GpaHttpApi
    Export:
      Name: !Sub GpaApiId-${Env}

  UserPoolId:
    Value: !Ref GpaUserPool
    Export:
      Name: !Sub GpaUserPoolId-${Env}

  UserPoolClientId:
    Value: !Ref GpaUserPoolClient
    Export:
      Name: !Sub GpaUserPoolClientId-${Env}

  CognitoIssuerUrl:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${GpaUserPool}
